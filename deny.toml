[graph]
targets = []
all-features = false
no-default-features = false

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

# Deny openssl and boringssl dependencies
deny = [
    { crate = "openssl", reason = "No system TLS stack: zaino links no TLS (plain HTTP to the validator)" },
    { crate = "openssl-sys", reason = "No system TLS stack: zaino links no TLS (plain HTTP to the validator)" },
    { crate = "boring", reason = "No system TLS stack: zaino links no TLS (plain HTTP to the validator)" },
    { crate = "boring-sys", reason = "No system TLS stack: zaino links no TLS (plain HTTP to the validator)" },
]

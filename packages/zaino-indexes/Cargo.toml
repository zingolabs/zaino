[package]
name = "zaino-indexes"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
description = "Zcash index definitions for the zaino sync engine."

[dependencies]
strum = { workspace = true, features = ["derive"] }
thiserror.workspace = true
zaino-core = { version = "0.1.0", path = "../zaino-core" }
zaino-persistence-codec = { version = "0.1.0", path = "../zaino-persistence-codec" }
zaino-primitives.workspace = true
zaino-sync.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[dev-dependencies]
zaino-persistence = { path = "../zaino-persistence", features = ["testing"] }

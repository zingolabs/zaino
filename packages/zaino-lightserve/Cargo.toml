[package]
name = "zaino-lightserve"
version = "0.1.0"
edition = "2021"
publish = false
description = "POC: lightwalletd-compatible gRPC serve adapter over the LightServeService inner port. Proves the new trait algebra + domain->wire conversion in the adapter; not the production zaino-serve."

[dependencies]
zaino-service = { path = "../zaino-service" }
zaino-core = { path = "../zaino-core" }
zaino-proto = { path = "../zaino-proto" }
thiserror = { workspace = true }
zaino-component = { path = "../zaino-component" }
tonic.workspace = true
futures.workspace = true
tokio = { workspace = true }

[dev-dependencies]
zaino-service = { path = "../zaino-service", features = ["testing"] }
tokio = { version = "1", features = ["macros", "rt"] }

[package]
name = "zaino-service"
version = "0.1.0"
edition = "2021"
publish = false
description = "Zaino's inner driving surface: the segregated capability trait algebra the runtime implements and the outer clients consume."

[dependencies]
zaino-core = { path = "../zaino-core" }
futures = "0.3"

[features]
# In-crate scriptable mock of the driving surface, for testing outer clients
# and adapters against a concrete IndexerService.
testing = []

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

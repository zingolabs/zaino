[package]
name = "zaino-mempool-rpc"
description = "Concrete adapters/implementations for Zaino's mempool ports (hexagonal adapter layer)."
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
version = "0.1.0"

[dependencies]
# Mempool ports + foundational types
zaino-mempool = { workspace = true }

# Shared Zaino
zaino-common = { workspace = true }

# Zebra
zebra-chain = { workspace = true }

# Runtime
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
futures = { workspace = true }
arc-swap = { workspace = true }

# Streams
async-stream = "0.3"

# Utility
thiserror = { workspace = true }

[features]
# Opt-in tip-coherence layer: the `CoherenceService` and its coherent read/stream
# handle, over the matching `zaino-mempool` feature.
tip_aware_mempool = ["zaino-mempool/tip_aware_mempool"]

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util", "macros"] }

[package]
name = "zaino-chainview"
version = "0.1.0"
edition.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true
description = "The best chain by proof of work, the mempool and submission, over trusted validators"

[features]
# `ChainView::set_verified` (standing in for header sync) + `testing::MockPeers`
testing = []

[dependencies]
arc-swap.workspace = true
bytes.workspace = true
fastrand = "2"
futures.workspace = true
imbl.workspace = true
metrics.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
zaino-header-chain.workspace = true
zaino-primitives.workspace = true
zaino-source.workspace = true
zaino-traffic = { version = "0.1.0", path = "../zaino-traffic" }

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
zaino-header-chain = { workspace = true, features = ["testing"] }
zaino-primitives = { workspace = true, features = ["testing"] }
zaino-source = { workspace = true, features = ["testing"] }
zcash_primitives.workspace = true
zcash_protocol.workspace = true

[lints.rust]
unreachable_pub = "warn"

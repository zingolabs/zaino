[package]
name = "zaino-backend-lmdb"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
description = "LMDB backend adapter implementing zaino-persistence traits."

[features]
# Feature-gated commit instrumentation: per-commit put/flush split and
# periodic env-wide LMDB stats, emitted as structured `tracing` events. Pairs
# with `zaino-sync/sync-profile`, which opens the correlating span. Off by
# default; compiled out entirely otherwise.
sync-profile = ["dep:tracing"]

[dependencies]
zaino-persistence = { path = "../zaino-persistence" }
lmdb.workspace = true
lmdb-sys.workspace = true
tracing = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
# The generic backend conformance suite lives behind zaino-persistence's
# `testing` feature; enable it for tests so this backend runs the same contract
# the in-memory backend does.
zaino-persistence = { path = "../zaino-persistence", features = ["testing"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

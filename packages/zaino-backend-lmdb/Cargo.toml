[package]
name = "zaino-backend-lmdb"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
description = "LMDB backend adapter implementing zaino-persistence traits."

[features]
# Feature-gated commit instrumentation: per-commit put/flush split and
# periodic env-wide LMDB stats, emitted as structured `tracing` events. Pairs
# with `zaino-sync/sync-profile`, which opens the correlating span. Off by
# default; compiled out entirely otherwise. `tracing` itself is unconditional:
# `finish_bulk` logs its per-namespace start/end at `info` on every build (a
# bulk merge can run for minutes on mainnet), independent of this feature.
sync-profile = []

[dependencies]
zaino-persistence = { path = "../zaino-persistence" }
lmdb.workspace = true
lmdb-sys.workspace = true
tracing.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"
# The generic backend conformance suite lives behind zaino-persistence's
# `testing` feature; enable it for tests so this backend runs the same contract
# the in-memory backend does.
zaino-persistence = { path = "../zaino-persistence", features = ["testing"] }
# The engine-level regression test drives the real sync engine (parallel
# extraction) over this backend with the toy indexes behind `zaino-sync`'s
# `testing` feature; the codec supplies the reserved namespaces to declare.
# Both are dev-only and acyclic — neither depends on this crate.
zaino-persistence-codec = { path = "../zaino-persistence-codec" }
zaino-sync = { path = "../zaino-sync", features = ["testing"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

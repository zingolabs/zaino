[package]
name = "zaino-persistence"
version = "0.1.0"
edition = "2021"
authors.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The storage core every Zaino index shares: the file layer, manifest commits, immutable sorted segments and the verify report vocabulary."

[features]
# `fs::SimFs`: crash-state enumeration for index tests
testing = []

[dependencies]
thiserror = { workspace = true }
zaino-primitives = { version = "0.2.0", path = "../zaino-primitives" }
serde = { workspace = true, features = ["derive"] }
bytes = { workspace = true }
memmap2 = { workspace = true }
arc-swap = { workspace = true }
crc32fast.workspace = true
zcash_protocol.workspace = true
xorf.workspace = true
rayon.workspace = true
metrics = { workspace = true }
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

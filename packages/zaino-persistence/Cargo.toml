[package]
name = "zaino-persistence"
publish.workspace = true
version.workspace = true
edition = "2021"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The persistence port every Zaino index stores through, and DiskEngine behind it: positional files for sequences, an LSM for maps, one manifest commit."

[features]
# `fs::SimFs` (crash-state enumeration)
testing = []

[dependencies]
thiserror = { workspace = true }
zaino-primitives.workspace = true
serde = { workspace = true, features = ["derive"] }
bytes = { workspace = true }
memmap2 = { workspace = true }
crc32fast.workspace = true
zcash_protocol.workspace = true
xorf.workspace = true
rayon.workspace = true
metrics = { workspace = true }
tracing.workspace = true
imbl.workspace = true
hashbrown.workspace = true
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
metrics-exporter-prometheus.workspace = true
proptest.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[lints.rust]
unreachable_pub = "warn"

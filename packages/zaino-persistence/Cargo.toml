[package]
name = "zaino-persistence"
version = "0.1.0"
edition = "2021"
authors.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The persistence port every Zaino index stores through, and DiskEngine behind it: positional files for sequences, an LSM for maps, one manifest commit."

[features]
# `fs::SimFs` (crash-state enumeration) + `conformance` (the suite every engine runs)
testing = ["dep:proptest"]

[dependencies]
thiserror = { workspace = true }
zaino-primitives = { version = "0.3.0", path = "../zaino-primitives" }
serde = { workspace = true, features = ["derive"] }
bytes = { workspace = true }
memmap2 = { workspace = true }
crc32fast.workspace = true
zcash_protocol.workspace = true
xorf.workspace = true
rayon.workspace = true
metrics = { workspace = true }
tracing.workspace = true
proptest = { workspace = true, optional = true }
imbl.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[lints.rust]
unreachable_pub = "warn"

[package]
name = "zaino-persistence"
version = "0.1.0"
publish = false
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Driven port traits for index persistence (read/write)."

[dependencies]
zaino-primitives = { path = "../zaino-primitives" }
thiserror.workspace = true
proptest = { workspace = true, optional = true }
imbl = { workspace = true, optional = true }

[features]
# `in_memory` backend + `conformance` (the suite every backend runs)
testing = ["dep:proptest", "dep:imbl"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[dev-dependencies]
proptest.workspace = true

[[test]]
name = "conformance"
required-features = ["testing"]

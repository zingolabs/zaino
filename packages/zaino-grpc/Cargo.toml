[package]
name = "zaino-grpc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Lightwalletd-compatible gRPC (CompactTxStreamer) server routing each method to an index, the chain view or the validator."

[dependencies]
zaino-proto = { workspace = true }
thiserror = { workspace = true }
tonic.workspace = true
futures.workspace = true
tokio = { workspace = true }
tower = { workspace = true }
http = "1"
http-body-util = { workspace = true }
bytes = { workspace = true }

# Claimed routes, one per index
zaino-index-compact-block = { workspace = true }
zaino-index-tree-state = { workspace = true }
zaino-index-transparent-address = { workspace = true }
# Domain values rendered onto the wire (index dispatches, `LightdInfo`'s upgrade schedule)
zaino-primitives = { workspace = true }
# TreeState carries its trees as hex strings.
hex = { workspace = true }
# t-address string -> `TransparentAddress` -> its locking script
zcash_address = { workspace = true }
zcash_transparent.workspace = true
zcash_script.workspace = true
# `NetworkType`: `LightdInfo.chainName` (declared)
zcash_protocol = { workspace = true }
prost.workspace = true
http-body = "1.1.0"
zaino-source = { version = "0.2.0", path = "../zaino-source" }
metrics = { workspace = true }
zaino-chainview = { version = "0.1.0", path = "../zaino-chainview" }
tokio-util = { workspace = true, features = ["rt"] }
ppp = "2.3"
ipnet = "2.12"
socket2 = { version = "0.6", features = ["all"] }
tracing.workspace = true
hyper-util = { workspace = true, features = ["http2", "server", "server-auto", "server-graceful", "service", "tokio"] }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
arc-swap = { workspace = true }
zaino-persistence = { version = "0.1.0", path = "../zaino-persistence" }
zaino-nfs.workspace = true
zaino-sync.workspace = true
zaino-traffic = { version = "0.1.0", path = "../zaino-traffic" }

[dev-dependencies]
rcgen = { workspace = true }
tempfile = { workspace = true }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "test-util"] }
zaino-index-compact-block = { workspace = true, features = ["testing"] }
zaino-primitives = { workspace = true, features = ["testing"] }
zaino-persistence = { path = "../zaino-persistence", features = ["testing"] }
zaino-source = { path = "../zaino-source", features = ["testing"] }
zaino-chainview = { path = "../zaino-chainview", features = ["testing"] }
zaino-header-chain = { workspace = true, features = ["testing"] }
zaino-nfs = { workspace = true, features = ["testing"] }
zaino-internal-value-balance.workspace = true
zaino-internal-block-hash-to-height.workspace = true

[lints.rust]
unreachable_pub = "warn"

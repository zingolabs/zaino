[package]
name = "zainod"
version = "0.9.0"
description = "Crate containing the Zaino Indexer binary."
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

[[bin]]
name = "zainod"
path = "src/main.rs"

[lib]
name = "zainodlib"
path = "src/lib.rs"

[features]
default = []

# Prometheus /metrics scrape endpoint.
prometheus = ["metrics", "metrics-exporter-prometheus", "zaino-rpc/prometheus"]

# In-process batch/phase sync profiling: one structured event per committed
# batch (phase timings + per-index op counts) plus the LMDB put/flush split.
# Off by default and compiled out entirely otherwise. See zaino-sync's
# usage.md for the fields and how to read them.
sync-profile = ["zaino-runtime/sync-profile"]

# TEST/DEPLOY-ONLY: enables in-process, env-triggered config fixtures that ignore
# the mounted `--config` — a regtest Direct fixture for the ztest e2e harness and
# a mainnet Direct/state fixture for cluster state-mode deploys. Both exist
# because the surrounding harness/chart mounts a legacy-schema config this
# greenfield config cannot parse. Never enable in a production build; each
# fixture also requires its own runtime env var and logs a loud warning when it
# activates.
ztest-fixture = []

# COMPAT STUBS — UNIMPLEMENTED. Accepted verbatim so ztest can build every SUT
# image in a package run (sibling live-tests still request these), but they gate
# NO behaviour on the greenfield stack. The og zainod's default-secure TLS
# posture (no_tls_* / allow_unencrypted_*) and the fast-test NFS-depth seam are
# not yet ported; restoring real behaviour is the "serving-security posture"
# work. Do NOT treat these as functional — a build with them is exactly a build
# without them.
no_tls_use_unencrypted_traffic = []
allow_unencrypted_public_json_rpc_bind = []
fast-test-seam = []

[dependencies]
# Runtime stack (config-agnostic; zainod translates its config into their typed
# params at boot). Path deps for the ones not yet in [workspace.dependencies].
zaino-runtime = { path = "../zaino-runtime" }
zaino-lightserve = { path = "../zaino-lightserve" }
zaino-source = { workspace = true }
zaino-source-zebra = { workspace = true }
zaino-source-zebra-rpc = { workspace = true }
zaino-source-zebra-readstate = { workspace = true }

# Validator connection + probe.
zaino-common = { workspace = true }
zaino-rpc = { workspace = true }
zaino-status = { workspace = true }

# Zebra network parameters (config network -> zebra network).
zebra-chain = { workspace = true }

# Runtime
tokio = { workspace = true, features = ["full"] }

# CLI
clap = { workspace = true, features = ["derive"] }

# Tracing
tracing = { workspace = true }

# Config
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }
config = { workspace = true }

# Metrics (behind "prometheus" feature)
metrics = { workspace = true, optional = true }
metrics-exporter-prometheus = { workspace = true, optional = true }

# Utility
thiserror = { workspace = true }
zaino-logging = { version = "0.1.0", path = "../zaino-logging" }
zaino-noderpc = { version = "0.1.0", path = "../zaino-noderpc" }
zcash_protocol.workspace = true

[dev-dependencies]
tempfile = { workspace = true }

[package]
name = "zainod"
publish.workspace = true
version.workspace = true
description = "The Zaino indexer daemon."
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

[dependencies]
# Runtime stack (config-agnostic, zainod translates its config into their typed params at boot)
zaino-sync = { workspace = true }
zaino-index-transparent-address = { workspace = true }
zaino-grpc = { workspace = true }
zaino-source = { workspace = true }


# Runtime
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }

# CLI + default config/store paths
dirs = { workspace = true }
clap = { workspace = true, features = ["derive"] }

# Tracing
tracing = { workspace = true }

# Config
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }
config = { workspace = true }

# Admin listener: Prometheus /metrics scrape endpoint and /livez probe
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
metrics-process = { workspace = true }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util = { workspace = true }

# Utility
thiserror = { workspace = true }
zaino-primitives.workspace = true
zcash_protocol = { workspace = true }
zaino-chainview.workspace = true
serde_json.workspace = true
zaino-persistence.workspace = true
tracing-subscriber.workspace = true
time.workspace = true
unicode-ellipsis.workspace = true
rlimit = "0.11"

# Index snapshot bootstrap: aria2c JSON-RPC, free space, unpack
reqwest = { workspace = true }
rustix = { version = "1.1", features = ["fs"] }
zstd = { version = "0.14.0" }
tar = { version = "0.4.46" }
zaino-header-chain.workspace = true
zaino-peers.workspace = true
futures.workspace = true
bytes.workspace = true
zaino-nfs.workspace = true
zaino-traffic.workspace = true
zaino-grpc-snapshot.workspace = true
zcash_transparent.workspace = true

[dev-dependencies]
tempfile = { workspace = true }
zaino-persistence = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
zaino-header-chain = { workspace = true, features = ["testing"] }
zaino-proto.workspace = true
tonic.workspace = true
zaino-source = { workspace = true, features = ["testing"] }
zaino-chainview = { workspace = true, features = ["testing"] }
sha2 = "0.10"
rustix = { version = "1.1", features = ["process"] }

[target."cfg(unix)".dependencies]
sd-notify = "0.5"

[lints.rust]
unreachable_pub = "warn"

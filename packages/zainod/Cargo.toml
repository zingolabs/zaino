[package]
name = "zainod"
version = "0.9.0"
description = "Crate containing the Zaino Indexer binary."
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

[[bin]]
name = "zainod"
path = "src/main.rs"

[lib]
name = "zainodlib"
path = "src/lib.rs"

[features]
default = []

# Prometheus /metrics scrape endpoint.
prometheus = ["metrics", "metrics-exporter-prometheus", "zaino-rpc/prometheus"]

# TEST-ONLY: enables an in-process, hardcoded regtest Direct config fixture for
# the ztest e2e harness (which mounts a legacy-schema config this greenfield
# config cannot parse). Never enable in a production build; the fixture also
# requires a runtime env var and logs a loud warning when it activates.
ztest-fixture = []

[dependencies]
# Runtime stack (config-agnostic; zainod translates its config into their typed
# params at boot). Path deps for the ones not yet in [workspace.dependencies].
zaino-runtime = { path = "../zaino-runtime" }
zaino-indexer = { path = "../zaino-indexer" }
zaino-store = { path = "../zaino-store" }
zaino-lightserve = { path = "../zaino-lightserve" }
zaino-persistence-codec = { path = "../zaino-persistence-codec" }
zaino-component = { path = "../zaino-component" }
zaino-indexes = { workspace = true }
zaino-backend-lmdb = { workspace = true }
zaino-persistence = { workspace = true }
zaino-source = { workspace = true }
zaino-source-zebra-readstate = { workspace = true }
zaino-consensus = { workspace = true }

# Validator connection + probe.
zaino-common = { workspace = true }
zaino-rpc = { workspace = true }
zaino-status = { workspace = true }

# Zebra network parameters (config network -> zebra network).
zebra-chain = { workspace = true }

# Runtime
tokio = { workspace = true, features = ["full"] }

# CLI
clap = { workspace = true, features = ["derive"] }

# Tracing
tracing = { workspace = true }

# Config
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }
config = { workspace = true }

# Metrics (behind "prometheus" feature)
metrics = { workspace = true, optional = true }
metrics-exporter-prometheus = { workspace = true, optional = true }

# Utility
thiserror = { workspace = true }
zaino-logging = { version = "0.1.0", path = "../zaino-logging" }

[dev-dependencies]
tempfile = { workspace = true }

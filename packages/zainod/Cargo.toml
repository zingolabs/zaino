[package]
name = "zainod"
version = "0.10.0"
description = "Crate containing the Zaino Indexer binary."
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }

[[bin]]
name = "zainod"
path = "src/main.rs"

[lib]
name = "zainodlib"
path = "src/lib.rs"

[dependencies]
# Runtime stack (config-agnostic; zainod translates its config into their typed
# params at boot). Path deps for the ones not yet in [workspace.dependencies].
zaino-sync = { workspace = true }
zaino-index-compact-block = { workspace = true }
zaino-index-tree-state = { workspace = true }
zaino-index-transparent-address = { workspace = true }
zaino-internal-block-hash-to-height = { workspace = true }
zaino-internal-value-balance = { workspace = true }
zaino-grpc = { path = "../zaino-grpc" }
zaino-source = { workspace = true }


# Runtime
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }

# CLI + default config/store paths
dirs = { workspace = true }
clap = { workspace = true, features = ["derive"] }

# Tracing
tracing = { workspace = true }

# Config
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }
config = { workspace = true }

# Admin listener: Prometheus /metrics scrape endpoint and /livez probe
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
metrics-process = { workspace = true }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util = { workspace = true }

# Utility
thiserror = { workspace = true }
zaino-primitives.workspace = true
zcash_protocol = { workspace = true }
zaino-chainview = { version = "0.1.0", path = "../zaino-chainview" }
tonic.workspace = true
zaino-proto.workspace = true
serde_json.workspace = true
zaino-persistence = { version = "0.1.0", path = "../zaino-persistence" }
tracing-subscriber.workspace = true
time.workspace = true
unicode-ellipsis.workspace = true
rlimit = "0.11"
ipnet = { version = "2.12", features = ["serde"] }

[dev-dependencies]
tempfile = { workspace = true }
zaino-primitives = { workspace = true, features = ["testing"] }
zaino-persistence = { path = "../zaino-persistence", features = ["testing"] }

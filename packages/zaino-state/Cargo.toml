[package]
name = "zaino-state"
description = "A mempool and chain-fetching service built on top of zebra's ReadStateService and TrustedChainSync."
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }
version = "0.7.0"

[features]
default = []

# TEST-ONLY: shrink the finalised/non-finalised seam to the tractable
# `FAST_TEST_MAX_NONFINALISED_DEPTH` so cross-crate live tests can exercise
# finalisation/eviction with small chains. MUST appear only in `[dev-dependencies]`
# of the live-test crates — never a normal/shipped dependency: resolver = "2" keeps
# dev-dependency features out of production dependency graphs, and `default-members`
# excludes the live-test crates from production builds.
fast-test-seam = []

# Prometheus metrics emission (gauge! calls in sync paths).
# Enables the backend's copy too: this crate re-exports the write-path metric
# names from `zaino-chain-store-zainodb`, which gates them on its own feature.
prometheus = ["metrics", "zaino-chain-store-zainodb/prometheus"]

# test_dependencies - Exposes internal functionality for testing.
test_dependencies = ["zaino-source-zebra/test_dependencies"]

# **Experimental and alpha features**
# Exposes the **complete** set of experimental / alpha features currently implemented in Zaino.
experimental_features = ["transparent_address_history_experimental"]

# Activates transparent address history capability in zaino
#
# NOTE: currently this is only implemented in the finalised state.
transparent_address_history_experimental = []

[dependencies]
zaino-common = { workspace = true }
zaino-proto = { workspace = true }

# LibRustZcash
incrementalmerkletree = { workspace = true }
zcash_address = { workspace = true }
zcash_keys = { workspace = true, features = ["sapling"] }
zcash_protocol = { workspace = true }
zcash_transparent = { workspace = true }
sapling-crypto = "0.7"

# Zebra
zebra-chain = { workspace = true }
zebra-state = { workspace = true }
zebra-rpc = { workspace = true }

# Tracing
tracing = { workspace = true }

# Metrics
metrics = { workspace = true, optional = true }

# Documentation
simple-mermaid = "0.2.0"

# Miscellaneous Workspace
tokio = { workspace = true, features = ["full"] }
thiserror = { workspace = true }
tower = { workspace = true, features = ["buffer", "util"] }
chrono = { workspace = true }
indexmap = { workspace = true }
hex = { workspace = true, features = ["serde"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
tonic = { workspace = true }
dashmap = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
blake2 = { workspace = true }
sha2 = { workspace = true }
corez = { workspace = true }
zaino-encoding = { workspace = true }
arc-swap = { workspace = true }

# The finalised store: the ports it is driven through, and the backend that
# implements them. Both, because ChainIndex still reads the backend's own
# vocabulary while it is being moved onto the ports.
zaino-chain-store = { workspace = true }
zaino-chain-store-zainodb = { workspace = true }
reqwest.workspace = true
zaino-source.workspace = true
zaino-source-zebra.workspace = true
zaino-primitives.workspace = true
zaino-rpc.workspace = true
zaino-source-zebra-rpc.workspace = true
zaino-source-zebra-readstate.workspace = true
zaino-address = { workspace = true }
zaino-convert-zebra.workspace = true
zaino-status.workspace = true
zaino-consensus.workspace = true
bytes.workspace = true
zaino-mempool = { workspace = true, features = ["tip_aware_mempool"] }
zaino-mempool-service = { workspace = true, features = ["tip_aware_mempool"] }
zaino-chain-head = { workspace = true }
zaino-chain-head-service = { workspace = true }

[dev-dependencies]
zaino-chain-store-zainodb = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
primitive-types = { workspace = true }
zebra-chain = { workspace = true, features = ["proptest-impl"] }
proptest.workspace = true
incrementalmerkletree = "0.8.2"
rand = "0.10.1"
zaino-consensus = { workspace = true }

[build-dependencies]
whoami = { workspace = true }

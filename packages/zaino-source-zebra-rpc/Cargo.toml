[package]
name = "zaino-source-zebra-rpc"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
description = "Zebra JSON-RPC adapter implementing zaino-source query traits."

[dependencies]
zaino-primitives = { workspace = true }
zaino-rpc = { workspace = true }
zaino-source = { workspace = true }
zaino-convert-zebra.workspace = true
hex.workspace = true
zebra-chain = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing = { workspace = true, optional = true }
incrementalmerkletree.workspace = true
zcash_primitives.workspace = true
sapling-crypto = "0.7.0"

[features]
tracing = ["dep:tracing"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

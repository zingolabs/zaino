[package]
name = "zaino-index-compact-block"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Append-only store of gRPC-framed CompactBlock records"

[dependencies]
bytes = { workspace = true }
arc-swap = { workspace = true }
thiserror = { workspace = true }
zaino-proto.workspace = true
prost.workspace = true
imbl.workspace = true
zaino-primitives = { workspace = true }
zaino-sync = { version = "0.1.0", path = "../zaino-sync" }
tokio = { workspace = true, features = ["macros", "sync"] }
zaino-persistence = { version = "0.1.0", path = "../zaino-persistence" }
zcash_protocol.workspace = true

[features]
# Sample blocks for consumers that test against a real index.
testing = ["zaino-primitives/testing"]

[dev-dependencies]
tempfile = { workspace = true }
zaino-persistence = { path = "../zaino-persistence", features = ["testing"] }
zaino-primitives = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt"] }
proptest.workspace = true


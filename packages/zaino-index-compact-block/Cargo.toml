[package]
name = "zaino-index-compact-block"
publish.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Append-only store of gRPC-framed CompactBlock records"

[dependencies]
bytes = { workspace = true }
thiserror = { workspace = true }
zaino-proto.workspace = true
prost.workspace = true
zaino-primitives = { workspace = true }
zaino-sync.workspace = true
zaino-persistence.workspace = true
zcash_protocol.workspace = true

[dev-dependencies]
zaino-persistence = { workspace = true, features = ["testing"] }
zaino-source = { workspace = true, features = ["testing"] }
proptest.workspace = true
zaino-sync = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints.rust]
unreachable_pub = "warn"


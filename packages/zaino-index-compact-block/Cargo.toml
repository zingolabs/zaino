[package]
name = "zaino-index-compact-block"
version = "0.1.0"
edition.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true
description = "Append-only store of gRPC-framed CompactBlock records"

[dependencies]
bytes = { workspace = true }
thiserror = { workspace = true }
zaino-proto.workspace = true
prost.workspace = true
zaino-primitives = { workspace = true }
zaino-sync = { version = "0.1.0", path = "../zaino-sync" }
zaino-persistence = { version = "0.1.0", path = "../zaino-persistence" }
zcash_protocol.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
zaino-persistence = { path = "../zaino-persistence", features = ["testing"] }
zaino-primitives = { workspace = true, features = ["testing"] }
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util", "time"] }

[lints.rust]
unreachable_pub = "warn"


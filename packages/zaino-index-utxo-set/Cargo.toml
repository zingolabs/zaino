[package]
name = "zaino-index-utxo-set"
publish.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true
description = "UTXO-set index: every transparent output's value, resolving each transaction's fee for the FeeSink"

[dependencies]
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
zaino-persistence.workspace = true
zaino-primitives.workspace = true
zaino-sync.workspace = true
zcash_protocol.workspace = true
zcash_transparent.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time", "test-util"] }
zaino-persistence = { workspace = true, features = ["testing"] }
zaino-primitives = { workspace = true, features = ["testing"] }
zaino-sync = { workspace = true, features = ["testing"] }

[lints.rust]
unreachable_pub = "warn"

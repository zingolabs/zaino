[package]
name = "zaino-peers"
publish.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Zaino's p2p layer: zebra-network peers for headers, blocks, mempool sightings and submission pushes over the peer set"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
metrics.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
# zebra-network's own (its peer set = tower 0.4 `Buffer`, workspace's 0.5 cannot hold one)
tower = { version = "0.4.13", features = ["buffer", "util"] }
tracing.workspace = true
zaino-primitives.workspace = true
zcash_primitives.workspace = true
zcash_protocol.workspace = true
zebra-chain.workspace = true
zebra-network.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
metrics-exporter-prometheus.workspace = true
proptest.workspace = true
zaino-source = { workspace = true, features = ["testing"] }
zebra-network = { workspace = true, features = ["proptest-impl"] }
zebra-test.workspace = true

[lints.rust]
unreachable_pub = "warn"

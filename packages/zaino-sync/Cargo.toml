[package]
name = "zaino-sync"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "DAG-driven parallel sync engine for blockchain index building."

[features]
tracing = ["dep:tracing"]
# Toy index sets for driving the engine in tests and downstream drivers. The
# ordered-monoid toy (`toy_merkle_index`) hashes with `blake2b_simd`, so the
# feature pulls it in; a plain `cargo test` gets it via the dev-dependency.
testing = ["zaino-persistence/testing", "dep:blake2b_simd"]
# In-process batch/phase sync profiling. Pulls in `tracing` for its structured
# events but deliberately does NOT enable the `tracing` feature above, so the
# existing per-dispatch trace/debug events stay off — profiling emits only its
# own per-batch events.
sync-profile = ["dep:tracing"]

[dependencies]
zaino-persistence = { path = "../zaino-persistence" }
zaino-primitives = { path = "../zaino-primitives" }
# Toy ordered-monoid index hash; only compiled under the `testing` feature.
blake2b_simd = { version = "1", optional = true }
rayon.workspace = true
strum.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true, optional = true }
zaino-persistence-codec = { version = "0.1.0", path = "../zaino-persistence-codec" }

[dev-dependencies]
# Available under `cfg(test)` even without the `testing` feature, so a plain
# `cargo test` compiles the toy indexes; the `testing` feature pulls the same
# crate in as an optional dependency for downstream drivers.
blake2b_simd = "1"
proptest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zaino-persistence = { path = "../zaino-persistence", features = ["testing"] }
zaino-source = { path = "../zaino-source", features = ["testing"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[package]
name = "zaino-sync"
version = "0.1.0"
edition.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Zaino's index sync pipeline: one producer into one block sink, subscribed by N independent indexes."

[dependencies]
arc-swap.workspace = true
futures.workspace = true
metrics = { workspace = true }
rayon.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true }
tracing.workspace = true
zaino-chainview = { version = "0.1.0", path = "../zaino-chainview" }
zaino-non-finalized-state.workspace = true
zaino-primitives.workspace = true
zaino-source.workspace = true

[dev-dependencies]
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }
zaino-primitives = { workspace = true, features = ["testing"] }
zaino-source = { path = "../zaino-source", features = ["testing"] }

[lints.rust]
unsafe_code = "forbid"

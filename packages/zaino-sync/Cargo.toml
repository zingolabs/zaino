[package]
name = "zaino-sync"
version = "0.1.0"
edition.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Zaino's index sync plumbing: the final stream every index writer follows, its byte-bounded queues and the writers' commit cadence."

[dependencies]
futures.workspace = true
metrics = { workspace = true }
rayon.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
zaino-header-chain.workspace = true
zaino-persistence = { version = "0.1.0", path = "../zaino-persistence" }
zaino-primitives.workspace = true
zaino-source.workspace = true
zaino-traffic = { version = "0.1.0", path = "../zaino-traffic" }

[dev-dependencies]
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }
zaino-header-chain = { workspace = true, features = ["testing"] }
zaino-persistence = { path = "../zaino-persistence", features = ["testing"] }
zaino-primitives = { workspace = true, features = ["testing"] }
zaino-source = { workspace = true, features = ["testing"] }
zcash_protocol.workspace = true

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[features]
# `SyncProgress::fixed` (no follower)
testing = []

[package]
name = "zaino-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Zaino's index sync plumbing: the final stream every index writer follows, its byte-bounded queues and the writers' commit cadence."

[dependencies]
futures.workspace = true
metrics = { workspace = true }
rayon.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
zaino-header-chain.workspace = true
zaino-persistence.workspace = true
zaino-primitives.workspace = true
zaino-source.workspace = true
zaino-traffic.workspace = true

[dev-dependencies]
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }
zaino-header-chain = { workspace = true, features = ["testing"] }
zaino-persistence = { workspace = true, features = ["testing"] }
zaino-primitives = { workspace = true, features = ["testing"] }
zaino-source = { workspace = true, features = ["testing"] }
zaino-traffic = { workspace = true, features = ["testing"] }
zcash_protocol.workspace = true

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[features]
# `SyncProgress::fixed` (no follower)
testing = []

[package]
name = "zaino-runtime"
version = "0.1.0"
edition = "2021"
publish = false
description = "The orchestrator: composes the finalised (zaino-fs) and non-finalised (zaino-nfs) components into one running indexer, and implements zaino-service::IndexerService."

[dependencies]
zaino-component = { path = "../zaino-component" }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
futures.workspace = true
zaino-core = { path = "../zaino-core" }
zaino-async = { version = "0.1.0", path = "../zaino-async" }

[dev-dependencies]
tokio = { workspace = true }
zaino-status = { path = "../zaino-status" }
# Serving-composition POC: one engine driving both public ports at once.
zaino-core = { path = "../zaino-core" }
zaino-service = { path = "../zaino-service", features = ["testing"] }
zaino-lightserve = { path = "../zaino-lightserve" }
zaino-noderpc = { path = "../zaino-noderpc" }
zaino-indexer = { path = "../zaino-indexer" }
zaino-indexes = { path = "../zaino-indexes" }
zaino-persistence = { path = "../zaino-persistence", features = ["testing"] }
zaino-source = { path = "../zaino-source", features = ["testing"] }
zaino-primitives = { path = "../zaino-primitives" }
zaino-logging = { path = "../zaino-logging" }

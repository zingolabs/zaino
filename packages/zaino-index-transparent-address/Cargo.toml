[package]
name = "zaino-index-transparent-address"
version = "0.1.0"
edition.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true
description = "Transparent-address index: receives and spends as two insert-only map projections"

[dependencies]
thiserror.workspace = true
zaino-persistence = { version = "0.1.0", path = "../zaino-persistence" }
zaino-primitives.workspace = true
zaino-sync.workspace = true
zcash_protocol.workspace = true
zcash_transparent.workspace = true

[dev-dependencies]
zaino-primitives = { workspace = true, features = ["testing"] }
zcash_script.workspace = true
zaino-persistence = { path = "../zaino-persistence", features = ["testing"] }
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util.workspace = true
zaino-header-chain = { workspace = true, features = ["testing"] }

[lints.rust]
unreachable_pub = "warn"

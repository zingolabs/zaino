[package]
name = "zaino-chain-head"
description = "Domain types and ports for Zaino's bounded non-finalised block graph."
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
version = "0.1.0"

[features]
default = []

# Transparent-address-history domain types + `ChainHeadTransparentHistoryService` port
# - Declaration only: no implementor, no consumer
transparent_address_history_experimental = []

[dependencies]
zaino-consensus = { workspace = true }
zaino-primitives = { workspace = true }
zaino-source = { workspace = true }

tokio = { workspace = true, features = ["sync"] }
thiserror = { workspace = true }

[dev-dependencies]
zaino-source-zebra-rpc = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

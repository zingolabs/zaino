[package]
name = "zaino-chain-head"
description = "Domain types and ports for Zaino's bounded non-finalised block graph."
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }
version = "0.1.0"

[features]
default = []

# Declares the transparent-address-history capability: the domain types and the
# `ChainHeadTransparentHistoryService` port. Declaration only — nothing
# implements it, and no consumer is wired to it. Named to match
# `zaino-state/transparent_address_history_experimental`, which gates the
# finalised-state half of the same capability.
transparent_address_history_experimental = []

[dependencies]
zaino-consensus = { workspace = true }
zaino-primitives = { workspace = true }
zaino-source = { workspace = true }

tokio = { workspace = true, features = ["sync"] }
thiserror = { workspace = true }

[dev-dependencies]
zaino-source-zebra = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

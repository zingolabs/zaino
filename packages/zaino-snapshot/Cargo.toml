[package]
name = "zaino-snapshot"
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "One published snapshot of what Zaino serves: chain, indexes, mempool, validators"

[features]
# `Snapshots::fixed`
testing = []

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[dependencies]
arc-swap.workspace = true
bytes.workspace = true
metrics.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "macros"] }
tokio-util.workspace = true
tracing.workspace = true
zaino-chainview.workspace = true
zaino-header-chain.workspace = true
zaino-nfs.workspace = true
zaino-persistence.workspace = true
zaino-primitives.workspace = true
zaino-source.workspace = true
zaino-sync.workspace = true
zaino-traffic.workspace = true
zcash_protocol.workspace = true

[dev-dependencies]
futures.workspace = true
metrics-exporter-prometheus.workspace = true
proptest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
zaino-chainview = { workspace = true, features = ["testing"] }
zaino-header-chain = { workspace = true, features = ["testing"] }
zaino-internal-block-hash-to-height.workspace = true
zaino-nfs = { workspace = true, features = ["testing"] }
zaino-persistence = { workspace = true, features = ["testing"] }
zaino-primitives = { workspace = true, features = ["testing"] }
zaino-source = { workspace = true, features = ["testing"] }
zaino-sync = { workspace = true, features = ["testing"] }

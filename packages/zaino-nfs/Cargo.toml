[package]
name = "zaino-nfs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Zaino's non-finalized state: the tip overlay, one folded node per block above the durable views"

[dependencies]
imbl.workspace = true
metrics.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "macros", "rt"] }
tokio-util.workspace = true
tracing.workspace = true
zaino-header-chain.workspace = true
zaino-index-compact-block.workspace = true
zaino-index-transparent-address.workspace = true
zaino-index-tree-state.workspace = true
zaino-internal-block-hash-to-height.workspace = true
zaino-internal-value-balance.workspace = true
zaino-persistence = { version = "0.1.0", path = "../zaino-persistence" }
zaino-primitives.workspace = true
zaino-source.workspace = true
zaino-sync.workspace = true
zaino-traffic = { version = "0.1.0", path = "../zaino-traffic" }
zcash_protocol.workspace = true

[features]
# `Indexed::fixed` (no driver) + `ChainParams::of(MockChain)`
testing = ["zaino-primitives/testing"]

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }
zaino-header-chain = { workspace = true, features = ["testing"] }
zaino-persistence = { path = "../zaino-persistence", features = ["testing"] }
zaino-primitives = { workspace = true, features = ["testing"] }
zaino-source = { workspace = true, features = ["testing"] }

[package]
name = "zaino-header-chain"
publish.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Validated Header tree: the most-work tip above a trusted anchor"

[dependencies]
equihash = "0.3"
imbl.workspace = true
thiserror.workspace = true
zaino-primitives.workspace = true
zcash_protocol.workspace = true

[features]
# `testing::{HeaderViews, insert}`
testing = ["zaino-primitives/testing"]

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[dev-dependencies]
const-hex.workspace = true
proptest.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
serde_json.workspace = true
zaino-primitives = { workspace = true, features = ["testing"] }

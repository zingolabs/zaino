[package]
name = "zaino-chain-head-service"
description = "Self-synchronising in-memory runtime for Zaino's ChainHead."
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }
version = "0.1.0"
# The benchmarks share `benches/harness.rs`, which is a module rather than a
# target of its own; without this, cargo would build it as one.
autobenches = false

[features]
default = []

# Forwards the domain crate's declaration-only transparent capability, so a
# consumer enabling it here gets the same types and port.
transparent_address_history_experimental = [
    "zaino-chain-head/transparent_address_history_experimental",
]

# Prometheus metric emission from the advance path.
prometheus = ["metrics"]

# TEST-ONLY: exposes `spawn_without_writer` and `advance_once`, so a downstream
# test crate can step the chain head deterministically instead of racing its
# timer. MUST appear only in `[dev-dependencies]` — `resolver = "2"` keeps
# dev-dependency features out of production dependency graphs. In-crate tests
# get both from `cfg(test)` without enabling anything.
testing = []

[dependencies]
zaino-chain-head = { workspace = true }
zaino-primitives = { workspace = true }
zaino-source = { workspace = true }
zaino-status = { workspace = true }

arc-swap = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

metrics = { workspace = true, optional = true }
imbl = { workspace = true }

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
stats_alloc = "0.1.10"
tokio = { workspace = true, features = ["macros", "test-util"] }
zaino-consensus = { workspace = true }

# The library has no benchmarks of its own; without this, `cargo bench` runs
# the test harness too and it rejects the benchmark's arguments.
[lib]
bench = false

# Drives the published service through its stepping entry points, so it needs
# the same feature a downstream test crate does.
[[bench]]
name = "publication"
harness = false
required-features = ["testing"]

# The same scenarios counted in allocations rather than timed.
[[bench]]
name = "allocations"
harness = false
required-features = ["testing"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

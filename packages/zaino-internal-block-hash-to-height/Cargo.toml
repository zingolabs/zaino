[package]
name = "zaino-internal-block-hash-to-height"
publish.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Block hash <-> height index: the locator every by-hash request resolves through"

[dependencies]
zaino-persistence.workspace = true
zaino-primitives.workspace = true
zaino-sync.workspace = true
zcash_protocol.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
zaino-persistence = { workspace = true, features = ["testing"] }
zaino-source = { workspace = true, features = ["testing"] }
zaino-sync = { workspace = true, features = ["testing"] }

[lints.rust]
unreachable_pub = "warn"

[package]
name = "zaino-noderpc"
version = "0.1.0"
edition = "2021"
publish = false
description = "POC: Zcash node JSON-RPC serve adapter over the NodeRpcService inner port. Proves the node-rpc profile binding + both-direction wire conversion; not the production zaino-serve."

[dependencies]
zaino-service = { path = "../zaino-service" }
zaino-primitives = { path = "../zaino-primitives" }
thiserror = { workspace = true }
zaino-component = { path = "../zaino-component" }
jsonrpsee = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true, features = ["derive"] }
zaino-address = { path = "../zaino-address" }
zcash_protocol.workspace = true

[dev-dependencies]
zaino-service = { path = "../zaino-service", features = ["testing"] }
tokio = { version = "1", features = ["macros", "rt"] }
serde_json.workspace = true

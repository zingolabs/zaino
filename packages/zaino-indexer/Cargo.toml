[package]
name = "zaino-indexer"
version = "0.1.0"
edition = "2021"
publish = false
description = "The indexer writer wired as a runtime component: a SyncDriver over the #1402 SyncEngine, so the Orchestra can boot and supervise index-building. The concrete source-backed provisioner (over zaino-source) lands here too."

[dependencies]
zaino-component = { path = "../zaino-component" }
zaino-sync = { path = "../zaino-sync" }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
zaino-sync = { path = "../zaino-sync", features = ["testing"] }
zaino-runtime = { path = "../zaino-runtime" }
tokio = { workspace = true }

[package]
name = "zaino-source"
publish.workspace = true
description = "Zaino's validator source: the ChainDataSource port and its JSON-RPC and Zebra indexer gRPC clients."
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true

[dependencies]
zaino-primitives = { workspace = true }
metrics = { workspace = true }
orchard = { workspace = true }
reqwest.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing = { workspace = true }
zcash_encoding = "0.4"
zcash_primitives.workspace = true
zcash_protocol.workspace = true
governor = { version = "0.10.4", default-features = false, features = ["std"] }
zaino-proto.workspace = true
tonic = { workspace = true, features = ["tls-ring"] }
tokio-util.workspace = true
const-hex.workspace = true
zcash_transparent.workspace = true

[features]
testing = ["zaino-primitives/testing"]

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util", "test-util"] }
zcash_primitives = { workspace = true, features = ["test-dependencies"] }
zaino-primitives = { workspace = true, features = ["testing"] }
zaino-source = { workspace = true, features = ["testing"] }
rcgen.workspace = true

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[package]
name = "zaino-source"
description = "Zaino's validator source: one driven-port trait per chain question, answered over the validator's JSON-RPC."
version = "0.2.1"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
zaino-primitives = { workspace = true }
metrics = { workspace = true }
orchard = { workspace = true }
reqwest.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing = { workspace = true }
zcash_encoding = "0.4"
zcash_primitives.workspace = true
zcash_protocol.workspace = true
const-hex = "1.19.3"

[features]
testing = ["zaino-primitives/testing"]

[dev-dependencies]
proptest.workspace = true
sha2 = "0.10"
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util", "test-util"] }
zcash_primitives = { workspace = true, features = ["test-dependencies"] }
zaino-primitives = { workspace = true, features = ["testing"] }

[lints.rust]
unsafe_code = "forbid"

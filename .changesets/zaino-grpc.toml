id = "01a1181e-5284-7199-af39-46e3db62cf71"

[[changes]]
crate = "zaino-grpc"
kind = "feature"
description = """
First release. The wallet-facing lightwalletd `CompactTxStreamer` server: one `GrpcService`, \
every method dispatched by path over `Routes { chain, validators, network, nfs, \
max_address_rows }`. Every index method reads one `zaino_nfs` snapshot for its whole request or \
stream; a disabled index answers `UNIMPLEMENTED`, no snapshot yet `UNAVAILABLE`. Mempool \
methods, `GetLightdInfo` and `SendTransaction` go through the chain view, `GetTransaction` \
through the validators' `TrafficBalancer`. `GrpcLimits` bounds connections (also per client), \
streams, `GetMempoolStream` subscriptions, point / range / scan read lanes, stalled connections \
and request bodies, and sets the shutdown drain (GOAWAY, `drain_timeout`); \
`with_trusted_proxies(TrustedProxies)` reads PROXY protocol v1/v2 headers; `with_tls` serves \
TLS from PEM files re-read on change.
"""

[[changes]]
crate = "zaino-grpc"
kind = "breaking"
section = "changed"
description = """
`Routes.validators` is a `zaino_traffic::TrafficBalancer<S>`: `GetTransaction` and \
`GetTaddressTransactions` bytes ask `transaction(txid)` (trusted by tier, absent → the next, \
hedged); `NOT_FOUND` only when every validator asked said absent, `UNAVAILABLE` on a failure or \
with none eligible.
"""
migration = """
Pass the same `TrafficBalancer` the chain view was built over (`balancer.clone()`).
"""

[[changes]]
crate = "zaino-grpc"
kind = "internal"
description = """
Route tests build their indexes through the new fold shape (store-opened deltas, linked chains).
"""

[[changes]]
crate = "zaino-grpc"
kind = "breaking"
section = "changed"
description = """
Every request reads one global snapshot: `Routes { snapshots, submit, validators, network, \
max_address_rows }` (`snapshots` = `zaino_snapshot::Snapshots`, one `load()` per request or \
stream; `submit` = the chain view, `SendTransaction` only). `GetLatestBlock`, `GetBlockRange`, \
`GetTreeState`, `GetLightdInfo` and the mempool methods answer from the same snapshot. \
`GetMempoolStream` now ends when the **served** tip moves (after the NFS folds the new block), \
so the `GetLatestBlock` that follows serves it; before, it ended on the best block, possibly \
before the block was servable. `GetLightdInfo`'s height and branch come from one load (they \
can no longer disagree) and it answers `UNAVAILABLE` until something is served (was \
`blockHeight: 0`). Tree-state memos are keyed per NFS publish.
"""
migration = """
`Routes { snapshots: publisher.handle(), submit: Arc::clone(&view), validators, network, \
max_address_rows }`; spawn the `zaino_snapshot::Publisher`.
"""

[[changes]]
crate = "zaino-grpc"
kind = "fix"
section = "fixed"
description = """
`SendTransaction` rejections answer like lightwalletd: gRPC `OK` with the validator's own \
JSON-RPC code and message (`-22` for unparseable bytes), not `-1` and a reworded reason. \
zebrad's "transaction already exists in mempool" and "already queued for download" (code `-1`) \
now reach the wallet as rejections instead of `UNAVAILABLE`.
"""

[[changes]]
crate = "zaino-grpc"
kind = "fix"
section = "fixed"
description = """
`GetSubtreeRoots`: an unknown `shieldedProtocol` is `UNIMPLEMENTED` (was `INVALID_ARGUMENT`, a \
shape the Android SDK does not survive with fast sync), and a `startIndex` or `maxEntries` \
above 65,535 is an empty or whole `OK` stream (was `INVALID_ARGUMENT`). The answer is whole \
or refused before its first byte.
"""

[[changes]]
crate = "zaino-grpc"
kind = "fix"
section = "fixed"
description = """
`GetTreeState` below Sapling activation answers that exact height with every tree `""` (was \
`INVALID_ARGUMENT`; the Android SDK asks for Sapling activation − 1). From a pool's \
activation on its tree is the serialized tree, `000000` while empty.
"""

[[changes]]
crate = "zaino-grpc"
kind = "fix"
section = "fixed"
description = """
`GetBlockRange` (and the deprecated `GetBlockRangeNullifiers`) reaching past the served tip \
streams every block up to the tip, then ends `OUT_OF_RANGE` in the trailers, as lightwalletd \
does; it used to end `OK` at the tip, which hangs the iOS downloader. A range whose first \
height is past the tip is `OUT_OF_RANGE` before any block.
"""

[[changes]]
crate = "zaino-grpc"
kind = "fix"
section = "fixed"
description = """
Streamed answers join records that are ready back to back into full 16 KiB DATA frames \
instead of one frame per record. `GetAddressUtxosStream`, `GetMempoolTx` and \
`GetBlockRange`'s in-memory blocks used to send one small frame each, and an h2 0.4.16+ client \
that reads late answered `GOAWAY too_many_data_frames` (lightwalletd #593). A record already \
16 KiB or larger is sent as is; nothing waits for more data.
"""

[[changes]]
crate = "zaino-grpc"
kind = "fix"
section = "fixed"
description = """
The client's `grpc-timeout` is honoured as its deadline: a call still pending answers \
`DEADLINE_EXCEEDED`, a stream ends with it in the trailers. Streams have no total-duration \
cap. `GrpcLimits::stall_timeout` now bounds no progress on either side: unread data closes the \
connection as before, and a handler or stream with nothing to send for that long ends \
`UNAVAILABLE` (`GetMempoolStream` exempt).
"""

[[changes]]
crate = "zaino-grpc"
kind = "feature"
section = "changed"
description = """
A method whose index is enabled but still catching up alone (enabled after the others synced) \
answers `UNAVAILABLE` "… needs the <index> index, which is syncing" (retry), not \
`UNIMPLEMENTED`; a disabled index keeps `UNIMPLEMENTED`. By-hash lookups through a syncing \
block-hash index likewise answer `UNAVAILABLE`.
"""

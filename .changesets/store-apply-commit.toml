[[changes]]
crate = "zaino-persistence"
kind = "breaking"
section = "Changed"
description = """
`Store` buffers, then commits: `apply(changes)` buffers final data (not durable, not in \
`view()`), `buffered_bytes()` sizes the buffer, `commit()` writes every buffered change in one \
atomic commit (one fsync; nothing buffered = nothing written) and returns `()`, and `staged()` \
reads committed + buffered while `view()` stays committed only. `apply` panics, buffering \
nothing, on changes for another schema, a tip not above the last applied, or a map key held \
twice. `TieredView` is replaced by `LayeredView`; `Tiered` keeps its API on top of the new \
`Store`. The conformance suite drives `apply` / `commit` / crash / reopen and NFS-style layers; \
`conformance::Model::commit` is `advance`, `commit_point` is `block_ref`.
"""
migration = """
Replace `let view = store.commit(changes)?` with `store.apply(changes); store.commit()?; let \
view = store.view();`. Name `LayeredView` where you named `TieredView`.
"""

[[changes]]
crate = "zaino-persistence"
kind = "feature"
section = "Added"
description = """
`Layer` and `LayeredView`: one index's non-final data over a committed view. `Layer::with` \
adds one `Changes` by structural sharing (`imbl`, clone = O(tables)), `rebase` drops what a \
durable view now holds, `LayeredView::new(durable, layer)` reads the layer first, then durable, \
through `SequenceRead` / `MapRead` (ranges merged, same `limit` rule). A store's buffer is one.
"""

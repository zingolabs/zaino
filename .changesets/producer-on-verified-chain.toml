[[changes]]
crate = "zaino-sync"
kind = "breaking"
section = "Changed"
description = """
The producer follows the header chain's `VerifiedChain` and nothing else: \
`Producer::new(sink, sources, verified, concurrency, durable)` takes every block source, \
`watch::Receiver<Option<Arc<VerifiedChain>>>` (`HeaderSync::subscribe`) and how many blocks may \
be in flight. Every block is fetched by hash from any source and accepted only if its hash, its \
coinbase height and the merkle root rebuilt from its txids match the verified header (a repeated \
txid pair refused, CVE-2012-2459); a source that misanswers is skipped for 60 s and the block \
asked of another, a silent one hedged after 15 s. One finality, the header chain's final tip; a \
reorg is the first sent non-final block no longer `hash_at` its height, answered with `Reorg` and \
a replay from memory. Bulk vs window, `VerifiedTip`, the reorg depth argument and \
`ProduceError::{Unlinked, BelowWindow, ChainViewGone}` are gone; `ProduceError::Diverged` now \
means a durable tip off the final verified chain (checked before anything is sent; nothing is \
sent while the final tip is below a durable tip), and `ProduceError::ChainGone` that header sync \
stopped. Internally a pure `ProducerCore` with `check()` (P1–P6), a model test against a naive \
index and fire drills. The block-sink contract is in `docs/design/data-sink.md`.
"""
migration = """
Pass `header_sync.subscribe()` where you passed the `VerifiedTip` watch, the validators' sources \
(sync lane) where you passed a `BlockFetchPool`, and the fetch concurrency where you passed the \
reorg depth. Match `ProduceError::Diverged` / `ChainGone` only.
"""

[[changes]]
crate = "zaino-sync"
kind = "breaking"
section = "Changed"
description = """
Serving gates compare hashes: `Published::gate(verified, depth, cancel)` reads the \
`VerifiedChain` watch and opens once the applied block **is** the verified best, closing when it \
leaves the best chain, falls more than `depth` behind, or a reorg replays. \
`Published::new(view, durable)` and `Published::view(view, applied)` take the block \
(`Option<BlockRef>`), and `subscribe_applied()` publishes it.
"""
migration = """
Publish the applied block (`BlockRef { hash, height }`) where you published its height; read \
`.height` off `subscribe_applied()`.
"""

[[changes]]
crate = "zaino-primitives"
kind = "feature"
section = "Added"
description = """
`MerkleRoot::of_txids`: zcashd's block merkle root over txids, `None` for an empty list or one \
repeating a pair (CVE-2012-2459). `sha2` is now a plain dependency; `testing::merkle_root` is \
replaced by it.
"""

[[changes]]
crate = "zaino-header-chain"
kind = "feature"
section = "Changed"
description = """
`HeaderChain::regtest_in_memory` (feature `testing`) accepts any nBits, so test branches mined \
with `mine_bits` vary in work and the most work need not be the highest.
"""

[[changes]]
crate = "zainod"
kind = "fix"
section = "Fixed"
description = """
Blocks are no longer fetched only from the validators holding the tip, nor trusted: each is \
checked against the verified header chain before any index sees it, and any validator may serve \
it. Logs: `Syncing to finalized target`, `Reached finalized target`, `Applying to tip` and \
`Verified tip below the non-final window, waiting` are gone; `Source misanswered a block, asking \
another` is new; `Syncing blocks` reports progress toward the verified best.
"""

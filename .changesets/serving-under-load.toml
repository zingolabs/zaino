[[changes]]
crate = "zaino-store"
kind = "fix"
description = """
The address-history reads (`balance`, `unspent_outpoints`, `deltas`, \
`tx_ids`) run on the blocking pool. A pool-scale address scans for tens of \
seconds, and on an async worker a few such reads at once stopped the server \
from answering any other request.
"""

[[changes]]
crate = "zaino-lightserve"
kind = "fix"
description = """
The gRPC server disables Nagle on accepted connections, removing a ~40 ms \
delay on small unary replies.
"""

[[changes]]
crate = "zaino-lightserve"
kind = "fix"
description = """
`GetBlockRange` and `GetBlockRangeNullifiers` stream the range in steps of \
100 heights instead of composing it whole before sending the first block, so \
an open range stream holds at most one step in memory. A range whose start is \
above its end is served in descending order, as lightwalletd does; it was \
previously answered empty. `LightServe::get_block_range_nullifiers` returns a \
stream rather than a `Vec`.
"""

[[changes]]
crate = "zaino-chain-head-service"
kind = "fix"
description = """
The window's treestate and subtree-root reads keep each block's fold result, \
keyed by block hash and shared across snapshots. A read above the watermark \
folds only the blocks no earlier read has, on the blocking pool, instead of \
replaying the whole window (about 1.3 s of hashing per read on mainnet). \
Entries at or below the watermark are dropped as it advances.
"""

[[changes]]
crate = "zaino-chain-head-service"
kind = "fix"
description = """
`MapBackedSnapshot` holds its retained blocks behind `Arc`, so publishing the \
next snapshot shares every unchanged block with the previous one instead of \
deep-copying the whole window.
"""

[[changes]]
crate = "zaino-store"
kind = "fix"
description = """
`balance` and `unspent_outpoints` resolve only whether each receive was spent, \
one lookup in the spends index, instead of locating the spending transaction \
and decoding its block's transparent data. `deltas` and `tx_ids`, which report \
where a spend happened, still resolve the full site.
"""

[[changes]]
crate = "zaino-lightserve"
kind = "feature"
description = """
`LightServe::with_upgrades` carries the validator's network upgrade schedule. \
`GetLightdInfo` then reports `saplingActivationHeight`, `consensusBranchId` \
(the branch in force at the served tip) and `upgradeName`/`upgradeHeight` for \
the next pending upgrade, which were previously empty.
"""

[[changes]]
crate = "zaino-runtime"
kind = "feature"
description = """
`read_upgrade_schedule` reads the validator's network upgrade schedule, \
failing with `DeployError::ActivationSchedule` as the boot does when the \
validator cannot describe its chain.
"""

[[changes]]
crate = "zaino-lightserve"
kind = "feature"
description = """
`GetTreeState` accepts a block hash, as lightwalletd does: a non-zero height \
selects by height, otherwise the hash (display byte order) selects the block on \
the served chain, answered `NOT_FOUND` when no block there has it. \
`LightServe::get_tree_state` takes a `BlockSelector` and returns `None` for an \
unknown hash.
"""

[[changes]]
crate = "zaino-primitives"
kind = "feature"
description = """
`CommitmentTrees` is a block's commitment trees without their roots, the shape \
a light wallet reads; `Treestate::into_trees` drops the roots from a full \
treestate.
"""

[[changes]]
crate = "zaino-service"
kind = "breaking"
description = """
`TreestateRead::treestate` returns `CommitmentTrees`, the trees without roots, \
and `TreestateWindowRead` takes and returns `CommitmentTrees`. The new \
`TreestateRootsRead::treestate_with_roots` returns the full `Treestate` with \
each pool's root, and `TreestateWindowRead::window_treestate_with_roots` is its \
window half. `NodeRpcReads` requires `TreestateRootsRead`; the wallet read sets \
do not.
"""

[[changes]]
crate = "zaino-indexes"
kind = "breaking"
description = """
`tree_state::pool_treestate` and `TreeStateValue::pool_treestates` are replaced \
by `pool_tree` and `pool_trees`, which render the serialized trees without \
computing roots. `tree_root` hashes a serialized tree to its root and \
`with_roots` adds each pool's root to a `CommitmentTrees`. `serve::seed_value` \
takes `CommitmentTrees`.
"""

[[changes]]
crate = "zaino-store"
kind = "feature"
description = """
`StoreSnapshot` implements `TreestateRootsRead`, hashing the roots on the \
blocking pool; its `TreestateRead` computes none, so a light-wallet treestate \
read costs a point read and a serialization.
"""

[[changes]]
crate = "zaino-chain-head-service"
kind = "feature"
description = """
`HeadSnapshot` implements `TreestateWindowRead::window_treestate_with_roots`; \
`window_treestate` folds and serializes the trees without computing roots.
"""

[[changes]]
crate = "zaino-core"
kind = "feature"
description = """
The engine implements `TreestateRootsRead` under the `Treestate` placement: \
`Local` routes it across the seam like the trees read, `Passthrough` relays the \
validator's treestate, and the trees read drops the validator's roots.
"""

[[changes]]
crate = "zaino-lightserve"
kind = "fix"
description = """
`GetTreeState` and `GetLatestTreeState` read the trees alone, so a light-wallet \
treestate no longer pays for pool roots the wire never carries.
"""

[[changes]]
crate = "zaino-noderpc"
kind = "fix"
description = """
`z_gettreestate` reads through `TreestateRootsRead`, keeping `finalRoot` in its \
response.
"""

[[changes]]
crate = "zaino-lightserve"
kind = "feature"
description = """
A non-default `prometheus` feature measures every gRPC call: \
`zaino.grpc.requests_total` by method and status, time to first message, \
duration, messages and bytes sent. Labels are the method name and status code \
only. `describe_metrics` and `METRIC_BUCKETS` register them with the exporter.
"""

[[changes]]
crate = "zainod"
kind = "feature"
description = """
The `prometheus` feature enables the light-wallet gRPC metrics and exports \
their histograms with explicit bucket edges.
"""

[[changes]]
crate       = "zaino-primitives"
kind        = "breaking"
description = "Confirmation depth is now a typed state model, not a signed integer. The `Confirmations = i64` alias is removed and replaced by two enums — `BlockConfirmations` (`NotInBestChain` | `Confirmed(NonZeroU32)`) and `TxConfirmations` (`Mempool` | `Mined(BlockConfirmations)`) — plus a `ConfirmationsCodecError`. The `confirmations` field of `BlockVerbose`, `BlockDeltas`, and `BlockHeaderVerbose` is now `BlockConfirmations`; the `confirmations` field of `TxOut` is now `TxConfirmations`."
migration   = "Drop the `Confirmations` alias and stop reasoning about confirmations as an i64. Cross the RPC integer boundary with each type's `to_rpc_i64` / `try_from_rpc_i64`; `try_from_rpc_i64` rejects an integer that encodes no state (`0` for a block, anything below `-1`, a count past `u32`). Build a best-chain block's state with `BlockConfirmations::of_best_chain_block(height, tip)` instead of writing the depth-plus-one by hand, and recover a boolean with `is_in_best_chain()`."

[[changes]]
crate       = "zaino-primitives"
kind        = "feature"
description = "`Height::depth_from(tip)` returns this height's depth below the tip (`tip - self`), or `None` when the height is above the tip — the single home for the tip-minus-height subtraction."

[[changes]]
crate       = "zaino-serve"
kind        = "internal"
description = "The JSON-RPC block, block-header, and tx-out wire renderers convert the now-typed confirmation state through its `to_rpc_i64` codec. The emitted integer is unchanged."

[[changes]]
crate       = "zaino-source-zebra-readstate"
kind        = "internal"
description = "The read-state adapter builds a block's confirmation state through `BlockConfirmations::of_best_chain_block`. The served value is unchanged."

[[changes]]
crate       = "zaino-source-zebra-rpc"
kind        = "internal"
description = "The `confirmations` field of parsed block, block-header, and tx-out replies is validated through the typed confirmation codec (new internal `ParseError::Confirmations`); a validator integer that encodes no state now fails the parse instead of flowing through as a raw number. Well-formed replies are unaffected."

[[changes]]
crate       = "zaino-state"
kind        = "internal"
description = "Call sites in the validator source and the node-backed indexer adapt to the typed confirmation state, rendering through its RPC codec at the zebra sink boundary; the mock source builds it through the new constructor. No served behaviour changes."

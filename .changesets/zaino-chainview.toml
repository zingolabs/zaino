id = "01a1181e-51c5-74f1-b643-54da397de4a7"

[[changes]]
crate = "zaino-chainview"
kind = "feature"
description = """
First release. One view over N trusted validators (`ChainView`, `ChainViewSubscriber`, one \
`EndpointPoller` each over `zaino_source::ChainDataSource`): `HeaderSync` fetches every \
validator's headers into a `zaino-header-chain` and publishes the most-work `VerifiedChain`; the \
served tip is `ChainTip { block, held_by }`, failing closed with `Unserved` when no trusted \
validator holds it, and finality moves only past a held block. A mempool transaction is servable \
once any validator lists it, with its fee, its spread across validators and peers, and a shared \
per-tip `MempoolTail` feed for `GetMempoolStream`. `submit` prechecks a transaction and sends it \
to one random entry per attempt, resubmitting until it is seen spreading (`SubmitPolicy`). \
Peers join through `ValidatorP2pSource` (`with_peers`, `PeerWatch`). A published \
`ChainViewSnapshot` names the `VerifiedChain` it was judged under (`chain`) and the transactions \
turned servable since another (`arrivals`); `ChainViewSubscriber::subscribe_published` wakes on \
every publish. Telemetry: `describe_metrics` gauges and `Alarms` (stale, ending, partitioned, \
eclipsed, finality paused). Feature `testing`: `ChainView::set_verified`, \
`ChainViewSnapshot::fixed`.
"""

[[changes]]
crate = "zaino-chainview"
kind = "breaking"
section = "changed"
description = """
Every request goes through a `zaino_traffic::TrafficBalancer`: `ChainView::new(addresses, \
balancer, depth)` (one address per trusted member, for logs and status); \
`observation_fold()` returns the `ObservationFold` to spawn, folding each member's poll \
(`observe`) and fetching new mempool bytes with `bytes(..)`; each poll asks `getblockhash` at \
the view's best (`poll_best`); `header_sync(chain)` asks `headers(Pinned)` and `report`s a validator serving \
an undecodable or rule-breaking header (benched); a submission's trusted entries are the \
balancer's `entries()`, each push `submit(member, raw)`. `ValidatorMetadata.health` \
(`zaino_traffic::Health`) replaces `state`; latency and failures move to the balancer's \
`members()`. Removed: `EndpointPoller`, `PollWaker`, `Endpoint`, `EndpointState`, `Ewma`.
"""
migration = """
Build the balancer first, then `ChainView::new(addresses, balancer.clone(), depth)`; spawn \
`view.observation_fold().run(cancel)` where the pollers ran and wire push streams to \
`balancer.pushed(member, Push::Changed | Push::Link(up))`. Read health from \
`ValidatorMetadata.health`, latency and failures from `balancer.members()`.
"""

[[changes]]
crate = "zaino-chainview"
kind = "breaking"
section = "removed"
description = """
The view no longer serves on its own: `ChainTip`, `Unserved`, `ChainViewSubscriber::{tail, \
subscribe_tip}`, `ChainViewSnapshot::{tip, unserved}`, `MempoolTail` / `Logged` (the feed) and \
the per-fold `zaino.chainview.*` gauges and alarm logs are gone. `zaino-snapshot` keeps the \
`GetMempoolStream` feed (keyed by the served tip), sets the gauges at scrape and logs the alarm \
edges per publish. `ChainViewSnapshot::held_by()` names the trusted validators holding the \
best block; `mempool()` and `validator_info()` return `Option` (`None` = no holder; the \
reason is the global snapshot's `Unavailable`); `shared_outbound_min()` and \
`EndpointSet::contains` are public. Publishes are stored in fold order.
"""
migration = """
Read the mempool, `GetLightdInfo` facts and the stream through `zaino_snapshot::Snapshot` \
(`mempool()?`, `lightd()?`, `mempool_stream()?`); `best()` + `held_by()` replace `tip()`.
"""

[[changes]]
crate = "zaino-chainview"
kind = "internal"
description = """
Submission prechecks (expired, wrong consensus branch) reject with zebrad's `-25`.
"""

[[changes]]
crate = "zaino-chainview"
kind = "fix"
section = "fixed"
description = """
A first sync no longer stalls at the final boundary: finality is vouched in the header chain \
(each trusted header run vouches its last header; claims and `getblockhash` answers on the \
chain vouch too), so final = best − depth after every batch, whatever the polls do. Header \
sync backs off a stalled validator alone (no shared 5 s sleep), skips a claim forked below the \
final tip until it moves, and never fetches above `final + depth + 2,000`. A poll's claim and \
`getblockhash` answer are folded before its mempool bytes are fetched.
"""

[[changes]]
crate = "zaino-chainview"
kind = "breaking"
section = "changed"
description = """
`held_by()` = answering validators (`Live` or `CatchingUp`) whose claim is the best or above \
it (a trusted validator holding a block holds every block below it). Each poll asks one \
`getblockhash`, at the view's best as the poll starts (no final-boundary item). `Agreement::Ahead` = claims higher, its \
answer on the verified chain. `Alarms::finality_paused` now = a block `depth` deep owed \
finality for 60 s with the final tip unmoved (was: the boundary unheld at that instant). The \
`Holders` core (and its per-poll stamps) is gone.
"""

[[changes]]
crate = "zaino-chainview"
kind = "breaking"
section = "changed"
description = """
Header sync trusts its validators: no header is verified (no Equihash, no proof of work, no \
thread pool) and none is synced from genesis. With no chain, or a validator's claim − depth past \
the fetch ceiling, it anchors the header chain at that claim − depth; above the anchor it \
inserts each trusted header on its parent link and work. The chain is memory only: \
`header_sync(HeaderChain::new(depth))`, `HeaderSync::run` returns `()` and `HeaderStoreFailed` \
is gone.
"""
migration = """
Build the header chain with `HeaderChain::new(depth)` (no store, no `Params`) and spawn \
`header_sync.run(cancel)` as an infallible task.
"""

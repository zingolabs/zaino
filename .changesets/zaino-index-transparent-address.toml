id = "01a1181e-5358-71ba-a4f4-46510689d118"

[[changes]]
crate = "zaino-index-transparent-address"
kind = "feature"
description = """
First release. The transparent-address index: two insert-only maps, `receives` (scoped by \
address) and `spent` (by outpoint) (`schema(network)`), each a pure projection of a block \
(`fold`). `TransparentAddressReader::as_of(tip).with_max_rows(n)` answers `utxos`, `utxos_of`, \
`balance`, `balances` and `transactions`, refusing a walk past `n` receives \
(`DEFAULT_MAX_ADDRESS_ROWS` = 100,000) rather than answering short. \
`TransparentAddressIndexWriter::new(store, batch_bytes)` follows the final stream.
"""

[[changes]]
crate = "zaino-index-transparent-address"
kind = "breaking"
section = "changed"
description = """
`fold(parent, block, out: &mut BlockChanges)` appends to a caller-opened delta (asserting it is the \
block's and the block extends the parent); it moved into `writer.rs`. `schema(network)` is \
replaced by `FORMAT` + `TABLES`; `TransparentAddressReader::new(view)` takes no network.
"""
migration = """
Open the delta with `store.changes(block.at())` (or a layer's), open the store with \
`Schema::new(IndexKind::TransparentAddress, FORMAT, network, TABLES)`, drop the reader's network.
"""

[[changes]]
crate = "zaino-index-transparent-address"
kind = "feature"
description = """
`WRITE_BUFFER`: this index's buffered heap before a bulk commit (what `zainod` hands its writer).
"""

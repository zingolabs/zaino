[[changes]]
crate = "zaino-index-compact-block"
kind = "breaking"
section = "Changed"
description = """
New `fold(parent, block, fees) -> Result<Changes, TreeSizeOutOfRange>`: one \
block's record, pure, its tree sizes read off the parent tip record through a \
`CompactBlockReader` (a fold onto anything but the block's parent panics). The \
writer carries no tree sizes and no longer reseeds them after a reorg. \
`ReadView<V>` is replaced by `CompactBlockReader<V>`, generic over any \
`SequenceRead` view (`new(view, network)`, `tip`, `block`, `range`); the \
writer publishes `CompactBlockReader<TieredView<V>>`. `testing::block` returns \
`(Block, BlockFees)`; `testing::committed` folds its blocks (cumulative sizes).
"""

[[changes]]
crate = "zaino-internal-value-balance"
kind = "breaking"
section = "Changed"
description = """
New `fold(parent, block) -> Result<(Changes, BlockFees), FoldError>`: one \
block's outputs and fees, pure, prevouts resolved through a \
`ValueBalanceReader<V>` over any `MapRead` view. `IndexWriterError` is renamed \
`FoldError`. A run of blocks is folded with one prevout probe; a block \
spending an output only a later block of its run creates is now \
`MissingPrevout` (before: resolved).
"""

[[changes]]
crate = "zaino-internal-block-hash-to-height"
kind = "breaking"
section = "Changed"
description = """
New `fold(block, network) -> Changes`: one block's `by_hash` row, pure. \
`ReadView<V>` is replaced by `BlockHashReader<V>`, generic over any `MapRead` \
view (`new(view)`, `height_of(&BlockHash)`); the writer publishes \
`BlockHashReader<TieredView<V>>`.
"""

# Machine-assigned changeset identity — do not edit.
id = "01a08949-6a67-74c1-826e-e4304e47a90b"

[[changes]]
crate       = "zaino-primitives"
kind        = "feature"
description = "Add RelativeChainWork, the proof-of-work total a run of blocks holds, measured from where the run begins rather than from genesis."

[[changes]]
crate       = "zaino-chain-head"
kind        = "breaking"
description = "ChainHeadWork is removed; a retained block's work is now a RelativeChainWork from zaino-primitives, measured from the anchor rather than from the anchor's parent."
migration   = "Replace ChainHeadWork with zaino_primitives::types::RelativeChainWork. ChainHeadWork::as_u128 has no replacement: an anchor-relative total cannot be converted to an absolute chain work, which is what that method allowed. The anchor's own work is now RelativeChainWork::ZERO, so a window's totals are each one block's work lower than before; comparisons between them are unaffected."

[[changes]]
crate       = "zaino-chain-store-zainodb"
kind        = "breaking"
description = """
- BlockContext, BlockHeaderData and IndexedBlock take a Work parameter: \
AbsoluteChainWork or Option<AbsoluteChainWork> (default).
- Only the AbsoluteChainWork form has a stored encoding.
- DbWrite::write_block takes IndexedBlock<AbsoluteChainWork>.
- StoredBlockRead answers from the v1 backend only.
- On-disk format unchanged.
"""
migration   = """
- BlockContext::new and conversion::indexed_block take the chainwork in either form.
- indexed_block_from_stored yields IndexedBlock<AbsoluteChainWork>; widen with map_chainwork(Some).
- Chain-head blocks carry None and do not type-check against the writer.
"""

[[changes]]
crate       = "zaino-chain-head-service"
kind        = "internal"
description = "Fold a window's work from RelativeChainWork::ZERO at the anchor. The anchor and an extending block are built by separate constructors, so the anchor no longer takes a fallible path it cannot fail on."

[[changes]]
crate       = "zaino-state"
kind        = "internal"
description = "Chain-head blocks converted for serving now carry no chain work, instead of reinterpreting the window's anchor-relative total as an absolute one."

[[changes]]
crate = "zaino-chain-store-zainodb"
kind = "fix"
description = """
- chainwork_from_parent takes the block's height; genesis seeds its own work, \
an unknown parent above genesis is ParentChainWorkUnknown.
- chainwork_from_parent_if_known maps that error to None for the zebra-block builder.
- A missing parent chainwork is StoreError::DataUnavailable on every build path.
"""

[[changes]]
crate = "zaino-state"
kind = "internal"
description = """
- The chain-index proptests run against a persistent finalised state and wait for it \
to finish building; they no longer exercise ephemeral mode.
- Generated chains are relinked (merkle root and parent hash) so the finalised state's \
write-path checks accept them, which also re-enables make_chain.
"""

# Machine-assigned changeset identity — do not edit.
id = "01a08949-6a67-74c1-826e-e4304e47a90b"

[[changes]]
crate       = "zaino-primitives"
kind        = "feature"
description = "Add RelativeChainWork, the proof-of-work total a run of blocks holds, measured from where the run begins rather than from genesis."

[[changes]]
crate       = "zaino-chain-head"
kind        = "breaking"
description = "ChainHeadWork is removed; a retained block's work is now a RelativeChainWork from zaino-primitives, measured from the anchor rather than from the anchor's parent."
migration   = "Replace ChainHeadWork with zaino_primitives::types::RelativeChainWork. ChainHeadWork::as_u128 has no replacement: an anchor-relative total cannot be converted to an absolute chain work, which is what that method allowed. The anchor's own work is now RelativeChainWork::ZERO, so a window's totals are each one block's work lower than before; comparisons between them are unaffected."

[[changes]]
crate       = "zaino-chain-store-zainodb"
kind        = "breaking"
description = "A block's chain work may be unknown, and the type says so: BlockContext, BlockHeaderData and IndexedBlock take a Work parameter that is AbsoluteChainWork where the total is known and Option<AbsoluteChainWork> (the default) where the producer may not know it. Only the known form has a stored form, so the writer takes IndexedBlock<AbsoluteChainWork> and the encoder is total. The on-disk format is unchanged."
migration   = "BlockContext::new and conversion::indexed_block take the chainwork in whichever form the caller has; pass an AbsoluteChainWork to build the block the writer accepts, or None for a block that is only served. A block read back from the store, or built from a StoredBlock, is IndexedBlock<AbsoluteChainWork>; call with_optional_chainwork() where a path serves stored and unstored blocks alike. Blocks produced from the chain head carry None and cannot be passed to the writer."

[[changes]]
crate       = "zaino-chain-head-service"
kind        = "internal"
description = "Fold a window's work from RelativeChainWork::ZERO at the anchor. The anchor and an extending block are built by separate constructors, so the anchor no longer takes a fallible path it cannot fail on."

[[changes]]
crate       = "zaino-state"
kind        = "internal"
description = "Chain-head blocks converted for serving now carry no chain work, instead of reinterpreting the window's anchor-relative total as an absolute one."

[[changes]]
crate = "zaino-chain-store-zainodb"
kind = "fix"
description = """
A block whose parent chainwork is unknown no longer receives a fabricated \
genesis chainwork. `chainwork_from_parent` takes the block's height and \
yields the block's own work only at `GENESIS_HEIGHT`; above it, an unknown \
parent is an error on the finalised path and, through \
`chainwork_from_parent_if_known`, no chainwork on the zebra-block builder. \
Both go through that one rule.
"""

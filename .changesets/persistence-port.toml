[[changes]]
crate = "zaino-persistence"
kind = "breaking"
section = "Changed"
description = """
Every index stores through one port: `PersistenceEngine` (`open`, `verify`), `Store` (`schema`, \
`view`, `commit`), `View` (`tip`), and the read traits `SequenceRead` (`len`, `record`, \
`records`) and `MapRead` (`value`, `values`, `range`). An index declares a `Schema` of sequence \
and map tables (`Width::Fixed` or `Variable`; a map's `scope` = the key prefix its ranges share) \
and commits a `Changes` (one buffer per table, shaped by the schema; a wrong width panics at the \
call naming the table). `DiskEngine` implements it: positional files for sequences, the LSM for \
maps, one manifest. `verify` goes through the engine's `Fs`, read only (`Fs::open_read_only`). \
`conformance` (feature `testing`) is the suite any engine runs through the port: implement \
`conformance::Subject`, run `history` under proptest and `contract`. `LsmIndex`, `LsmStore`, \
`SegmentLogs`, `SegmentSet`, `Key`, `Record`, `committed_files`, `CommittedFiles` and `Scrub` are \
gone, and `dir`, `manifest`, `pages` are private (`disk_bytes`, `IndexKind`, `ManifestError`, \
`PageError` re-exported at the root).
"""
migration = """
Declare `pub fn schema(network) -> Schema`, open with `DiskEngine::new(fs).open(path, &schema)`, \
commit `Changes::new(tip, store.schema())` with `append` / `insert`, and read the returned \
`DiskView`. Keys and values become named `encode` / `decode` functions over bytes. Offline checks: \
`DiskEngine::verify(path, &schema)`.
"""

[[changes]]
crate = "zaino-primitives"
kind = "feature"
section = "Added"
description = """
`OutPoint::encode() -> [u8; 36]` / `OutPoint::decode`: `txid ‖ vout` big-endian, byte order = \
`Ord` (the key value-balance and transparent-address both store).
"""

[[changes]]
crate = "zaino-header-chain"
kind = "breaking"
section = "Changed"
description = """
`HeaderStore` stores through `DiskEngine` (`schema` exported), so `zainod verify` now checks it. \
`HeaderChain::open` and `hash_at` are infallible (a read off a committed view cannot fail; \
corruption panics), and `HeaderStore::records` returns the records directly.
"""
migration = """
Drop the `?` / `expect` on `HeaderChain::open` and `hash_at`.
"""

[[changes]]
crate = "zaino-index-compact-block"
kind = "breaking"
section = "Changed"
description = """
One variable sequence `blocks` through `DiskEngine`. `CompactBlockStore::commit(&[(BlockRef, \
Bytes)])` replaces `append` + `commit(sizes)`; tree sizes after the tip are read from the tip \
record's `ChainMetadata`, never stored beside it. `view()` replaces `reader().pin()`. Range reads \
step at most 256 records and 1 MiB per window. `committed_files` is replaced by `schema`.
"""
migration = """
`Served::fixed(store.view())` for `store.reader().pin()`; build `(BlockRef, encode_compact_block(..))` \
pairs and `commit` them once.
"""

[[changes]]
crate = "zaino-index-tree-state"
kind = "breaking"
section = "Changed"
description = """
100 sequences through `DiskEngine` (`heights`, then per pool `l00`..`l31` and `subtrees`; only \
the tables that grew are fsynced). `heights.idx` is now `heights.dat`. `committed_files` is \
replaced by `schema`.
"""

[[changes]]
crate = "zaino-index-transparent-address"
kind = "breaking"
section = "Changed"
description = """
Two maps through `DiskEngine` (`receives` scoped by address, `spent` by outpoint). \
`committed_files` is replaced by `schema`.
"""

[[changes]]
crate = "zaino-internal-block-hash-to-height"
kind = "breaking"
section = "Changed"
description = """
One map `by_hash` through `DiskEngine`. `BlockHashStore::view()` replaces `reader().pin()`, and \
`commit` returns the committed view. `committed_files` is replaced by `schema`.
"""

[[changes]]
crate = "zaino-internal-value-balance"
kind = "breaking"
section = "Changed"
description = """
One map `outputs` through `DiskEngine`, prevouts resolved with one `values` batch. \
`committed_files` is replaced by `schema`.
"""

[[changes]]
crate = "zainod"
kind = "feature"
section = "Changed"
description = """
`zainod verify` runs `DiskEngine::verify` with each index's schema, and now checks the header \
chain too. Its report lists `units` (each with a `name`) per index, `header_chain` included.
"""

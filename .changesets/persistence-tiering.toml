[[changes]]
crate = "zaino-persistence"
kind = "feature"
section = "Added"
description = """
`Tiered<S: Store>` holds the blocks above a store's committed tip, generic over \
any engine: `apply` (a tip block, reorgable), `stage` (a final block, batched by \
source bytes), `finalize(through)` (every held block through a height as one \
commit, one fsync; a failed commit panics naming the index and its directory), \
`reorg` (every applied block dropped). A block's effect on an index is one \
`Changes`, held keyed exactly as the store holds it; `TieredView` reads held \
items first, then durable, through the same `SequenceRead` / `MapRead` traits, \
and clones in O(tables). The conformance suite (`history`, `contract`) now \
drives every engine through it against an oracle of held-over-finalized blocks.
"""

[[changes]]
crate = "zaino-persistence"
kind = "breaking"
section = "Changed"
description = """
`Store` gains `path()`; `DiskStore::path` is that trait method. \
`StoreError::commit_failed` is internal (`Tiered::finalize` reports a failed \
commit).
"""

[[changes]]
crate = "zaino-index-compact-block"
kind = "breaking"
section = "Changed"
description = """
`CompactBlockStore` is removed. `CompactBlockIndexWriter<S: Store>`, \
`CompactBlockService<V>`, `RangeCursor<V>` and `ReadView<V>` are generic over the \
persistence port: `CompactBlockIndexWriter::new(store, batch_bytes)` takes a \
store opened with `schema(network)`. Held blocks are projected on read (no \
precomputed shielded copy). `testing::committed(store, n)` serves `block(0..n)` \
committed. The writer's `NAME` is `IndexKind::CompactBlock.name()`.
"""

[[changes]]
crate = "zaino-index-tree-state"
kind = "breaking"
section = "Changed"
description = """
`TreeStateStore` and `NonFinalizedTrees` are removed. `TreeStateIndexWriter<S: \
Store>`, `TreeStateService<V>` and `ReadView<V>` are generic over the persistence \
port; `new(store, batch_bytes)` takes a store opened with `schema(network)`. A \
run of queued blocks is folded as one batch and split back per block. \
`IndexWriterError::Store` is removed. The writer's `NAME` is \
`IndexKind::TreeState.name()`.
"""

[[changes]]
crate = "zaino-index-transparent-address"
kind = "breaking"
section = "Changed"
description = """
`TransparentAddressIndexWriter::open(fs, path, network, batch)` is replaced by \
`new(store, batch_bytes)`; the writer, `TransparentAddressService<V>` and \
`ReadView<V>` are generic over the persistence port. The writer's `NAME` is \
`IndexKind::TransparentAddress.name()`.
"""

[[changes]]
crate = "zaino-internal-value-balance"
kind = "breaking"
section = "Changed"
description = """
`ValueBalanceIndexWriter::open(fs, path, network, batch)` is replaced by \
`new(store, batch_bytes)`, generic over the persistence port. \
`IndexWriterError::Store` is removed. The writer's `NAME` is \
`IndexKind::ValueBalance.name()`.
"""

[[changes]]
crate = "zaino-internal-block-hash-to-height"
kind = "breaking"
section = "Changed"
description = """
`BlockHashStore` is removed. `BlockHashIndexWriter<S: Store>`, \
`BlockHashService<V>` and `ReadView<V>` are generic over the persistence port; \
`new(store, batch_bytes)` takes a store opened with `schema(network)`. The \
writer's `NAME` is `IndexKind::BlockHash.name()`.
"""

[[changes]]
crate = "zaino-sync"
kind = "feature"
section = "Added"
description = """
`Subscription::run(first, budget)`: the first `Apply` plus every `Apply` already \
queued behind it, up to `budget` bytes, never waiting; the step that ends the \
run is the next `next()`. `Subscription::try_next` is internal.
"""

[[changes]]
crate = "zaino-grpc"
kind = "breaking"
section = "Changed"
description = """
`Routes<S, V>` and `GrpcService<S, V>` take the persistence engine's view type \
`V` (`SequenceRead + MapRead`) every index service reads through; the crate \
names no engine.
"""

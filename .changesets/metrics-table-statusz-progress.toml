[[changes]]
crate = "zainod"
kind = "breaking"
section = "Changed"
description = """
The admin listener moves to a `[metrics]` table: `listen_address` replaces the \
top-level `metrics_endpoint` (a config still carrying it fails to parse).
"""

[[changes]]
crate = "zainod"
kind = "feature"
section = "Added"
description = """
`/statusz` reports `fetch_height` (the last block fetched, so sync progress is \
visible between index batch commits) and `grpc.sent_bytes` (response bytes \
served), so a probe needs nothing from `/metrics`.
"""

[[changes]]
crate = "zainod"
kind = "feature"
section = "Added"
description = """
`/statusz` indexes report `merged` (the last final block held for the next \
bulk commit, so bulk progress shows between batch commits) beside `durable` \
and `applied`.
"""

[[changes]]
crate = "zaino-peers"
kind = "feature"
section = "Added"
description = """
New crate: zebra-network embedded as Zaino's p2p layer. `PeerNetwork` fetches headers, blocks \
and mempool transactions from peers, identifying each by the id zebra recomputes from its bytes \
(an answer that was not asked for is dropped and its peer scored), streams every transaction \
`inv` attributed to its sender, lists recently live peers (`live`) and those on an accepted \
protocol version as submission entries (`entries`), and pushes a transaction to one chosen \
address over a fresh isolated connection.
"""

[[changes]]
crate = "zaino-index-compact-block"
kind = "breaking"
section = "Fixed"
description = """
`GetBlockRange` projection drops a transaction left with no pool component \
(no spends, outputs, actions, `vin` or `vout`) for every pool selection, \
`Pools::ALL` included, as lightwalletd's `FilterTxPool` does; the block is \
always served, and `block(h)` stays unfiltered. A shielded-default range no \
longer carries empty coinbase or transparent-only transactions. Every range \
window is now projected (`Pools::ALL` no longer serves the stored bytes as-is).
"""

[[changes]]
crate = "zaino-index-compact-block"
kind = "feature"
section = "Added"
description = """
`range(start, end, pools)` with `start > end` walks the range top down \
(non-finalized blocks first, then file windows downward, records reversed in \
each), the proto's "decreasing height order". The top is clamped to the tip; \
while syncing, a range is judged by its top.
"""

[[changes]]
crate = "zaino-index-tree-state"
kind = "breaking"
section = "Changed"
description = """
`TreeStateService::new(served, network, activations)` takes `PoolActivations` \
(each pool's first height: Sapling, NU5 for Orchard, NU6.3 for Ironwood), \
built by `PoolActivations::from_validator(&BlockchainInfo)`. A tree state \
below Sapling activation is `ServeError::BeforeSapling`. Tree states are read \
only through the service (`treestate_in` / `latest_in` on a pinned view): \
`ReadView::treestate` is crate-private and `ReadView::latest` is removed.
"""

[[changes]]
crate = "zaino-primitives"
kind = "feature"
section = "Added"
description = """
`Height::down_to(end)`: `self` to `end`, both inclusive, descending.
"""

[[changes]]
crate = "zaino-grpc"
kind = "fix"
section = "Fixed"
description = """
`GetBlockRange` with `start > end` streams blocks in decreasing height order \
instead of refusing with `INVALID_ARGUMENT`. `GetTreeState` / \
`GetLatestTreeState` write a pool's tree only from its activation height and \
`""` below it (zebra's `z_gettreestate` + lightwalletd), and refuse a height \
below Sapling activation with `INVALID_ARGUMENT`.
"""

[[changes]]
crate = "zainod"
kind = "fix"
section = "Changed"
description = """
With the tree-state index enabled, boot reads the validator's \
`getblockchaininfo` upgrade schedule once for the pools' activation heights \
(`IndexerError::UpgradeSchedule` if it is unreadable).
"""

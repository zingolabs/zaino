[[changes]]
crate = "zaino-grpc"
kind = "fix"
section = "Fixed"
description = """
`SendTransaction` answers as lightwalletd does: `sendrawtransaction`'s JSON result, i.e. the \
display-order txid in quotes; it was unquoted hex in internal byte order. `GetMempoolTx` drops a \
transaction the request's `poolTypes` leave with no component, as `GetBlockRange` already did \
(lightwalletd `FilterTxPool`): both paths share compact-block's projection. A unary request body \
must be exactly one whole gRPC frame (`INVALID_ARGUMENT` otherwise); the length prefix was ignored.
"""

[[changes]]
crate = "zaino-proto"
kind = "breaking"
section = "Removed"
description = """
`zaino.index.v1.IndexedTipService` (`proto::indexed_tip`) is gone and zainod no longer serves it \
(added in zainod 0.10.1). `proto::utils` (`PoolTypeFilter`) is gone: unused. Added `frame` \
(`FRAME_HEADER`, `frame_into`, `framed_len`, `split_frame`): the one gRPC length-prefix framing.
"""

[[changes]]
crate = "zaino-source"
kind = "breaking"
section = "Changed"
description = """
`GetBlockLinkError` is merged into `GetBlockError` (one `HeightNotFound` for both lookups); \
`BlockLinks` = `Vec<Result<BlockLink, GetBlockError>>`. `Call` and `RpcClient::{call_as, \
call_batch}` are crate-private.
"""
migration = """
Match `GetBlockError::HeightNotFound` where you matched `GetBlockLinkError::HeightNotFound`.
"""

[[changes]]
crate = "zaino-header-chain"
kind = "breaking"
section = "Changed"
description = """
`HeaderChain::subscribe` is gone (no caller): the best tip is a plain field read by `best()`. \
`params()` is removed, `tree_len` is test-only, and the crate no longer depends on tokio.
"""

[[changes]]
crate = "zaino-persistence"
kind = "breaking"
section = "Changed"
description = """
`IndexKind::name()` = each index's one name (snake_case): writer `NAME`s, metric labels, verify \
keys, task names, default directories and snapshot directories all read it. The file layer's \
internals (`pages`, `manifest`, `dir`, segment lists) are crate-private.
"""

[[changes]]
crate = "zainod"
kind = "breaking"
section = "Changed"
description = """
Default index directories and snapshot archive directories are snake_case (`compact_block`, \
`header_chain`, …), named by `IndexKind::name()`. Index writers publish one view per state \
change; value-balance now publishes its merged tip during bulk sync (its progress in metrics and \
`/statusz` moved only at commits), and tree-state publishes the store's committed tip as durable.
"""
migration = """
Rename existing index directories to snake_case, or set each `[index.*].path` explicitly. A \
snapshot published with hyphenated directories no longer unpacks in place.
"""

[[changes]]
crate = "zaino-primitives"
kind = "feature"
section = "Added"
description = """
`chain_name` (`main`/`test`/`regtest`, lightwalletd's `chainName`) and `network_name` \
(`mainnet`/`testnet`/`regtest`): the one spelling of each. Removed unused `Height::down_to`, \
`BlockRef::from_tip` and `PerPool::try_from_fn`.
"""

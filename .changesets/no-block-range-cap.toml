[[changes]]
crate = "zainod"
kind = "breaking"
section = "Removed"
description = """
`serve.max_block_range` is removed: `GetBlockRange` has no length cap. \
pepper-sync asks for a whole shard range in one call, and a shard (2^16 notes) \
spans any number of blocks; a mainnet zingolib sync asked for 158,853 and was \
refused by the old 131,072 default. The stream stays bounded per 1 MiB window.
"""

[[changes]]
crate = "zaino-index-compact-block"
kind = "breaking"
section = "Removed"
description = """
`DEFAULT_MAX_BLOCK_RANGE`, `CompactBlockService::with_max_range` and \
`ServeError::RangeTooLarge` are removed; `range` serves any span, clamped to the tip.
"""

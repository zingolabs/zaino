id = "01a1181e-512e-7465-9ecc-2e8becfe4720"

[[changes]]
crate = "zaino-persistence"
kind = "feature"
description = """
First release. The persistence port every Zaino index stores through: `PersistenceEngine` \
(`open`, `verify`), `Store` (`apply` buffers final changes, `commit` writes them in one atomic \
commit, `committed` / `staged` read), `View`, the read traits `SequenceRead` and `MapRead`, and \
`Schema` / `BlockChanges` (sequence and map tables, fixed or variable width). `Overlay` and \
`OverlayView` hold non-final data over a committed view by structural sharing. `DiskEngine` \
implements it: positional files for sequences, an LSM with binary-fuse filters and fence keys \
for maps, one two-slot `MANIFEST` commit per directory, a CRC per 4 KiB page checked on first \
read, background merges, all through the `fs::Fs` port. `IndexKind` names every index. Feature \
`testing`: `SimFs` crash-state simulation and the `conformance` suite (`history`, `contract`) any \
engine runs.
"""

[[changes]]
crate = "zaino-persistence"
kind = "breaking"
section = "changed"
description = """
Tables are `const` handles declared once per index: `SequenceTable::new(id, name, record)`, \
`MapTable::new(id, name, key, value, scope)`, `Tables::new(sequences, maps)` (ids = positions, \
checked at compile time), `Schema::new(kind, format, network, tables)` (now `Copy`, built once at \
open; `with_sequence` / `with_map` / `sequence_ids` / `map_ids` removed). `BlockChanges::new` is \
private: a block's delta comes from `Store::changes(at)` or `Overlay::changes(at)`, filled through \
`changes.sequence(T).append(..)` / `changes.map(T).insert(..)` (`SequenceAppends`, `MapInserts`). \
Reads mirror writes: `view.sequence(T)` (`count`, `record`, `records`) and `view.map(T)` \
(`value`, `values`, `range`); `View::schema()`. A handle of another schema panics naming the \
table. `BlockChanges::block()` = the block a delta is for. On-disk layout unchanged.
"""
migration = """
Declare the index's tables as `const` handles + `pub const TABLES: Tables`, open with \
`Schema::new(kind, FORMAT, network, TABLES)`, open deltas with `store.changes(block.at())`, and \
read with `view.sequence(T)` / `view.map(T)` instead of passing a `SequenceId` / `MapId`.
"""

[[changes]]
crate = "zaino-persistence"
kind = "breaking"
section = "changed"
description = """
`Store::buffered_bytes` reports the heap the buffer holds, not its item bytes: per item its \
`Bytes` handle, allocation and tree slot, per block its delta, derived from the buffer's types \
and within ±30% of the measured heap for fixed, variable and map tables (`tests/buffer_heap.rs`, \
counting allocator). Item bytes undercounted the buffer's RAM 2–10×, so a 64 MiB batch held up \
to ~750 MB before its first commit.
"""
migration = """
A batch budget compared against `buffered_bytes()` is now RAM: the same figure commits 2–10× \
sooner. Size it as the buffer's heap, not bytes on disk.
"""

[[changes]]
crate = "zaino-persistence"
kind = "breaking"
section = "changed"
description = """
`PersistenceEngine::open(path, schema, write_buffer: NonZeroUsize)`: the store commits by itself \
in `Store::apply` once its buffer (`buffered_bytes`, heap) reaches `write_buffer`; that commit \
failing panics through `StoreError::commit_failed` (index + directory named). \
`conformance::contract` checks it.
"""
migration = """
Pass the index's `WRITE_BUFFER` to `open` and drop any `buffered_bytes()` threshold check before \
`commit`; call `commit` only to make a buffer durable early (the final tip, shutdown). \
`NonZeroUsize::MAX` = commits only when told.
"""

[[changes]]
crate = "zaino-persistence"
kind = "breaking"
section = "changed"
description = """
Two read contracts: `CommittedView` (`SequenceRead + MapRead + 'static`, a committed snapshot \
read on any thread; `DiskView` and `OverlayView<V, Overlay>` over one) is what serves, and \
`Store::View: CommittedView`; `Store::staged` returns `StagedView<'_, V>` = \
`OverlayView<V, &WriteBuffer>`, a borrow of the store (holding one across `apply` no longer \
compiles, never a buffer copy). `View` drops its `'static` bound.
"""
migration = """
Bound served views on `V: CommittedView` (it was `SequenceRead + MapRead`); read a staged view \
inside the fold and drop it before `apply`.
"""

[[changes]]
crate = "zaino-persistence"
kind = "breaking"
section = "changed"
description = """
`DiskEngine::new(fs, LsmConfig { fanout, merge_slots })`: the map tables' merge fanout (default \
16, was a fixed 8) and the merges doing I/O at once (default 2, was a fixed 4), the latter shared \
by every store one engine opens (was process-wide).
"""
migration = """
`DiskEngine::new(fs)` → `DiskEngine::new(fs, LsmConfig::default())`.
"""

[[changes]]
crate = "zaino-persistence"
kind = "breaking"
section = "changed"
description = """
`BlockChanges::tip()` → `block()` (the block a delta is for, its tip only once applied); \
`BlockChanges::bytes()` removed (unused); `assert_next` / `assert_run` move to zaino-sync (the \
port no longer names the block type); `BlockChanges::schema()` is public. Batched point lookups \
(`MapRead::values`, 64 keys and up) plan and issue their readahead across the rayon pool instead \
of one thread.
"""
migration = """
`changes.tip()` → `changes.block()`; `out.assert_next(parent, block)` → \
`zaino_sync::assert_next(out, parent, block)`, `BlockChanges::assert_run(..)` → \
`zaino_sync::assert_run(..)`.
"""

[[changes]]
crate = "zaino-persistence"
kind = "feature"
section = "added"
description = """
`DiskView::footprint()` → `TableFootprint { table, bytes, cached }` per table (committed bytes, \
page-cache share by `mincore`, `None` when not knowable). Each commit records \
`zaino_store_commit_seconds` + `zaino_store_commit_bytes_total` `{index}`; crate-level \
`describe_metrics` (store + LSM) and `METRIC_BUCKETS`.
"""

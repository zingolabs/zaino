id = "01a1181e-52f2-751b-990c-adca0cee12d5"

[[changes]]
crate = "zaino-index-tree-state"
kind = "feature"
description = """
First release. The commitment-tree index for Sapling, Orchard and Ironwood: retained tree nodes, \
per-height tree sizes and subtree roots (`schema(network)`), so any historical frontier rebuilds \
without hashing. `fold` / `fold_run` derive a block's (or a run's) changes with batched Merkle \
hashing across cores; `TreeStateReader` answers `treestate` and `subtree_roots` over any view, \
and a tree state writes a pool's tree only from its activation (`PoolActivations`). \
`TreeStateIndexWriter::new(store, batch_bytes)` follows the final stream.
"""

[[changes]]
crate = "zaino-index-tree-state"
kind = "breaking"
section = "changed"
description = """
`fold(parent, block, out: &mut BlockChanges) -> Result<(), FoldError>` appends to a caller-opened \
delta (asserting it is the block's and the block extends the parent); it and the run fold moved \
into `writer.rs`, the run fold filling one caller-opened delta per block (same batched hashing). \
`schema(network)` is replaced by `FORMAT` + `TABLES` (the 100 tables as constants); \
`TreeStateReader::new(view)` takes no network.
"""
migration = """
Open the delta with `store.changes(block.at())` (or a layer's), open the store with \
`Schema::new(IndexKind::TreeState, FORMAT, network, TABLES)`, drop the reader's network.
"""

[[changes]]
crate = "zaino-index-tree-state"
kind = "feature"
description = """
`WRITE_BUFFER`: this index's buffered heap before a bulk commit (what `zainod` hands its writer).
"""

id = "01a1181e-5156-71f6-bc38-e957fb7dcf70"

[[changes]]
crate = "zaino-sync"
kind = "feature"
description = """
First release. The final path: `FinalFollower::new(chain, balancer, lookahead)` fetches every \
block up to the `VerifiedChain`'s final tip height, by height from trusted members, in order \
(`fetch_at` / `check_block_at`: coinbase height + merkle root vs its own header, \
CVE-2012-2459; a misanswer `report`ed and re-asked; no header history read) onto one \
`IndexerDataSink<Block>`, from the lowest durable tip (`subscribe(kind, durable, queue)`). Each \
block must extend the block sent before it (`FollowError::Unlinked`) and each durable tip it \
reaches (`FollowError::Diverged`, naming the index). `fetch` / `check_block` fetch by hash \
against a verified header (the NFS's). `IndexerDataSink<T>` is a \
byte-bounded broadcast queue (all-or-nothing `send`, `shutdown`); `FeeSink` carries \
value-balance's fees to compact-block. `Committer` is the apply / commit loop every writer runs \
(commits when the batch fills or 1 s after its oldest uncommitted run; `Run::{apply, apply_batch}` fold each block a \
store lacks); `IndexHandle` is what the rest of the daemon knows about one index (`view`, `tip`, \
`changed`). `SyncProgress` = the last height sent \
(`zaino_fetch_height`); `zaino_fetch_*_total` and `zaino_sink_queue_bytes` metrics; `compute` \
for CPU work on the rayon pool.
"""

[[changes]]
crate = "zaino-sync"
kind = "fix"
description = """
`Committer` commits 1 s after its oldest uncommitted run, steady stream or quiet (was: 1 s of \
quiet, re-armed per block, so a steady bulk stream only committed on a full batch).
"""

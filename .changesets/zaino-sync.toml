id = "01a1181e-5156-71f6-bc38-e957fb7dcf70"

[[changes]]
crate = "zaino-sync"
kind = "feature"
description = """
First release. The final path: `FinalFollower::new(chain, balancer, lookahead)` fetches every \
final block of the header chain's `VerifiedChain` in order (`fetch` / `check_block`: hash, \
coinbase height, merkle root, CVE-2012-2459; a misanswer `report`ed and re-asked) onto one \
`IndexerDataSink<Block>`, from the lowest durable tip (`subscribe(kind, durable, queue)`); a \
durable tip off the final chain stops it (`FollowError::Diverged`). `IndexerDataSink<T>` is a \
byte-bounded broadcast queue (all-or-nothing `send`, `shutdown`); `FeeSink` carries \
value-balance's fees to compact-block. `Committer` is the apply / commit loop every writer runs \
(commits when the batch fills or after 1 s idle; `Run::{apply, apply_batch}` fold each block a \
store lacks); `IndexHandle` is what the rest of the daemon knows about one index (`view`, `tip`, \
`changed`). `SyncProgress` = the last height sent \
(`zaino_fetch_height`); `zaino_fetch_*_total` and `zaino_sink_queue_bytes` metrics; `compute` \
for CPU work on the rayon pool.
"""

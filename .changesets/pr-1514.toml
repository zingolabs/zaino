[[changes]]
crate       = "zaino-primitives"
kind        = "breaking"
description = "`TransparentAddress` is validated at construction. The unchecked `TransparentAddress::new(String)` is removed and replaced by `TransparentAddress::try_new(impl Into<String>) -> Result<Self, TransparentAddressError>`, which parses the string with the `zcash_address` protocol library and accepts only transparent (P2PKH / P2SH) addresses — rejecting shielded, unified, Sprout, TEX, and undecodable strings. `TransparentAddressError` is a new public type."
migration   = "Replace `TransparentAddress::new(s)` with `TransparentAddress::try_new(s)?` and handle `TransparentAddressError`. A string that was previously wrapped unchecked is now rejected unless it is a well-formed transparent address."

[[changes]]
crate       = "zaino-primitives"
kind        = "feature"
description = "`TransparentAddress` exposes `network()` (the `zcash_protocol` `NetworkType` the address encodes for) and `script_type()` (`ScriptType::P2PKH` or `P2SH`), both decoded once at construction. Construction is network-blind; matching the network to a running chain is the consumer's policy."

[[changes]]
crate       = "zaino-serve"
kind        = "fix"
description = "`getaddressdeltas` validates the client-supplied address strings and rejects a malformed one with an invalid-params error instead of admitting an unvalidated filter string to the index. Security-relevant: a bogus client-supplied address no longer reaches the index."

[[changes]]
crate       = "zaino-serve"
kind        = "breaking"
description = "`GetAddressDeltasParams::into_domain` is now fallible, returning `Result<AddressDeltasRequest, GetAddressDeltasError>` (a new public error type), because it parses the client's address strings."
migration   = "Handle the `Result` at the call site; a request carrying an invalid transparent address is now an error rather than a silently-wrapped string."


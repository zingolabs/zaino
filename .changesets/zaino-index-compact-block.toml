id = "01a1181e-52c0-71fb-a4db-e4f639845bbb"

[[changes]]
crate = "zaino-index-compact-block"
kind = "feature"
description = """
First release. The compact-block index: one variable sequence of gRPC-framed `CompactBlock` \
records (`schema(network)`), stored with every pool and every `CompactTx.fee` (from the \
value-balance index; 0 for a coinbase or a fee of 2^32 zatoshis or more). `fold(parent, block, \
fees)` derives one block's record; `CompactBlockReader` reads any view (`tip`, `block`, `range`, \
`block_at`, `resident_block`); `RangeCursor` walks a range in ≤ 1 MiB windows, ascending or \
descending, projected to the requested `Pools` (a transaction left with no component dropped, \
as lightwalletd does). `CompactBlockIndexWriter::new(store)` follows the final stream, one fee \
step off value-balance's `FeeSink` per block.
"""

[[changes]]
crate = "zaino-index-compact-block"
kind = "breaking"
section = "changed"
description = """
`fold(parent, block, fees, out: &mut BlockChanges) -> Result<(), TreeSizeOutOfRange>` appends to a \
caller-opened delta (asserting it is the block's and the block extends the parent); it moved \
into `writer.rs`. `schema(network)` is replaced by `FORMAT` + `TABLES`; \
`CompactBlockReader::new(view)` takes no network.
"""
migration = """
Open the delta with `store.changes(block.at())` (or a layer's), open the store with \
`Schema::new(IndexKind::CompactBlock, FORMAT, network, TABLES)`, drop the reader's network.
"""

[[changes]]
crate = "zaino-index-compact-block"
kind = "feature"
description = """
`WRITE_BUFFER`: this index's buffered heap before a bulk commit (the `write_buffer` `zainod` \
opens its store with).
"""

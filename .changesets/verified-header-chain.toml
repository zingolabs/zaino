[[changes]]
crate = "zaino-header-chain"
kind = "breaking"
section = "Fixed"
description = """
Consensus fixes. `nVersion` is read as int32 (`Header::version` returns `i32`): a header with the \
high bit set is refused, versions above 4 stay valid. A solution length that is not a minimal \
compactSize is refused (`DecodeError::NonMinimalLength`). Difficulty takes the spacing (150 / 75 / \
25 s) and the averaging window (17, 102 from NU7, ZIP 218) from the checked height, the mean \
target without overflowing on 102 testnet targets, and Testnet's minimum-difficulty gap of \
18 × spacing from NU7 (450 s; 451 qualifies). `Params` carries the NU7 height (Testnet \
4,465,026; Mainnet unset) and `Params::regtest` takes it as a second argument; the rules read 113 \
ancestors.
"""

[[changes]]
crate = "zaino-header-chain"
kind = "breaking"
section = "Changed"
description = """
Verification is two stages: `check(&Params, Header) -> Checked` (the header alone: version, \
nBits, solution, proof of work; pure, run in parallel) and `link_run` (linkage within a run, cut \
at the first failure), then `HeaderChain::insert(&Checked, now)` (attach, difficulty, time, work, \
best). `HeaderChain::new` is removed (every chain has a store). `finalize` returns `StoreError` \
only: finalizing off the best branch or above the boundary is a caller bug and panics, so \
`FinalizeError` and `FinalizeOutcome` are removed. The tree is bounded: at most `4 · depth` \
side-branch nodes and 32 side-branch tips, the lowest-work side leaf evicted past either (the best \
branch never). Store records grow to 88 bytes with the merkle root.
"""

[[changes]]
crate = "zaino-header-chain"
kind = "feature"
section = "Added"
description = """
`VerifiedChain` (`HeaderChain::verified`): an immutable snapshot of the best chain with `best`, \
`final_tip`, `hash_at` and `header_at` (hash, merkle root, time, nBits, work) at any height up to \
the best (final ones from the store), and zcashd's `locator`. `HeaderChain::check` asserts the header-chain invariants (best = most-work \
leaf, descent from the final tip, bounds, best path) and names the one broken. \
`Rejected::is_deferred` marks the clock rule (retry later, never blame). Testnet header fixtures \
across 299,188 and 584,000.
"""

[[changes]]
crate = "zaino-chainview"
kind = "breaking"
section = "Changed"
description = """
`HeaderSync` owns its `HeaderChain` (no lock): stage A on one blocking task per core, stage B and \
finality on the blocking pool. `HeaderSync::run` returns `Result<(), HeaderStoreFailed>`: a \
failed commit of final headers ends the task instead of logging and stopping finality. \
`HeaderSync::subscribe` publishes the `VerifiedChain` whenever its best or final tip moves. A \
boundary becomes final only when held by a trusted validator (never gated on work); a header \
from the future is deferred, never blamed on its validator.
"""

[[changes]]
crate = "zaino-chainview"
kind = "feature"
section = "Added"
description = """
`Alarms::finality_paused` and the `zaino.chainview.finality_paused` gauge: 1 while a boundary \
block is deep enough but no trusted validator holds it; a WARN when it rises, an INFO when it \
clears.
"""

[[changes]]
crate = "zaino-primitives"
kind = "feature"
section = "Added"
description = """
`testing::Chain::mine_bits`: a child at a chosen time under a chosen nBits (work that varies per \
branch).
"""

[[changes]]
crate = "zainod"
kind = "fix"
section = "Fixed"
description = """
A failed commit of final headers ends the daemon (`IndexerError::HeaderStore`) instead of \
silently stopping header finality.
"""

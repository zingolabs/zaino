[[changes]]
crate = "zaino-sync"
kind = "breaking"
section = "Added"
description = """
`zaino_sink_queue_bytes{sink, subscriber}`: the bytes \
each subscriber's queue holds, added on send and subtracted on pop. A queue \
at its budget is the index holding back the producer. A sink is named at \
construction for the `sink` label: `IndexerDataSink::new(name)` replaces \
`Default` (zainod names its sinks `blocks` and `fees`).
"""

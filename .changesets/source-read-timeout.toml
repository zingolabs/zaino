[[changes]]
crate = "zainod"
kind = "fix"
section = "Fixed"
description = """
Validator requests time out on silence, not total duration: a multi-MB block \
over a slow link no longer fails and retries forever ("error decoding response \
body"). `[source]` and each `[[chainview_peers]]` entry take \
`connect_timeout_secs` (default 2) and `read_timeout_secs` (default 30).
"""

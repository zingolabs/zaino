description = "Add the `zaino.index.v1.IndexedTipService` protocol with the `SubscribeIndexedTips` server-streaming call."

[[changes]]
crate = "zaino-serve"
kind = "feature"
description = """
Serve `IndexedTipService/SubscribeIndexedTips` on the gRPC server. A subscription \
first receives the current indexed tip, then each canonical tip change, including a \
same-height reorg. A slow client receives only the latest tip, and graceful shutdown \
ends open subscriptions."""


[[changes]]
crate = "zaino-chainview"
kind = "breaking"
section = "Changed"
description = """
The quorum tip counts ancestry: each voting endpoint's vote is its tip plus \
`depth` ancestors, and the tip is the highest block a majority of those chains \
hold by hash. Validators one block apart during propagation now agree on the \
parent instead of splitting the vote, so the tip (and the mempool RPCs) no \
longer drops out on every block. `agreed_by` is every voter holding the tip, at \
its own tip or below it. When the endpoint that was ahead stops voting, the tip \
retreats onto the block the rest hold.
"""
migration = """
Pass the ancestry window to `ChainView::new(endpoints, depth)` (zainod uses \
`fetch.finalised_depth`). An `EndpointSource` must also implement \
`zaino_source::GetBlockLink`. Treat a quorum tip that moves onto an ancestor as \
a reorg, and expect `agreed_by` to include validators ahead of the tip.
"""

[[changes]]
crate = "zaino-chainview"
kind = "breaking"
section = "Changed"
description = """
`ValidatorMetadata` reports an endpoint's own tip through `tip()`, derived from \
its chain, instead of a `tip` field. `peers` holds `PeerInfo` (address and \
direction) instead of bare addresses. `Agreement` gains `Ahead` (the quorum tip \
is on its chain, below its tip) and `Behind` (its tip is on the quorum's chain, \
below the quorum tip). An endpoint one block behind is `Behind`, not `Diverged`.
"""
migration = """
Read `meta.tip()` instead of `meta.tip`, `peer.addr` instead of the address \
string, and match the two new `Agreement` variants.
"""

[[changes]]
crate = "zaino-chainview"
kind = "fix"
section = "Fixed"
description = """
A change in `agreed_by` alone no longer bumps the epoch, so it no longer closes \
every `GetMempoolStream` tail or drops unlisted `ours` entries; the tip watch \
still updates for fetch routing. `BelowQuorum::agreeing` reports the largest \
group of voters holding one common block (it was always 0). `getpeerinfo` is \
read while an endpoint is catching up too, and a failed read keeps the last \
peers instead of failing the poll and degrading the endpoint.
"""

[[changes]]
crate = "zaino-chainview"
kind = "feature"
section = "Added"
description = """
Endpoint telemetry. `describe_metrics()` registers `zaino.chainview.*` gauges \
(`endpoint_state`, `agreement`, `tip_height`, `stale_blocks`, `peers`, \
`agreeing`, `shared_outbound_min`). One WARN when an alarm rises and one INFO \
when it clears: a stale tip (a live endpoint ≥ 24 blocks behind its own \
clock-based estimate), a partition (two live endpoints sharing no outbound \
peer), and an eclipse (live endpoints reaching at most 2 distinct outbound \
peers). None of it votes or gates serving.
"""

[[changes]]
crate = "zaino-source"
kind = "feature"
section = "Added"
description = """
`GetBlockLink` (`getblockheader <height> false`) returns `BlockLink { hash, \
prev_hash }` for the best-chain block at a height, with the hash recomputed \
from the header bytes; `GetBlockLinkError::HeightNotFound` above the tip. \
`ZebraRpcAdapter` and `MockChain` implement it.
"""

[[changes]]
crate = "zaino-non-finalized-state"
kind = "feature"
section = "Added"
description = """
`ChainHead::next_floor()`: the floor the next `advance` enforces, since its \
trim runs first. A tip below it is `AdvanceError::BelowWindow`.
"""

[[changes]]
crate = "zaino-sync"
kind = "fix"
section = "Fixed"
description = """
A quorum tip below the chain head's window no longer stops production with \
`BelowWindow`. With ancestry voting a lagging majority can pull the tip under \
the window, and on mainnet and testnet the window covers every legal fork \
point, so the producer logs a WARN and waits for the next tip. A tip that \
contradicts a block an index committed at that height stops production with \
`ProduceError::Diverged`.
"""

[[changes]]
crate = "zainod"
kind = "feature"
section = "Added"
description = """
The chain view's ancestry window is `fetch.finalised_depth`, and its \
`zaino_chainview_*` metrics are served from `/metrics`.
"""

[[changes]]
crate = "zaino-primitives"
kind = "breaking"
section = "Removed"
description = """
The chain-work types are removed: `AbsoluteChainWork`, `SingleBlockWork`, \
`RelativeChainWork`, `WorkOverflow`, `WorkUnderflow` and `ChainWorkBytesError`, \
along with `CompactDifficulty::to_work`, `as_bits` and `try_from_be_bytes`. \
Zaino does no work-based fork choice: the tip is agreement by hash across the \
configured validators, and a header's work means nothing without the \
proof-of-work checks Zaino does not hold. `CompactDifficulty::try_from_bits` \
still validates nBits, including the work-width check.
"""
migration = """
Drop any use of the work types. Validate nBits with \
`CompactDifficulty::try_from_bits`; the tip comes from zaino-chainview.
"""

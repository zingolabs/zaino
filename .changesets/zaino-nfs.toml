id = "01a1181e-51f4-7694-8eb6-3635f88d0c12"

[[changes]]
crate = "zaino-nfs"
kind = "feature"
description = """
First release. The non-finalized state: `Nfs::new(verified, sources, params, lookahead, depth)` \
follows the header chain's `VerifiedChain`, fetches every block by hash from any source and \
checks it against its verified header (hash, coinbase height, merkle root, CVE-2012-2459), folds \
each block joining the verified best through every enabled index in dependency order, sends every \
final block once on each index's final stream (`subscribe(kind, committed, queue)`), and keeps a \
node until every index holds it durably (side nodes: while the header chain `holds` them). \
`run(cancel)` stops on `NfsError::{Diverged, Fold, ChainGone, WriterGone}`. \
`NfsHandle::snapshot()` returns a `Snapshot`: the served tip (the deepest folded best block, so a \
reorg moves it at once), its `VerifiedChain`, `ChainParams` and `Views` with a typed reader per \
enabled index; `changed()` awaits the next. A snapshot is republished per index commit too \
(`durable()` current), and `at(hash)` answers as of any folded block, side branches included \
(`At`, `Branch`), or the root; `Nfs::indexed()` = the same publications as a watch; `INDEXES` = \
every kind folded. Metrics and logs for the tip, reorgs and fetch progress (`describe_metrics`). \
Feature `testing`: `Snapshot::fixed`, `NfsHandle::{fixed, unpublished}`.
"""

[[changes]]
crate = "zaino-nfs"
kind = "breaking"
section = "changed"
description = """
Block bodies come from the traffic balancer: `Nfs::new(verified, balancer, params, lookahead, \
depth)` takes a `zaino_traffic::TrafficBalancer` (its driver spawned by the caller) instead of a \
list of sources. Each wanted height is one `block(hash, Tip | Bulk)` (`Tip` above the final \
tip) until a body passes its check; a misanswer is `report`ed, benching its sender, and asked \
again; a want dropped aborts its fetch. The NFS's own source scheduling (least-loaded pick, \
60 s bench, 15 s hedge, 1 s retry) and its `Source misanswered a block` log are gone: \
`zaino-traffic` owns who answers, hedges, retries and benches (logging `Misanswer, member \
benched`).
"""
migration = """
Build one `zaino_traffic::TrafficBalancer` over the validators (`Trusted { source, priority, \
limits }`), spawn its `TrafficDriver::run`, and pass `balancer.clone()` where the source list \
went.
"""

[[changes]]
crate = "zaino-nfs"
kind = "breaking"
section = "removed"
description = """
`zaino_nfs::schema(kind, network)` is gone: each index's layers take their schema from its \
committed view (`View::schema`), and every fold fills the delta its parent layer opens.
"""
migration = """
Build a store's schema from the index crate: `Schema::new(kind, FORMAT, network, TABLES)`.
"""

[[changes]]
crate = "zaino-nfs"
kind = "breaking"
section = "changed"
description = """
The NFS publishes into the global snapshot instead of serving readers itself. `Snapshot` is \
renamed `Indexed` (read its served tip through `served()`, an `At`); `NfsHandle`, \
`Nfs::handle()` and the `tip()` / `params()` / `views()` shorthands are gone: readers load a \
`zaino_snapshot::Snapshot` and ask it `served()`. `subscribe_handed()` is replaced by \
`progress()` (`NfsProgress`: `handed()`, `blocks()`, atomics read at report time). \
`Nfs::new` drops its unread `depth`. The `zaino_best_tip` and `zaino_fetch_height` gauges and \
the `Syncing blocks` / `Block fetch stalled` lines moved out (`zaino-snapshot` sets the gauges \
at scrape; zainod's progress task logs the lines): this crate emits events only.
"""
migration = """
`Nfs::new(chain, balancer, params, lookahead)`; feed `nfs.indexed()` to \
`zaino_snapshot::Publisher::new` and read `snapshots.load().served()?`; `nfs.progress()` for \
the handed height; tests: `Indexed::fixed` (+ `zaino_snapshot::Snapshots::fixed`).
"""

[[changes]]
crate = "zaino-nfs"
kind = "fix"
section = "fixed"
description = """
An index enabled after the others synced (a fresh directory, or one left behind by a crash) no \
longer holds the served tip back for every index until it catches up (hours for tree-state on \
mainnet). It lags: out of folds and snapshots (`Views::syncing(kind)` = enabled, not served \
yet), fed by the final stream from its own durable tip, while the others keep folding and \
serving the tip; once its durable tip reaches theirs it joins, the nodes above are refolded \
with it, and its views appear. The root is now the lowest durable tip of the joined indexes \
(value-balance and compact-block join together). Final steps are delivered beside the NFS \
loop (at most `lookahead` undelivered), so a lagging index's full queue pauses only the \
stream, never the tip. A final block is never sent unfolded after a folded one (a parent \
pruned before its child folded could do it).
"""

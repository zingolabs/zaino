id = "01a1181e-51f4-7694-8eb6-3635f88d0c12"

[[changes]]
crate = "zaino-nfs"
kind = "feature"
description = """
First release. The tip overlay: `Nfs::new(chain, balancer, params, depth, lookahead)` follows \
the header chain's `VerifiedChain` and, while the lowest durable tip of its indexes \
(`add(kind, IndexHandle)`) is within `2 · depth` of best and the header above it is held (a \
chain anchored above it = the final path fetches the gap by height), folds every best-chain \
block above it \
in RAM, each through every index durable below it, in dependency order. It never writes and \
never sends to the writers (final blocks reach them through `zaino_sync::FinalFollower`). \
`indexed()` publishes one `Indexed` per served-tip or durable-tip move: `served()` (the deepest \
folded best block, else the lowest durable tip; a reorg moves it at once), `at(hash)` for any \
folded block (side branches included) or the root, `Views` with a typed reader per enabled \
index (`None` = disabled), `durable()`. `run(cancel)` stops on `NfsError::{Fold, ChainGone, \
IndexGone}`. Metrics and logs for the served tip and reorgs (`describe_metrics`). Feature \
`testing`: `Indexed::fixed`, `ChainParams::of`.
"""

[[changes]]
crate = "zaino-nfs"
kind = "feature"
section = "changed"
description = """
`At::answers_through(kind)`: the highest height an index answers through a snapshot block, its \
durable tip when past a best-branch block (final data), else the block.
"""

[[changes]]
crate = "zaino-nfs"
kind = "feature"
section = "added"
description = """
`Views::value_balance()` is public: the UTXO set at the served tip, which zainod reads for the \
chain view's peer quorum.
"""

[[changes]]
crate = "zaino-nfs"
kind = "feature"
section = "added"
description = """
`Indexed::served_nonfinalized()`: the full blocks the served tip extends above the root, served \
first (its own path, never side nodes). Feature `testing`: `Indexed::fixed_above(chain, root, \
&blocks, params, durable)` folds those blocks above a root, serving the last.
"""

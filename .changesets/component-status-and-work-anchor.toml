[[changes]]
crate = "zaino-chain-store"
kind = "breaking"
description = """
`ChainStoreService` and `ChainStoreReader` report health through \
`zaino_component::StatusSource` rather than a `status` method of their own, so \
a store is a component a supervisor can observe alongside every other \
subsystem without knowing it is a store. Two axes rather than one: a lifecycle \
phase the runtime moves, and a health condition that never overwrites it."""
migration = """
Remove `fn status(&self) -> StatusType` from both impls and add a single \
`impl StatusSource`, returning a `ComponentStatus` built from a \
`ComponentName`, a `Lifecycle` and a `Health`. Where a type is its own reader, \
one impl serves both ports. Callers reading a status through a bare \
`.status()` may need `StatusSource::status(&x)` if an inherent method of the \
same name still shadows the trait."""

[[changes]]
crate = "zaino-chain-store-zainodb"
kind = "breaking"
description = """
The backend reports a `ComponentStatus`, and names itself: `FinalisedState` \
carries a `ComponentName` set at construction, with `FinalisedState::COMPONENT` \
as the default. The name belongs to the component because a deployment running \
two stores wants two names, and a supervisor needs to know which one \
escalated."""
migration = """
`ChainStoreService::status` and `ChainStoreReader::status` now come from \
`StatusSource` and answer `ComponentStatus`. The fused `StatusType` is still \
tracked internally and converted at the port; a caller matching on \
`StatusType` reads `.lifecycle` and `.health` instead."""

[[changes]]
crate = "zaino-chain-head"
kind = "breaking"
description = """
`ChainHeadSnapshot::work_anchor` names the block `ChainHeadWork` is counted \
from: the parent of the window floor, so a block's work sums block work over \
`(anchor, B]` and a consumer can rebase it onto absolute chainwork."""
migration = """
Implementors of `ChainHeadSnapshot` must add `work_anchor`, returning the \
parent of the lowest block their graph accumulates from, or `None` when that \
block is genesis."""

[[changes]]
crate = "zaino-chain-head"
kind = "breaking"
description = """
Transparent-history effects are keyed by `TransparentAddressKey` rather than by \
the wallet-facing string, which is network-specific and cannot name a \
non-standard output. Still declared, not implemented."""
migration = """
Behind the non-default `transparent_address_history_experimental` feature. \
`TransparentHistoryQuery::addresses`, `LocatedTransparentOutput::address` and \
`LocatedTransparentSpend::address` are now \
`zaino_primitives::types::TransparentAddressKey`. Build one with \
`TransparentAddressKey::from_script`, which shares `classify_script` with the \
finalised store's indexing so the two halves of an address's history cannot \
key differently."""

[[changes]]
crate = "zaino-chain-head-service"
kind = "breaking"
description = """
Both concrete handles report through `zaino_component::StatusSource` rather \
than `zaino_status::Status`, and answer a `ComponentStatus`."""
migration = """
`ChainHeadService::status` and `ChainHeadSubscriber::status` return \
`ComponentStatus` instead of `StatusType`; read `.lifecycle` and `.health` \
where a `StatusType` was matched. The trait to import is `StatusSource`. The \
runtime still folds a tick outcome into one fused value internally and splits \
it at the reporting boundary, so no transition changes."""

[[changes]]
crate = "zaino-chain-head-service"
kind = "feature"
description = """
The map-backed snapshot records its work anchor, and keeps it across pruning \
and re-anchoring of the retention floor."""

[[changes]]
crate = "zaino-sync"
kind = "fix"
section = "Fixed"
description = """
The producer fetches blocks by height only from the validators agreeing on the \
quorum tip. A lagging validator could serve a stale branch at a height the new \
tip had made final: bulk sync then either stopped on `ProduceError::Unlinked` \
or published the stale block as final, and every index committed it.
"""

[[changes]]
crate = "zaino-source"
kind = "feature"
section = "Added"
description = """
`BlockFetchPool::among(positions)`: the pool over only the sources at \
`positions`. A `Primary` among them stays primary; otherwise it falls to \
`Spread`.
"""

[[changes]]
crate = "zaino-chainview"
kind = "feature"
section = "Added"
description = """
`EndpointSet::positions()` and `EndpointSet::at(positions)`: a set as, and \
from, positions in the configured endpoint list.
"""

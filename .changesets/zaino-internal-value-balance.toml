id = "01a1181e-53cb-70aa-b412-38e0665ee8c9"

[[changes]]
crate = "zaino-internal-value-balance"
kind = "feature"
description = """
First release. The value-balance index: every transparent output's value in one insert-only map \
`outputs` (`OutPoint` → zatoshis, `schema(network)`). `fold(parent, block)` resolves each \
transaction's `Fee` (transparent in − out plus the Sprout, Sapling, Orchard and Ironwood value \
balances) with one batched prevout lookup per run, read through `ValueBalanceReader`; a negative \
fee on a non-coinbase transaction is consensus-invalid (`FoldError`). \
`ValueBalanceIndexWriter::new(store)` follows the final stream and publishes `BlockFees` into a \
`zaino_sync::FeeSink` for the compact-block index (one per step, held heights re-priced).
"""

[[changes]]
crate = "zaino-internal-value-balance"
kind = "breaking"
section = "changed"
description = """
`fold(parent, block, out: &mut BlockChanges) -> Result<BlockFees, FoldError>` appends the block's \
output rows to a caller-opened delta (asserting it is the block's and the block extends the \
parent) and returns its fees; it moved into `writer.rs`. New `fees(parent, blocks)`: a run's fees \
alone, no rows, against any state at or past its parent (held heights). `schema(network)` is \
replaced by `FORMAT` + `TABLES`; `ValueBalanceReader::new(view)` takes no network; \
`ValueBalanceIndexWriter::run`'s fee sink parameter is named `sink`.
"""
migration = """
Open the delta with `store.changes(block.at())` (or a layer's) and keep the returned fees; price \
a block the parent already holds with `fees`; open the store with \
`Schema::new(IndexKind::ValueBalance, FORMAT, network, TABLES)`.
"""

[[changes]]
crate = "zaino-internal-value-balance"
kind = "feature"
description = """
`WRITE_BUFFER`: this index's buffered heap before a bulk commit (the `write_buffer` `zainod` \
opens its store with).
"""

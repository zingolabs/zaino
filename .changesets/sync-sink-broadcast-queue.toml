[[changes]]
crate = "zaino-sync"
kind = "feature"
section = "Added"
description = """
`IndexerDataSink<T>` is a byte-bounded broadcast queue that decides nothing: \
`default()`, `subscribe(name, budget) -> Subscription<T>`, `send(step)` (the \
same step to every queue, in order) and `shutdown()` (`Step::Shutdown` last in \
every queue, never waits on a full one). A queue dropped before `Shutdown` \
panics the sink; a sink dropped without `shutdown()` panics its subscribers.
"""

[[changes]]
crate = "zaino-sync"
kind = "feature"
section = "Added"
description = """
The `Producer` decides every step: `Producer::new(sink, pool, tips, depth, \
durable)` takes every subscriber's durable tip, starts after the rearmost, \
keeps the final tip at highest tip − depth (never lowered, at least the \
furthest durable), and sends `Apply { finalized }`, `Finalized`, `Reset` and \
`Shutdown`. The chain tip is not a step. Heights and tips are \
`Option<Height>`: the last height, inclusive, `None` = nothing held.
"""

[[changes]]
crate = "zaino-sync"
kind = "feature"
section = "Added"
description = """
`IndexWriter::finalized_tip()` returns the last durable block \
(`Option<BlockRef>`), and `finalized_height()` is provided from it; \
`applied_height()` returns the last applied height (`Option<Height>`). \
`IndexFollower::new(writer, feed, tips, batch_bytes, depth)` follows a `Feed` \
(a `Subscription`, or a `Zip` of two) and reads the chain tip off chainview's \
quorum tip (`tips`) for its serving gate and its commit cadence; a tip that \
moves with no block behind it closes the gate once the index is more than \
`depth` behind. `run(shutdown)` takes the pipeline's \
`CancellationToken`: a failed follower cancels it, pops its feed through \
`Shutdown`, then returns its error. A `Derives` writer (`derive(&blocks)`, one \
item per delivered block) republishes every step it follows into another \
sink through `IndexFollower::publishing(sink)`; `Zip::new(upstream, derived)` \
reads the two in lockstep, asserting each step matches, and yields \
`Paired { upstream, derived }` (`BlockWithFees` for blocks and their \
fees).
"""

[[changes]]
crate = "zainod"
kind = "feature"
section = "Changed"
description = """
zainod exits with the failing index's own error: a failed index cancels the \
pipeline, and every other task stops cleanly behind it. An error raised while \
stopping after a shutdown signal also fails the exit.
"""

description = "Built against zebra-chain 14 and the zebra 7.0.0-rc.0 librustzcash line."
migration   = "Upgrade `zebra-chain` to 14 and the `zcash_*` crates to the same versions."

[[changes]]
crate       = "zaino-source-zebra-rpc"
kind        = "feature"
description = "Answers `getstandardfee` by calling the validator and parsing zebrad's response."

[[changes]]

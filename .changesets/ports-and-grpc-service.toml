[[changes]]
crate = "zaino-source"
kind = "breaking"
section = "Changed"
description = """
One port per trusted validator: `ChainDataSource` (`get_block`, `get_block_by_hash`, \
`get_block_links`, `get_poll_reading`, `get_raw_mempool_transactions`, `get_transaction`, \
`send_raw_transaction`) replaces the eight per-question traits (`GetBlock`, `GetBlockByHash`, \
`GetBlockLinks`, `GetBlockchainInfo`, `GetPollReading`, `GetRawMempoolTransactions`, \
`GetTransaction`, `SendRawTransaction`). `get_blockchain_info` is gone: a poll reading carries the \
same `BlockchainInfo`. `Balanced` is renamed `TrafficBalancer` and is no longer a source itself: \
its one operation, `failover(|validator| read)`, asks the validators cheapest first until one \
answers (transient failures retried on the same validator), and `BlockFetchPool` reads through it. \
`mock::fixture_block` / `mock::fixture_transactions` expose the captured mainnet blocks to other \
crates' tests (feature `testing`).
"""
migration = """
Implement `ChainDataSource` where you implemented the per-question traits (a test fake answers \
what its test asks and `unimplemented!()`s the rest), and bound on `S: ChainDataSource`. Replace \
`Balanced::new` with `TrafficBalancer::new` and its forwarded reads with \
`validators.failover(|v| async move { v.get_transaction(txid).await })`. Read the upgrade \
schedule from `get_poll_reading(false).info`.
"""

[[changes]]
crate = "zaino-chainview"
kind = "breaking"
section = "Changed"
description = """
Peers join the view through `ValidatorP2pSource` (`heard`, `live`, `entries`, `push`) given by \
`ChainView::with_peers`; spawn `ChainView::peer_watch()`. Announcements fold into each sighting's \
`Spread::peers` (`peers: x/y`, live announcers of live peers); one the view does not hold yet \
waits in a bounded overheard set (2,000 per peer, 60 s). With peers, a submission's entries are \
peers first, one netgroup per attempt, then one trusted validator's `sendrawtransaction` as the \
verdict. `EndpointSource` is gone (bound on `zaino_source::ChainDataSource`), and \
`BroadcastError` is renamed `SubmitError`. A submission accepted and seen spread in one \
observation now always answers the wallet (it could end without answering), and the ended \
outcome is classified against the entries actually tried.
"""
migration = """
Bound on `S: ChainDataSource` for `EndpointSource`, and match `SubmitError` for `BroadcastError`.
"""

[[changes]]
crate = "zaino-grpc"
kind = "breaking"
section = "Changed"
description = """
One `GrpcService<S>` serves every `CompactTxStreamer` method, dispatched by path over `Routes` (the \
chain view, the validators' `TrafficBalancer`, the network, the compact-block index, and each \
optional index). It replaces `GrpcServer`, `Router`, the tonic-generated fallback service, \
`ValidatorHandler`, `ChainViewHandles` and the `Relay`, `FetchRawTransaction`, `ProjectCompact` \
and `ValidatorPorts` traits. A disabled index's methods answer `UNIMPLEMENTED` naming the index; \
an unknown path answers `UNIMPLEMENTED`. `SendTransaction` has one path, the chain view's \
submission. `GetMempoolTx` projects each transaction itself (`decode_transaction` + \
`compact_tx`, parsed once).
"""
migration = """
Build `Routes { chain, validators, network, compact_block, block_hash, tree_state, \
transparent_address }` and pass it to `GrpcService::new(routes, bind, limits)` in place of \
`GrpcServer::new(ValidatorHandler::new(..), ..)` and its `with_*` index calls; `bind()` now \
returns `BoundGrpcService`.
"""

[[changes]]
crate = "zainod"
kind = "feature"
section = "Added"
description = """
`[p2p]` (off by default): `enabled`, `peer_target` (16), `initial_peers` (empty = the network's DNS \
seeders) and `cache_dir`. On, zainod joins the Zcash p2p network through zaino-peers in the \
background (boot never waits on it): peers' announcements become `peers: x/y` per transaction, \
and each `SendTransaction` attempt goes to a random peer before one trusted validator's verdict. \
Regtest with `p2p.enabled` and no `initial_peers` is refused (regtest has no seeders).
"""

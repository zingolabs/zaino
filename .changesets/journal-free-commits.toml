[[changes]]
crate = "zaino-persistence"
kind = "breaking"
section = "Changed"
description = """
`MANIFEST` is two fixed slots, and `IndexDir::commit(&mut self)` writes each \
commit over the slot the previous one did not use, then `fdatasync`s: no \
staged file, no rename, no directory sync. An in-place overwrite changes no \
metadata, so a commit never waits on the filesystem journal (and through it on \
every other file's writeback). A slot failing its CRC reads as a torn commit \
and the other slot stands. `MANIFEST` is created whole (zeroed under \
`MANIFEST.creating`, renamed in); `ManifestError::{Layout, Sequence}` are new, \
`ManifestError::Short` is gone.
"""

[[changes]]
crate = "zaino-persistence"
kind = "breaking"
section = "Changed"
description = """
`PagedFile::open` takes a `FileKind`: `Segment` for a file written once and \
sealed, `Log` for one appended to commit after commit. A `Log` is linked \
durably when `open` creates it, and grows into a \
reserve of zeros written and fsynced ahead of its appends, so a seal's \
`fdatasync` finds no size change and never commits the journal.
"""

[[changes]]
crate = "zaino-persistence"
kind = "feature"
section = "Changed"
description = """
`Snapshot::get_many` prefetches a batch of 64 or more keys on a filtered set \
(`MADV_WILLNEED` over every candidate segment's fence groups, then its record \
blocks), so a cold batch queues all its reads at once instead of one per rayon \
thread. `Pages::will_need` clips its range to the sealed bytes.
"""

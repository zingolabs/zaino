id = "01a1181e-5384-7686-89b2-1321c6eb5d9b"

[[changes]]
crate = "zaino-internal-block-hash-to-height"
kind = "feature"
description = """
First release. The block hash → height index every by-hash request resolves through: one map \
`by_hash` (`schema(network)`), one row per block (`fold`), read with \
`BlockHashReader::height_of` over any view. `BlockHashIndexWriter::new(store, batch_bytes)` \
follows the final stream.
"""

[[changes]]
crate = "zaino-internal-block-hash-to-height"
kind = "breaking"
section = "changed"
description = """
`fold(parent: &BlockHashReader<V>, block, out: &mut Changes)` appends to a caller-opened delta \
(asserting it is the block's and the block extends the parent), replacing \
`fold(block, network) -> Changes`; it moved into `writer.rs`. `schema(network)` is replaced by \
`FORMAT` + `TABLES`.
"""
migration = """
Fold onto a `BlockHashReader` of the parent into `store.changes(block.at())` (or a layer's); \
open the store with `Schema::new(IndexKind::BlockHash, FORMAT, network, TABLES)`.
"""

[[changes]]
crate = "zaino-internal-block-hash-to-height"
kind = "feature"
description = """
`WRITE_BUFFER`: this index's buffered heap before a bulk commit (what `zainod` hands its writer).
"""

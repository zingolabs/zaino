[[changes]]
crate = "zaino-index-compact-block"
kind = "breaking"
section = "Changed"
description = """
`CompactTx.fee` is filled: every mined transaction's fee, from the value-balance \
index. The writer's input is `BlockWithFees` (each block with its fees, read in \
lockstep off the block and value-balance streams by a `Zip` feed); \
`encode_compact_block(block, fees, sizes)` and `compact_tx(index, tx, fee)` \
take the fees. A coinbase, or a fee of 2^32 zatoshis or more, writes 0 \
(`uint32`, not provided). `testing::block` also returns the block's fees.
"""

[[changes]]
crate = "zaino-internal-value-balance"
kind = "feature"
section = "Added"
description = """
New value-balance index: every transparent output's value, append-only \
(`outputs/` segments, `txid ‖ vout → value`). `ValueBalanceIndexWriter` \
resolves each transaction's fee (transparent in − out plus the Sprout, \
Sapling, Orchard and Ironwood value balances; protocol §3.4) into one \
`BlockFees` per block (`Derives`), which its follower republishes into a \
`FeeSink` step for step. A negative fee on a non-coinbase transaction is \
consensus-invalid and stops the index (`IndexWriterError::NegativeFee`). \
`committed_files(dir, network)` lists the sealed segments.
"""

[[changes]]
crate = "zaino-primitives"
kind = "breaking"
section = "Added"
description = """
`Transaction::sprout` (`SproutData { value_balance }`) and \
`TransparentData::coinbase`. `Fee` (`Coinbase`, or `Paid(Zatoshis)`) and \
`BlockFees { height, hash, fees }`.
"""

[[changes]]
crate = "zaino-source"
kind = "breaking"
section = "Changed"
description = """
Decoding reads each transaction's Sprout JoinSplit value balance and whether \
it is the coinbase. `GetMempoolTxids` is replaced by `GetMempoolListing` \
(`getrawmempool true`), which returns `MempoolListed { txid, fee }`, the fee \
the validator computed admitting the transaction (parsed from ZEC to exact \
zatoshis).
"""

[[changes]]
crate = "zaino-sync"
kind = "breaking"
section = "Changed"
description = """
Every subscriber is fed from after the rearmost durable tip, so an index ahead \
of others sees blocks it already holds. New `IndexWriter::deliver(blocks)` runs \
for every delivered block before it is staged or applied (default: nothing, \
which is how an index skips what it holds). The follower checks that a block \
replayed at its durable tip is the one it committed (`FollowError::Diverged`). \
`Subscription::from` is removed. New `FeeSink` and `BlockWithFees`.
"""

[[changes]]
crate = "zaino-chainview"
kind = "breaking"
section = "Changed"
description = """
`MempoolEntry` carries `fee: Option<Zatoshis>`, from the validators' listings \
(`None` = our own broadcast, not yet listed by any validator). The endpoint \
source requires `GetMempoolListing` in place of `GetMempoolTxids`.
"""

[[changes]]
crate = "zainod"
kind = "breaking"
section = "Added"
description = """
`[index.value_balance]` (`<data>/value_balance`) stores every transparent \
output's value so `CompactTx.fee` is filled; it cannot be disabled, and \
`zainod verify` scrubs it. Mempool fees (`GetMempoolTx`) come from the \
validator's `getrawmempool true`.
"""

[[changes]]
crate = "zainod"
kind = "feature"
section = "Changed"
description = """
`GetLightdInfo` no longer calls a validator. It answers from the chain view's last poll of \
the validators agreeing on the quorum tip, plus the served height, so the most frequent \
wallet call costs microseconds instead of a validator round trip (fleet p50 was 0.55 s, p99 \
up to 4.9 s). Below quorum it answers `UNAVAILABLE`, like the mempool methods.
"""

[[changes]]
crate = "zaino-chainview"
kind = "breaking"
section = "Changed"
description = """
Each endpoint's whole `getblockchaininfo` is kept with its metadata, and \
`ChainViewSnapshot::validator_info()` returns the first quorum-tip agreer's copy \
(`Err(BelowQuorum)` below quorum). `EndpointSource` binds `GetBlockchainInfo` in place of \
the removed `GetMempoolSourceTip`.
"""
migration = """
An `EndpointSource` implements `zaino_source::GetBlockchainInfo` (typed \
`QueryError<Infallible>`) instead of `GetMempoolSourceTip`.
"""

[[changes]]
crate = "zaino-grpc"
kind = "breaking"
section = "Changed"
description = """
`ValidatorHandler::new` takes a `ChainViewSubscriber` (after `served`), and \
`ValidatorHandler::lightd_info` is synchronous: it renders from one pinned chain-view \
snapshot. `ValidatorPorts` drops `GetBlockchainInfo`.
"""
migration = """
Pass `view.subscriber()` to `ValidatorHandler::new`; drop the `.await` on `lightd_info()`.
"""

[[changes]]
crate = "zaino-source"
kind = "breaking"
section = "Removed"
description = """
`GetMempoolSourceTip` and `SourceTip` are gone: `GetBlockchainInfo` is the same question on \
the same call, now typed `QueryError<Infallible>` and documented as the tip a mempool listing \
is tagged with. `GetBlockchainInfoError` is gone (its `NotReady` was unproducible by any \
adapter). `MockChain::get_blockchain_info` answers its tip and hash (estimate = tip, empty \
schedule, branch 0) instead of `NotReady`.
"""
migration = """
Replace `get_mempool_source_tip()` with `get_blockchain_info()`, reading `best_block_hash`, \
`blocks` and `estimated_height`; drop matches on `GetBlockchainInfoError`.
"""

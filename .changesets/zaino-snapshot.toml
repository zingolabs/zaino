id = "01a1185c-86c7-719c-8b95-8e6e1016f9e4"

[[changes]]
crate = "zaino-snapshot"
kind = "feature"
section = "added"
description = """
First release. One published `Snapshot` of everything Zaino serves: `Tips` (best, final, served, \
the validators holding best, synced), the NFS's latest publish (`served()`, `at(hash)`), the \
chain view's latest (`mempool()`, `lightd()`, `view()`), the chain's `forks()` and a \
`GetMempoolStream` feed (`mempool_stream()`) whose epoch is keyed to the served tip, so a stream \
ends only once the new tip is servable. `Publisher` combines the two inputs into one atomic \
publication per change (`Snapshots::load`, never torn); `Unavailable` and `Unready` name each \
refusal. `Report::of` (the `/statusz` body) and `emit_gauges` (at scrape) derive from one \
snapshot (`describe_metrics`).
"""

[[changes]]
crate = "zaino-snapshot"
kind = "internal"
description = """
Tests fold the block-hash index through the new fold shape (store-opened deltas).
"""

[[changes]]
crate = "zaino-snapshot"
kind = "feature"
section = "added"
description = """
The snapshot is the one reporting source: `Report::of(snap, &SyncProgress, &MemberTable, \
enabled)` lists every foldable index as configured (`indexes(enabled, durable)` builds the same \
list before a snapshot exists) and joins \
each validator's facts with the traffic balancer's row (`state`, `latency_ms`, `failures`) and \
reports `finality_paused`; `emit_gauges(snap, &NfsProgress)` also sets every \
`zaino_chainview_*` state gauge at scrape; the publisher logs each chain view alarm's rise and \
clear (stale tip, end of service, partition, eclipse, finality paused). `Unready::label` = the \
`/readyz` text. Feature `testing`: `Snapshots::fixed(indexed, view)`.
"""

[[changes]]
crate = "zaino-snapshot"
kind = "breaking"
section = "changed"
description = """
`Snapshot::standing(now_unix)` (`Serving`, `Degraded(Down)`, `Syncing`, `Down(Down)`) replaces \
`unready()` / `Unready`: no trusted validator vouching (`Down::NoValidatorReachable`: every one \
down; `Down::TipNotHeld`) is `Degraded` while synced to a best whose block time is within 30 min \
of `now_unix` (peers carried the tip), else `Down`; `Syncing` also while every holder of best is \
catching up. `Snapshot::sync_target()` = best, or a catching-up validator's clock estimate when \
higher. `notes(&snap)` = one sentence per raised alarm. `Report` drops `unready`. \
`Snapshot::lightd()` returns `Lightd { served, best, schedule }` from the snapshot alone (no \
validator), so it answers while degraded.
"""
migration = """
`snap.unready()` → `snap.standing(now_unix)`; `Down::detail()` for the sentence; render \
`GetLightdInfo` from `Lightd` (branch and next upgrade from `schedule` at `served`).
"""

[[changes]]
crate = "zaino-snapshot"
kind = "feature"
description = """
`Snapshot::mempool()` and `mempool_stream()` also answer while a peer quorum reads the mempool \
(`ChainViewSnapshot::peers_quorate`) with no trusted validator holding the tip; G6 checks the \
gate against both.
"""

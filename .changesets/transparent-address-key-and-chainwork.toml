[[changes]]
crate = "zaino-primitives"
kind = "feature"
description = """
`types::TransparentAddressKey` — how an index keys a transparent output: a \
20-byte hash and the script form it came from. Shared vocabulary, because both \
halves of an address's history key by it and a consumer merging them must not \
have to translate. `from_script` shares `classify_script`, so a store indexing \
an output and a chain head reporting on one cannot classify it differently."""

[[changes]]
crate = "zaino-primitives"
kind = "feature"
description = """
`ChainWork::ZERO` and `ChainWork::checked_add`, so cumulative chainwork can be \
folded one block at a time without leaving the 256-bit type. `ZERO` is the \
value below genesis, which makes the fold a plain accumulation with no special \
first step. Addition is checked because a wrapped total would compare as the \
lightest chain rather than the heaviest — it would not fail, it would silently \
select wrong."""

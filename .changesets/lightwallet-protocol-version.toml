[[changes]]
crate = "zaino-proto"
kind = "feature"
section = "Added"
description = """
`LIGHTWALLET_PROTOCOL_VERSION`: the vendored lightwallet-protocol release (`v0.5.0`), read \
at build time from the newest `## [vX.Y.Z]` heading of `lightwallet-protocol/CHANGELOG.md`.
"""

[[changes]]
crate = "zaino-grpc"
kind = "fix"
section = "Fixed"
description = """
`GetLightdInfo` reports `lightwalletProtocolVersion` (`v0.5.0`) instead of an empty string. \
pepper-sync refuses to sync against a server below v0.5.0, so zingolib wallets could not \
sync against Zaino at all (zingolabs/zingolib#2874).
"""

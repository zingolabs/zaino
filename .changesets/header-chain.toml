[[changes]]
crate = "zaino-header-chain"
kind = "feature"
section = "Added"
description = """
New crate: the proof-of-work verified header chain. `decode_header` recomputes each hash from the \
bytes; `HeaderChain::insert` checks version, nBits, time against the median time past, the \
difficulty adjustment (zebra-state's port, matching zcashd at the genesis window), the 2-hour \
future bound, hash ≤ target and Equihash (200, 9), keeps every valid branch above the final tip, \
and publishes the most-work tip on a `watch`. `finalize` writes final headers to `HeaderStore` \
(56-byte records on `zaino-persistence`), from which `HeaderChain::open` resumes.
"""

[[changes]]
crate = "zaino-persistence"
kind = "feature"
section = "Added"
description = """
`IndexKind::HeaderChain`, the manifest identity of the header chain's store.
"""

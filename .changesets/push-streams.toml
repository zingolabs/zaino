[[changes]]
crate = "zainod"
kind = "feature"
section = "Added"
description = """
`[[trusted_validators]] indexer_address` names zebrad's indexer gRPC (`indexer_listen_addr`): its \
tip and mempool push streams wake the validator's poller at once, and polling slows to a 15 s \
reconcile while they are up. Unset, or while the streams are down, polling stays at one second. \
`/statusz` reports `streaming` per validator.
"""

[[changes]]
crate = "zaino-chainview"
kind = "feature"
section = "Added"
description = """
`EndpointPoller::waker()` returns a `PollWaker`: `wake()` polls now (coalesced, at least 200 ms \
between polls) and `streaming(up)` switches the cadence to a 15 s reconcile, polling at once on \
either edge. `ValidatorMetadata::streaming` and a `push_stream` gauge report it.
"""

[[changes]]
crate = "zaino-source"
kind = "feature"
section = "Added"
description = """
`IndexerWatch` subscribes to zebrad's `ChainTipChange` and `MempoolChange` streams and reports \
each event and each link edge through callbacks, reconnecting on a 500 ms → 30 s ladder.
"""

[[changes]]
crate = "zaino-proto"
kind = "feature"
section = "Added"
description = """
zebrad's indexer service (`zebra.indexer.rpc`, vendored from zebra v6.4.2): client and server.
"""

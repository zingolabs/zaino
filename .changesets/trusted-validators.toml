[[changes]]
crate = "zainod"
kind = "breaking"
section = "Changed"
description = """
Validators are one `[[trusted_validators]]` list, every entry equal: the tip is what a majority \
of them hold, one listing admits a mempool transaction, and bulk sync spreads over all of \
them. A validator down at boot or later is retried every 30 s and never stops zainod; its vote \
and mempool sightings are withdrawn while it is down and restored by its first answer. Boot \
waits on no validator except to read the upgrade schedule (tree-state activations), which it \
asks of each trusted validator in turn until one answers.
"""
migration = """
Replace `[source]` and every `[[chainview_peers]]` with `[[trusted_validators]]` entries of the \
same shape; remove `fetch.primary_validator`. The old keys are refused at load.
"""

[[changes]]
crate = "zaino-chainview"
kind = "breaking"
section = "Changed"
description = """
A mempool transaction is servable once any validator lists it (or it is ours), not a majority: \
each admits only what it fully validated. `EndpointPoller::run` returns `()` and ends only on \
cancel: a validator past the failure ceiling, or without a mempool, is `Down` and retried every \
30 s, and its first answer back re-reports its whole listing. `EndpointPollError` is no longer \
public.
"""
migration = """
Spawn `poller.run(cancel)` without handling an error. Expect a transaction listed by one \
validator to be served.
"""

[[changes]]
crate = "zaino-source"
kind = "breaking"
section = "Changed"
description = """
`ZebraRpcAdapter::at` builds an adapter from config without probing the validator; \
`ZebraRpcAdapter::connect` (which waited for an answer) and `ProbeError` are replaced by it and \
`EndpointError` (a bad address, an unreadable cookie, a client that cannot be built). \
`BlockFetchPool::new` takes no route: `FetchRoute` is removed, heights always spread over every \
validator.
"""
migration = """
Call `ZebraRpcAdapter::at(..)` (not async) and handle `EndpointError`; drop the `FetchRoute` \
argument to `BlockFetchPool::new`.
"""

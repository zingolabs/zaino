id = "01a1181e-517d-72c1-bff2-6fbacf2afe5d"

[[changes]]
crate = "zaino-header-chain"
kind = "feature"
description = """
First release. The Validated Header tree, in memory: `HeaderChain::new(depth)` then \
`anchor(header, height)` (a trusted validator's header at its tip − depth = the final tip; no \
history from genesis, no store); `insert(header)` attaches a trusted header on its parent link \
and nBits work alone (its validator ran the consensus rules), keeps a bounded tree of branches above the final \
boundary and tracks the most-work tip; `vouch(block)` records a trusted validator's best chain \
had it, `finalizable()` = min(highest vouched, best − depth), `finalize` keeps the newest \
2 · depth final headers. `VerifiedChain` is an immutable snapshot (`best`, `final_tip`, \
`hash_at`, `header_at`, `on_best`, `holds`, `locator`, `forks`, `branch`); at or below the \
final tip past the headers kept = final by definition. `validate(params, header, height, \
ancestors, now)` keeps every consensus rule (Equihash (200, 9), hash ≤ target, difficulty \
adjustment with ZIP 218's window, median time past, 2-hour future bound) as a pure fallback for \
an untrusted source. Feature `testing`: `HeaderViews` on a `MockChain` (anchored at genesis).
"""

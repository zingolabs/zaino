[[changes]]
crate = "zainod"
kind = "breaking"
section = "Changed"
description = """
Logs: each index reports `durable` / `merged` / `applied` heights and one \
`size` (3 significant figures, decimal units) in aligned columns: `Syncing` \
every 30 s in bulk sync, `Committed bulk` at the handoff to the tip, \
`Serving` when it opens. `Index on disk`, `Serving index` and per-subdirectory \
sizes are gone; `Opening from` is debug. `Syncing blocks` drops `synced` and \
`tps`; `Applying to tip` reports the non-final window replay after the bulk pass.
"""

[[changes]]
crate = "zaino-grpc"
kind = "breaking"
section = "Changed"
description = """
`Serving requests` is now `Serving`: `rps`, `p99`, `out` (3 significant \
figures, decimal units) and `conns` held (problem counts as before). `High \
load` (warn) replaces it while any cap is past 25% held, naming those caps as \
`used/max`.
"""

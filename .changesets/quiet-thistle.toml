description = "The chain head publishes its reorg horizon and reads the durable watermark through the finality seam. `ChainHeadService::anchor` (and the test-only `spawn_without_writer`) take a `zaino_finality::ReorgHorizon` in place of a `watch::Receiver<Option<Height>>`, and the local `RETENTION_MARGIN` constant is gone — the seam owns the retention overlap."

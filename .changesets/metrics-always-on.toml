[[changes]]
crate = "zainod"
kind = "breaking"
section = "Removed"
description = """
The `prometheus` feature is removed: metrics and the admin listener \
(`/metrics`, `/livez`) are always compiled in, and `metrics_endpoint` alone \
decides whether the listener runs. A build passing `--features prometheus` now \
fails; drop the flag. The Docker image's `CARGO_FEATURES` build argument is \
removed with it.
"""

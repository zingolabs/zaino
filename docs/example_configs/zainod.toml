# Zaino daemon configuration (example)
#
# Pairs with docs/example_configs/zebrad_config_3.1.0.toml (Testnet).
# Layered highest-priority-first: ZAINO_ env vars (`__` for nesting, e.g.
# ZAINO_INDEXER__BATCH_SIZE=500), then this file, then built-in defaults.
# Omitted keys take their defaults; `zainod generate-config` prints them all.

# Prometheus /metrics endpoint (requires the `prometheus` build feature).
# Omit to disable.
# metrics_endpoint = "127.0.0.1:9999"

# Zebra JSON-RPC endpoint: the only block source.
[source]
jsonrpc_address = "127.0.0.1:18231"
# Zebra auth cookie (when zebrad runs with enable_cookie_auth = true).
# cookie_path = "<PATH_TO_ZEBRA>/.cookie"
# Or basic auth:
# user = "xxxxxx"
# password = "xxxxxx"

# Finalised index store (LMDB).
[store]
path = "<ZAINO_STORE>"
# Maximum on-disk size in GiB, reserved at open.
map_size_gb = 16

# Wallet-facing lightwalletd-compatible gRPC (CompactTxStreamer, plaintext).
[serve]
grpc_listen_address = "127.0.0.1:8137"

# Index-build tuning (defaults shown).
[indexer]
# Blocks committed per atomic batch.
batch_size = 1000
# Blocks buffered between the fetcher and the sync engine.
channel_capacity = 256
# Depth below the tip left to the non-finalised window.
finalised_depth = 1000
# Block fetches kept in flight (must be >= 1).
concurrency = 16

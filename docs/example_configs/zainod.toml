# Zaino Configuration
#
# Generated with `zainod generate-config`
#
# Configuration sources are layered (highest priority first):
#   1. Environment variables (prefix: ZAINO_)
#   2. TOML configuration file
#   3. Built-in defaults
#
# For detailed documentation, see:
#   https://github.com/zingolabs/zaino

backend = 'fetch'
zebra_db_path = '/home/cupress/.cache/zebra'
network = 'Testnet'

[grpc_settings]
listen_address = '127.0.0.1:8137'

[validator_settings]
validator_grpc_listen_address = '127.0.0.1:18232'
validator_jsonrpc_listen_address = '127.0.0.1:18231'
validator_user = 'xxxxxx'
validator_password = 'xxxxxx'

[service]
timeout = 30
channel_size = 32
[storage.cache]
capacity = 10000
shard_power = 4

[storage.database]
path = '/home/cupress/.cache/zaino'
size = 384
# Heap budget (bytes) for one bulk-sync write batch — one durable LMDB commit.
# It bounds the buffered blocks; peak resident RAM per batch is ~2-3x this (the
# buffer plus its encoded write data and the pending overlay are live at once).
# The default 6442450944 (6 GiB) is marginally safe on a ~64 GiB host: with the
# ~20 GiB transparent UTXO cache resident, a 6 GiB budget peaks at ~48 GiB and
# leaves ~16 GiB for the OS and the sorted-insert sweep's page cache. Lower it on
# smaller-RAM hosts; raise it (and measure RSS) on larger ones for fewer commits.
sync_write_batch_bytes = 6442450944
# Open the finalised database with WRITE_MAP for a fast, operator-initiated bulk
# catch-up. Default false: serving opens durable copy-on-write. WRITE_MAP maps the
# DB read-write (faster bulk ingest), but the on-disk file becomes a writable mapping
# (a stray process write can corrupt it) and LMDB extends it toward `size` (384 GB),
# which SIGBUSes or exceeds quota on a small or quota'd disk. Enable only for a
# deliberate catch-up run on a host sized for it, then restart with it off to serve.
bulk_sync = false
# Run the full database verification sweeps (every block and index entry, by
# checksum) at startup. Off by default: the background validator and on-demand
# read checks verify stored data continuously; enable after suspected
# corruption (storage faults, external modification of the database files).
validate_on_start = false

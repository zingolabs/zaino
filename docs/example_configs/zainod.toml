# Zaino Configuration
#
# Generated with `zainod generate-config`
#
# Configuration sources are layered (highest priority first):
#   1. Environment variables (prefix: ZAINO_)
#   2. TOML configuration file
#   3. Built-in defaults
#
# For detailed documentation, see:
#   https://github.com/zingolabs/zaino

backend = 'fetch'
zebra_db_path = '/home/cupress/.cache/zebra'
network = 'Testnet'

# Run the finalised state in ephemeral/stateless mode. When true, Zaino opens no
# persistent finalised-state database and serves finalised reads directly from
# the backing validator via a stateless passthrough. Default: false.
ephemeral_finalised_state = false

[grpc_settings]
listen_address = '127.0.0.1:8137'

[validator_settings]
validator_grpc_listen_address = '127.0.0.1:18232'
validator_jsonrpc_listen_address = '127.0.0.1:18231'
validator_user = 'xxxxxx'
validator_password = 'xxxxxx'

[service]
timeout = 30
channel_size = 32
[storage.cache]
capacity = 10000
shard_power = 4

[storage.database]
path = '/home/cupress/.cache/zaino'
size = 128
# Approximate in-memory budget (in GiB) for the bulk-sync write batch. Also bounds the per-shard
# memory of the txout-set accumulator rebuild at chain tip (it auto-shards to fit). Lower this on
# memory-constrained hosts to bound peak sync/rebuild RAM. Defaults to 32.
sync_write_batch_size = 32
# Max wall-clock time (seconds) spent buffering a bulk-sync batch before flushing. Raise it to make
# sync less reactive but faster on large-RAM hosts where the memory budget is never reached first.
# Defaults to 300 (5 minutes).
sync_checkpoint_interval = 300

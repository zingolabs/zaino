# ===================================================================
# Developer-facing test front door: a single `makers test [SET]` task.
#
#   makers test                packages (the default)
#   makers test packages       packages/* production-crate tests (no validator)
#   makers test e2e            the e2e live partition (ztest / k8s)
#   makers test clientless     the clientless live partition (ztest / k8s)
#   makers test live           both live partitions (ztest / k8s)
#   makers test all            packages then live (everything)
#   makers test ironwood       the ironwood tests of every set
#
# `packages` (the root workspace `default-members`, no validator) runs via plain
# `cargo nextest run`. The live partitions live in the standalone live-tests/
# workspace and run on the ztest Kubernetes harness — the front door shells out
# to the `ztest run` CLI from the sibling checkout that live-tests/Cargo.toml
# already pins (../../ztest, relative to live-tests/), with live-tests/ as the
# working directory so `ztest run` locates that workspace. The live sets need a
# reachable cluster (KUBECONFIG / kube context) and image build/registry access;
# see docs/testing.md and the ztest docs. Extra args are forwarded to the
# underlying `cargo nextest run` / `ztest run`; e.g. add zcashd-backed package
# tests with `makers test packages --features zcashd_support` (docs/adr/0005).
# ===================================================================

[tasks.test]
# clear = true fully replaces cargo-make's built-in `test` task (which runs
# `cargo test`); without it our `script` would merge with the builtin `command`.
clear = true
description = "Run a test set: `makers test [packages|e2e|clientless|live|all|ironwood]` (default: packages)."
script_runner = "bash"
script = '''
set -uo pipefail

usage() {
  echo "usage: makers test [packages|e2e|clientless|live|all|ironwood] [-- extra args]" >&2
  echo "  packages (default) packages/* tests, no live validator" >&2
  echo "  e2e | clientless   that single live partition (ztest / k8s)" >&2
  echo "  live               both live partitions (ztest / k8s)" >&2
  echo "  all                packages then live (everything)" >&2
  echo "  ironwood           the ironwood tests of every set" >&2
}

# The live partitions run on the ztest harness. ztest is not installed into this
# repo; it lives in the sibling checkout that live-tests/Cargo.toml already pins
# (../../ztest relative to live-tests/). Run it with live-tests/ as cwd so
# `ztest run` locates the live-tests workspace; args are forwarded verbatim to
# the wrapped `cargo nextest run`.
ztest_run() {
  ( cd live-tests && cargo run -q --manifest-path ../../ztest/Cargo.toml --bin ztest -- run "$@" )
}

# A non-flag first arg selects the set and must be a known name; a flag first
# arg (or none) keeps the default `packages` and is forwarded downstream. So
# `makers test --features foo` runs packages with the flag, while a mistyped set
# name errors instead of silently running the default.
set="packages"
if [ "$#" -gt 0 ] && [ "${1#-}" = "$1" ]; then
  case "$1" in
    packages|e2e|clientless|live|all|ironwood) set="$1"; shift ;;
    *) echo "makers test: unknown set '$1'" >&2; usage; exit 2 ;;
  esac
fi

case "$set" in
  packages)   exec cargo nextest run "$@" ;;
  e2e)        ztest_run -p e2e "$@" ;;
  clientless) ztest_run -p clientless "$@" ;;
  live)       ztest_run -p clientless -p e2e "$@" ;;
  all)
    # Run every set even when an earlier one fails; the exit code reflects any
    # failure.
    rc=0
    cargo nextest run "$@" || rc=1
    ztest_run -p clientless -p e2e "$@" || rc=1
    exit "$rc" ;;
  ironwood)
    # The one definition of the ironwood selection: the two dedicated live test
    # binaries, plus every test whose name carries the pool's name (the
    # naming convention that keeps new ironwood tests inside this
    # net). The same expression serves both sets — a selector naming a binary a
    # set lacks simply matches nothing there. Run every set even if an earlier
    # one fails, as in `all`.
    ironwood_filter='binary(ironwood_activation) | binary(the_pub_testnet_ironwood_boundary) | test(ironwood)'
    rc=0
    cargo nextest run -E "$ironwood_filter" "$@" || rc=1
    ztest_run -p clientless -p e2e -E "$ironwood_filter" "$@" || rc=1
    exit "$rc" ;;
esac
'''

# -------------------------------------------------------------------

[tasks.verify-all]
description = "Exercise every Makefile.toml task for correctness (idempotent)"
script_runner = "bash"
script = 'source "./tools/scripts/verify-all.sh"'

# -------------------------------------------------------------------

# Verify the no-zcashd build compiles: `zcashd_support` is opt-in and being
# deprecated (docs/adr/0001, 0005), so the default --no-default-features build
# must stay green or it bit-rots. `--workspace` covers the production crates;
# the live-test suite is a separate standalone workspace under live-tests/ and
# is checked there on the ztest harness.
[tasks.check-no-zcashd-packages]
description = "cargo check --no-default-features across the whole workspace (zcashd_support off)"
command = "cargo"
args = ["check", "--workspace", "--all-targets", "--no-default-features"]

[tasks.check-zaino-proto-heavy]
description = "Guard: zaino-proto `heavy` must stay enabled under --no-default-features (else the no-zcashd test build silently loses zebra-state/zebra-chain/which)"
script_runner = "@rust"
script = { file = "tools/scripts/check-zaino-proto-heavy.rs" }

[tasks.check-no-zcashd]
description = "Verify the no-zcashd (--no-default-features) build compiles across the workspace, and that zaino-proto `heavy` survives it"
dependencies = [
  "check-zaino-proto-heavy",
  "check-no-zcashd-packages",
]

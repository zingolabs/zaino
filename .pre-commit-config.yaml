# - tools = nix devshell (pinned by flake.lock)
# - `pre-commit install` once
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      # per file, not `cargo fmt` (live-tests' path dep on ../ztest = no cargo metadata in CI)
      - id: rustfmt
        name: rustfmt
        language: system
        entry: rustfmt --check --edition 2021
        types: [rust]
      - id: cargo-deny
        name: cargo deny (deny.toml)
        language: system
        entry: cargo deny check bans
        files: (Cargo\.(toml|lock)|deny\.toml)$
        pass_filenames: false
      - id: code-dupes
        name: code-dupes (dupes.toml)
        language: system
        entry: code-dupes check
        types: [rust]
        pass_filenames: false
      - id: clippy
        name: cargo clippy
        language: system
        entry: >-
          cargo clippy --locked --workspace --all-targets --all-features --
          -D warnings
        pass_filenames: false
        stages: [pre-push]

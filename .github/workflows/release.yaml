# zainod images, on blessing's `zainod-X.Y.Z` provenance tag (image version = X.Y.Z)
name: Zaino Release

on:
  push:
    tags:
      - 'zainod-[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push the built image to DockerHub. Set false to verify build on a feature branch without publishing.'
        type: boolean
        default: true

jobs:
  docker:
    name: Docker image (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: default
            suffix: ''
            no_tls: false
          - variant: no-tls
            suffix: '-no-tls'
            no_tls: true
    env:
      PUSH_IMAGES: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Determine Rust version from rust-toolchain.toml
        run: |
          echo "RUST_VERSION=$(cargo run -q --manifest-path tools/workbench/Cargo.toml --bin get-rust-version)" >> "$GITHUB_ENV"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/zaino
            ${{ secrets.DOCKERHUB_USERNAME }}/zainod
          flavor: |
            suffix=${{ matrix.suffix }}
          tags: |
            type=match,pattern=zainod-(.*),group=1
            type=ref,event=branch
            type=sha,prefix=,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUSH_IMAGES }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NO_TLS=${{ matrix.no_tls }}
            RUST_VERSION=${{ env.RUST_VERSION }}
          cache-from: |
            type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/zainod:buildcache${{ matrix.suffix }}
            type=gha,scope=${{ matrix.variant }}
          cache-to: |
            type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/zainod:buildcache${{ matrix.suffix }},mode=max
            type=gha,scope=${{ matrix.variant }},mode=max

name: Publish dry-run

on:
  workflow_dispatch:
  push:
    branches:
      - 'rc/**'
      - stable
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  publish-dry-run:
    name: cargo publish --dry-run
    runs-on: ubuntu-latest
    # Blocking context (pushes to rc/** or stable, and PRs targeting them):
    # this job MUST pass. Advisory context (everything else): findings inform
    # but the run stays green. Keep this predicate the exact inverse of the
    # "Compute check mode" step below — job-level continue-on-error cannot
    # read step outputs, so the two encode the same rule twice.
    continue-on-error: >-
      ${{
        github.event_name == 'pull_request'
          && !startsWith(github.base_ref, 'rc/')
          && github.base_ref != 'stable'
        || github.event_name != 'pull_request'
          && !startsWith(github.ref_name, 'rc/')
          && github.ref_name != 'stable'
      }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # rust-toolchain.toml auto-installs the pinned toolchain on first cargo
      # invocation, so no explicit toolchain setup step is needed.

      - name: Compute check mode
        id: mode
        run: |
          # Inverse of the job's continue-on-error predicate above.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            target="${{ github.base_ref }}"
          else
            target="${{ github.ref_name }}"
          fi
          if [[ "$target" == rc/* || "$target" == stable ]]; then
            echo "mode=blocking" >> "$GITHUB_OUTPUT"
          else
            echo "mode=advisory" >> "$GITHUB_OUTPUT"
          fi

      # A publishable crate whose exact version is already on crates.io with
      # different content cannot be released without a bump. Advisory mode
      # warns (unbumped-but-changed is the normal bump-at-release state on
      # feature branches); blocking mode fails.
      - name: Check for version-reuse violations
        run: |
          cargo run --manifest-path tools/workbench/Cargo.toml \
            --bin check-published-versions -- --mode "${{ steps.mode.outputs.mode }}"

      # --workspace verifies the publishable set against a local overlay
      # registry, so sibling dependencies resolve to their in-workspace
      # versions — emulating a real dependency-ordered release. A per-crate
      # dry-run loop cannot do this: nothing is uploaded between iterations,
      # so dependents resolve siblings from crates.io and any cross-crate
      # change fails spuriously.
      - name: Dry-run publish (workspace overlay)
        run: |
          set -euo pipefail

          if ! cargo publish --workspace --dry-run 2>&1; then
            echo ""
            echo "============================================"
            echo "cargo publish --workspace --dry-run FAILED"
            echo "============================================"
            echo ""
            echo "The workspace does not publish cleanly as a set. Common causes:"
            echo "  - a [patch.crates-io] override pulling in unreleased upstream code"
            echo "  - a dependency on a git revision or path outside the workspace"
            echo "  - a crate that does not compile from its packaged form"
            exit 1
          fi

      - name: Annotate on failure (advisory context only)
        if: failure() && steps.mode.outputs.mode == 'advisory'
        run: |
          echo "::warning::publish dry-run failed — the workspace would not release cleanly. This must be resolved before the next release."

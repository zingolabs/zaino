name: Docker Image CI/CD

on:
  workflow_dispatch:
    inputs:
      push:
        description: 'Push the built image to DockerHub. Set false to verify a build on a feature branch without publishing.'
        type: boolean
        default: true
  push:
    branches:
      - '**'
    paths:
      - 'live-tests/test_environment/*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

    - name: Compute version-based image tag
      id: taggen
      run: |
        TAG=$(./tools/scripts/get-ci-image-tag.sh)
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"

    - name: Load version variables into job env
      id: versions
      run: |
        echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v7
      with:
        context: live-tests/test_environment
        file: live-tests/test_environment/Containerfile
        platforms: linux/amd64
        tags: |
          zingodevops/zaino-ci:latest
          zingodevops/zaino-ci:${{ steps.versions.outputs.sha_short }}
          zingodevops/zaino-ci:${{ steps.taggen.outputs.tag }}
        push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}

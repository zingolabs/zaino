name: CI - Nightly

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
  AWS_REGION: us-east-1
  CACHE_ENDPOINT: gh-cache-hl.minio-tenants.svc.cluster.local
  CACHE_PORT: 9000
  CACHE_BUCKET: gha-cache-bucket
  INSECURE_CACHE: true

jobs:
  pr-checks:
    uses: ./.github/workflows/ci.yml
    with:
      nextest-profile: ci

  compute-tag:
    uses: ./.github/workflows/compute-tag.yml

  check:
    name: Cargo Check
    runs-on: arc-sh-runners
    needs: compute-tag
    container:
      image: docker.io/zingodevops/zaino-ci:${{ needs.compute-tag.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v7

      - name: MinIO Cache (cargo + target)
        uses: tespkg/actions-cache@v1
        with:
          endpoint: ${{ env.CACHE_ENDPOINT }}
          port: ${{ env.CACHE_PORT }}
          bucket: ${{ env.CACHE_BUCKET }}
          insecure: ${{ env.INSECURE_CACHE }}
          key: cargo-deps-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-deps-
          path: |
            ~/.cargo
            target

      - name: Cargo Check
        run: |
          cargo check --all-features
          cargo check --tests --all-features

  fmt:
    name: Rustfmt
    runs-on: arc-sh-runners
    needs: compute-tag
    container:
      image: docker.io/zingodevops/zaino-ci:${{ needs.compute-tag.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v7

      - name: MinIO Cache (cargo + target)
        uses: tespkg/actions-cache@v1
        with:
          endpoint: ${{ env.CACHE_ENDPOINT }}
          port: ${{ env.CACHE_PORT }}
          bucket: ${{ env.CACHE_BUCKET }}
          insecure: ${{ env.INSECURE_CACHE }}
          key: cargo-deps-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-deps-
          path: |
            ~/.cargo
            target

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: arc-sh-runners
    needs: compute-tag
    container:
      image: docker.io/zingodevops/zaino-ci:${{ needs.compute-tag.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v7

      - name: MinIO Cache (cargo + target)
        uses: tespkg/actions-cache@v1
        with:
          endpoint: ${{ env.CACHE_ENDPOINT }}
          port: ${{ env.CACHE_PORT }}
          bucket: ${{ env.CACHE_BUCKET }}
          insecure: ${{ env.INSECURE_CACHE }}
          key: cargo-deps-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-deps-
          path: |
            ~/.cargo
            target

      - name: Run clippy
        run: cargo clippy --all-targets -- --deny warnings

  doc:
    name: Cargo Doc
    runs-on: arc-sh-runners
    needs: compute-tag
    container:
      image: docker.io/zingodevops/zaino-ci:${{ needs.compute-tag.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v7

      - name: MinIO Cache (cargo + target)
        uses: tespkg/actions-cache@v1
        with:
          endpoint: ${{ env.CACHE_ENDPOINT }}
          port: ${{ env.CACHE_PORT }}
          bucket: ${{ env.CACHE_BUCKET }}
          insecure: ${{ env.INSECURE_CACHE }}
          key: cargo-deps-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-deps-
          path: |
            ~/.cargo
            target

      - name: Check documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --document-private-items

  whitespace:
    name: Whitespace check
    runs-on: arc-sh-runners
    needs: compute-tag
    container:
      image: docker.io/zingodevops/zaino-ci:${{ needs.compute-tag.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Check trailing whitespace
        run: ./tools/scripts/trailing-whitespace.sh reject
        working-directory: .

  cargo-hack-check:
    name: Cargo Hack Check
    needs: compute-tag
    container:
      image: docker.io/zingodevops/zaino-ci:${{ needs.compute-tag.outputs.image-tag }}
    runs-on: arc-sh-runners
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: MinIO Cache (cargo + target)
        uses: tespkg/actions-cache@v1
        with:
          endpoint: ${{ env.CACHE_ENDPOINT }}
          port: ${{ env.CACHE_PORT }}
          bucket: ${{ env.CACHE_BUCKET }}
          insecure: ${{ env.INSECURE_CACHE }}
          key: cargo-deps-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-deps-
          path: |
            ~/.cargo
            target

      - name: Install protoc
        run: |
          if ! command -v protoc; then
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          fi

      - name: Run cargo-hack
        uses: zingolabs/infrastructure/.github/actions/cargo-hack@20485fed7a080e381130ed8120419dc81acae641
        with:
          hack-subcommand: check

  cargo-hack-build:
    name: Cargo Hack Build
    needs: compute-tag
    container:
      image: docker.io/zingodevops/zaino-ci:${{ needs.compute-tag.outputs.image-tag }}
    runs-on: arc-sh-runners
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: MinIO Cache (cargo + target)
        uses: tespkg/actions-cache@v1
        with:
          endpoint: ${{ env.CACHE_ENDPOINT }}
          port: ${{ env.CACHE_PORT }}
          bucket: ${{ env.CACHE_BUCKET }}
          insecure: ${{ env.INSECURE_CACHE }}
          key: cargo-deps-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-deps-
          path: |
            ~/.cargo
            target

      - name: Install protoc
        run: |
          if ! command -v protoc; then
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          fi

      - name: Run cargo-hack
        uses: zingolabs/infrastructure/.github/actions/cargo-hack@20485fed7a080e381130ed8120419dc81acae641
        with:
          hack-subcommand: build

  # This job is a REFERENCE publisher of the rc-gate's named signal. The rc-gate
  # flow point (rc-gate.yml) never names a suite; it only requires a `success`
  # check-run/commit-status whose context is `vars.RELMAN_RC_GATE_CHECK` (default
  # `rc-gate`) on the commit it is about to advance rc to. This job posts exactly
  # that status on the tested commit once every suite job above is green.
  #
  # CAVEAT: the suite jobs it `needs` run on self-hosted `arc-sh-runners`, of
  # which there are none at present. Until runners return (or `ztest` delegates
  # the suite to a cluster job that posts the same status directly), this job's
  # `needs` never complete and NO signal is produced — the gate just won't advance
  # without `force` (no false green). Swapping the producer is pure config: post
  # the same context from wherever the suite actually runs; this job is not
  # load-bearing. INERT until the pipeline is activated regardless.
  #
  # A GITHUB_TOKEN-posted commit status is fine here: rc-gate only READS it, so
  # no App identity is needed (unlike deployment_status, which must re-trigger a
  # workflow and therefore requires the App).
  publish-rc-gate-signal:
    name: Publish rc-gate signal
    if: vars.RELMAN_PIPELINE_ACTIVE == 'true'
    needs:
      - pr-checks
      - check
      - fmt
      - clippy
      - doc
      - whitespace
      - cargo-hack-check
      - cargo-hack-build
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Post the rc-gate status on the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          GATE: ${{ vars.RELMAN_RC_GATE_CHECK || 'rc-gate' }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # github.sha is the commit this nightly ran against — the exact commit
          # the suite jobs above tested. rc-gate reads dev HEAD; when the nightly
          # runs on dev (scheduled on the default branch, or dispatched with
          # ref=dev) these coincide. Landing the status on any other ref simply
          # means rc-gate won't find it and correctly refuses to advance.
          gh api "repos/${{ github.repository }}/statuses/${SHA}" -X POST \
            -f state=success \
            -f context="${GATE}" \
            -f description="CI - Nightly (rc-gate suite) green" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Posted '${GATE}'=success on ${SHA:0:9}."

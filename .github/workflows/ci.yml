name: CI

on:
  pull_request:
  push:
    branches: [dev]

# PR push supersedes its own run; every dev commit keeps its result
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# every run step inside the flake devshell (flake.lock pins all tools)
defaults:
  run:
    shell: nix develop -c bash --noprofile --norc -eo pipefail {0}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/devshell

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      # pre-push stage = every hook (stage-less hooks run in all stages)
      - run: pre-commit run --all-files --hook-stage pre-push

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/devshell

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      - run: cargo nextest run --locked --workspace --all-features --no-fail-fast

  features:
    name: Each feature compiles
    # dev only; each package ≤ 1 feature → --each-feature = --feature-powerset
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/devshell

      - uses: Swatinem/rust-cache@v2

      - run: cargo hack check --locked --workspace --each-feature --lib --bins --tests
        env:
          RUSTFLAGS: -D warnings

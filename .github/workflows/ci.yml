name: CI

on:
  pull_request:
  push:
    branches: [dev]

# PR push supersedes its own run; every dev commit keeps its result
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# No protoc in lint/test: zaino-proto build.rs uses the checked-in generated code; the `proto`
# job regenerates with protoc and fails on drift (a .proto edit without its .rs)

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tools/workbench

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-make,cargo-deny,cargo-nextest

      # Same task as the pre-push hook (shellcheck preinstalled on ubuntu-latest)
      - run: cargo make lint

  proto:
    name: Generated protos match their .proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      - run: sudo apt-get install -y protobuf-compiler

      - run: cargo check --locked -p zaino-proto

      - run: git diff --exit-code packages/zaino-proto/src/proto

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@nextest

      - run: cargo nextest run --locked --workspace --no-fail-fast

  features:
    name: Each feature compiles
    # dev only; each package ≤ 1 feature (`testing`) → --each-feature = --feature-powerset
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@cargo-hack

      - run: cargo hack check --locked --workspace --each-feature --lib --bins --tests
        env:
          RUSTFLAGS: -D warnings

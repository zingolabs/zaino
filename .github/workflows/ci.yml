name: CI

on:
  pull_request:
  push:
    branches: [dev]

# PR push supersedes its own run; every dev commit keeps its result
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# No protoc: zaino-proto & zebra-rpc build.rs fall back to checked-in generated code
# (protoc present = regenerate over tracked sources)

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tools/workbench

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-make,cargo-deny,cargo-nextest

      # Same task as the pre-push hook (shellcheck preinstalled on ubuntu-latest)
      - run: cargo make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@nextest

      - run: cargo nextest run --locked --workspace --no-fail-fast

      # Only crate the experimental umbrella reaches; clippy --all-features covers its compile
      - run: cargo nextest run --locked -p zaino-state --features experimental_features --no-fail-fast

  features:
    name: Each feature compiles
    # dev only (~77 checks); --feature-powerset = 412, over the 6h hosted-runner cap
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@cargo-hack

      - run: cargo hack check --locked --workspace --each-feature --lib --bins --tests
        env:
          RUSTFLAGS: -D warnings

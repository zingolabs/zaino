name: CI

on:
  pull_request:
  push:
    branches: [dev]

# PR push supersedes its own run; every dev commit keeps its result
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# every run step inside the flake devshell (flake.lock pins all tools)
defaults:
  run:
    shell: nix develop -c bash --noprofile --norc -eo pipefail {0}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/devshell

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            live-tests
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      # pre-push stage = every hook (stage-less hooks run in all stages)
      - run: pre-commit run --all-files --hook-stage pre-push

  unit-test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/devshell

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      - run: cargo nextest run --locked --workspace --no-fail-fast

      # Only crate the experimental umbrella reaches; clippy --all-features covers its compile
      - run: cargo nextest run --locked -p zaino-state --features experimental_features --no-fail-fast

  features:
    name: Each feature compiles
    # dev only (~77 checks); --feature-powerset = 412, over the 6h hosted-runner cap
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/devshell

      - uses: Swatinem/rust-cache@v2

      - run: cargo hack check --locked --workspace --each-feature --lib --bins --tests
        env:
          RUSTFLAGS: -D warnings

  integration:
    name: Integration
    needs: [lint, unit-test]
    # forks: read-only token → no OIDC → no tailnet
    if: github.event.pull_request.head.repo.full_name == github.repository
    # OIDC subject must be `…:environment:ztest-cluster` (without it: `…:pull_request` → 403)
    environment: ztest-cluster
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/devshell

      # CLI must match the library (`cluster check` compares role hashes)
      - run: cargo install ztest_cli --locked --version "$(awk -F'"' '/^name = "ztest"$/ { getline; print $2 }' live-tests/Cargo.lock)"

      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_OIDC_AUDIENCE }}
          tags: tag:ztest-runner

      - run: tailscale configure kubeconfig tailscale-operator

      - run: >
          ztest cluster add zingo-infra --kube-context "$(kubectl config current-context)"
          --extra-config '${{ vars.ZTEST_CLUSTER_CONFIG_URL }}' --set-default --yes

      - run: ztest cluster check

      - run: ztest run
        working-directory: live-tests

      # no janitor on zingo-infra; by run id (untargeted reaps peers)
      - if: always()
        continue-on-error: true
        run: ztest cleanup --force '${{ github.run_id }}'

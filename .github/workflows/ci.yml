name: CI checks

on:
  workflow_dispatch:
  push:
    tags:
      - '**'
  pull_request:

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
  AWS_REGION: us-east-1
  CACHE_ENDPOINT: gh-cache-hl.minio-tenants.svc.cluster.local
  CACHE_PORT: 9000
  CACHE_BUCKET: gha-cache-bucket
  INSECURE_CACHE: true

jobs:
  compute-tag:
    name: Compute Docker Image Tag
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.taggen.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute version-based image tag
        id: taggen
        run: |
          source .env.testing-artifacts
          export RUST_VERSION ZCASH_VERSION ZEBRA_VERSION
          TAG=$(./utils/get-ci-image-tag.sh)
          echo "TAG= $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-test-artifacts:
    name: Build test artifacts
    needs: compute-tag
    container:
      image: zingodevops/zaino-ci:${{ needs.compute-tag.outputs.image-tag }}
    runs-on: arc-sh-runners
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore cargo dependencies
        id: restore-cargo
        uses: tespkg/actions-cache/restore@v1
        with:
          endpoint: ${{ env.CACHE_ENDPOINT }}
          port: ${{ env.CACHE_PORT }}
          bucket: ${{ env.CACHE_BUCKET }}
          insecure: ${{ env.INSECURE_CACHE }}
          key: cargo-deps-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-deps-
          path: |
            ~/.cargo
            target/debug/deps

      - name: Build and archive tests
        run: cargo nextest archive --verbose --workspace --all-features --archive-file nextest-archive.tar.zst

      - name: Save cargo dependencies
        if: steps.restore-cargo.outputs.cache-hit != 'true'
        uses: tespkg/actions-cache/save@v1
        with:
          endpoint: ${{ env.CACHE_ENDPOINT }}
          port: ${{ env.CACHE_PORT }}
          bucket: ${{ env.CACHE_BUCKET }}
          insecure: ${{ env.INSECURE_CACHE }}
          key: cargo-deps-${{ hashFiles('**/Cargo.lock') }}
          path: |
            ~/.cargo
            target/debug/deps

      - name: Save nextest archive to S3
        uses: tespkg/actions-cache/save@v1
        with:
          endpoint: ${{ env.CACHE_ENDPOINT }}
          port: ${{ env.CACHE_PORT }}
          bucket: ${{ env.CACHE_BUCKET }}
          insecure: ${{ env.INSECURE_CACHE }}
          key: nextest-archive-${{ github.sha }}
          path: nextest-archive.tar.zst

  check:
    name: Cargo Check
    runs-on: arc-sh-runners
    needs: compute-tag
    if: false  # Temporarily disabled for faster CI iteration
    container:
      image: zingodevops/zaino-ci:${{ needs.compute-tag.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v4

      - name: MinIO Cache (cargo + target)
        uses: tespkg/actions-cache@v1
        with:
          endpoint: ${{ env.CACHE_ENDPOINT }}
          port: ${{ env.CACHE_PORT }}
          bucket: ${{ env.CACHE_BUCKET }}
          insecure: ${{ env.INSECURE_CACHE }}
          key: cargo-deps-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-deps-
          path: |
            ~/.cargo
            target

      - name: Cargo Check
        run: |
          cargo check --all-features
          cargo check --tests --all-features

  test-debug:
    name: Test Debug (Single Fast Test)
    needs: [compute-tag, build-test-artifacts]
    runs-on: arc-sh-runners
    container:
      image: zingodevops/zaino-ci:${{ needs.compute-tag.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v4

      # Skip cargo restore for faster debugging - nextest archive has what we need
      #- name: Restore cargo dependencies
      #  uses: tespkg/actions-cache/restore@v1
      #  with:
      #    endpoint: ${{ env.CACHE_ENDPOINT }}
      #    port: ${{ env.CACHE_PORT }}
      #    bucket: ${{ env.CACHE_BUCKET }}
      #    insecure: ${{ env.INSECURE_CACHE }}
      #    key: cargo-deps-${{ hashFiles('**/Cargo.lock') }}
      #    restore-keys: cargo-deps-
      #    path: |
      #      ~/.cargo
      #      target/debug/deps

      - name: Setup test binaries
        run: |
          echo "=== Current working directory ==="
          pwd

          echo ""
          echo "=== Creating test_binaries/bins directory ==="
          mkdir -p test_binaries/bins

          echo ""
          echo "=== Running entrypoint script with correct paths ==="
          # The entrypoint expects these arguments:
          # $1: REPO_ROOT (default: /home/container_user/zaino)
          # Pass the actual GitHub workspace path
          /usr/local/bin/entrypoint.sh "${{ github.workspace }}"

          echo ""
          echo "=== Contents of test_binaries/bins ==="
          ls -la test_binaries/bins/

          echo ""
          echo "=== Testing binary execution ==="
          if [ -f test_binaries/bins/zcashd ]; then
            echo "zcashd version:"
            test_binaries/bins/zcashd --version || echo "Failed to run zcashd"
          else
            echo "zcashd not found!"
          fi

          if [ -f test_binaries/bins/zebrad ]; then
            echo "zebrad version:"
            test_binaries/bins/zebrad --version || echo "Failed to run zebrad"
          else
            echo "zebrad not found!"
          fi

          if [ -f test_binaries/bins/zcash-cli ]; then
            echo "zcash-cli version:"
            test_binaries/bins/zcash-cli --version || echo "Failed to run zcash-cli"
          else
            echo "zcash-cli not found!"
          fi

          echo ""
          echo "=== Checking symlink targets ==="
          ls -la test_binaries/bins/ | grep -E "zcashd|zebrad|zcash-cli" || echo "No binaries found"

          echo ""
          echo "=== TEST_BINARIES_DIR will be set to: ${{ github.workspace }}/test_binaries/bins ==="

      - name: Restore nextest archive from S3
        uses: tespkg/actions-cache/restore@v1
        with:
          endpoint: ${{ env.CACHE_ENDPOINT }}
          port: ${{ env.CACHE_PORT }}
          bucket: ${{ env.CACHE_BUCKET }}
          insecure: ${{ env.INSECURE_CACHE }}
          key: nextest-archive-${{ github.sha }}
          path: nextest-archive.tar.zst

      - name: Run Single Fast Test
        env:
          TEST_BINARIES_DIR: ${{ github.workspace }}/test_binaries/bins
        run: |
          # Run just the basic zcashd test from zaino-testutils - no retries for debug
          cargo nextest run --verbose --archive-file nextest-archive.tar.zst \
            --workspace-remap ./ -E 'test(launch_testmanager::zcashd::basic)' \
            --no-fail-fast --failure-output immediate --success-output immediate

  test:
    name: Tests
    needs: [compute-tag, build-test-artifacts]
    runs-on: arc-sh-runners
    if: false  # Temporarily disabled for faster CI iteration
    container:
      image: zingodevops/zaino-ci:${{ needs.compute-tag.outputs.image-tag }}
    strategy:
      fail-fast: false
      matrix:
        partition:
          - "integration-tests::fetch_service"
          - "integration-tests::state_service"
          - "integration-tests::local_cache"
          - "integration-tests::wallet_to_validator"
          - "zaino-testutils"

    steps:
      - uses: actions/checkout@v4

      - name: Restore cargo dependencies
        uses: tespkg/actions-cache/restore@v1
        with:
          endpoint: ${{ env.CACHE_ENDPOINT }}
          port: ${{ env.CACHE_PORT }}
          bucket: ${{ env.CACHE_BUCKET }}
          insecure: ${{ env.INSECURE_CACHE }}
          key: cargo-deps-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-deps-
          path: |
            ~/.cargo
            target/debug/deps

      - name: Setup test binaries
        run: |
          # Run the entrypoint script to create symlinks
          /usr/local/bin/entrypoint.sh

      - name: Restore nextest archive from S3
        uses: tespkg/actions-cache/restore@v1
        with:
          endpoint: ${{ env.CACHE_ENDPOINT }}
          port: ${{ env.CACHE_PORT }}
          bucket: ${{ env.CACHE_BUCKET }}
          insecure: ${{ env.INSECURE_CACHE }}
          key: nextest-archive-${{ github.sha }}
          path: nextest-archive.tar.zst

      - name: Run Tests (Nextest)
        env:
          TEST_BINARIES_DIR: ${{ github.workspace }}/test_binaries/bins
        run: |
          cargo nextest run --verbose --profile ci --retries 2 --archive-file nextest-archive.tar.zst \
            --workspace-remap ./ --filterset "binary_id(${{ matrix.partition }})" ${{ env.NEXTEST-FLAGS }}

      - name: Test Summary
        uses: test-summary/action@v2
        with:
          paths: "target/nextest/ci/junit.xml"
        if: always()

  fmt:
    name: Rustfmt
    runs-on: arc-sh-runners
    needs: compute-tag
    if: false  # Temporarily disabled for faster CI iteration
    container:
      image: zingodevops/zaino-ci:${{ needs.compute-tag.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v4

      - name: MinIO Cache (cargo + target)
        uses: tespkg/actions-cache@v1
        with:
          endpoint: ${{ env.CACHE_ENDPOINT }}
          port: ${{ env.CACHE_PORT }}
          bucket: ${{ env.CACHE_BUCKET }}
          insecure: ${{ env.INSECURE_CACHE }}
          key: cargo-deps-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-deps-
          path: |
            ~/.cargo
            target

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: arc-sh-runners
    needs: compute-tag
    if: false  # Temporarily disabled for faster CI iteration
    container:
      image: zingodevops/zaino-ci:${{ needs.compute-tag.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v4

      - name: MinIO Cache (cargo + target)
        uses: tespkg/actions-cache@v1
        with:
          endpoint: ${{ env.CACHE_ENDPOINT }}
          port: ${{ env.CACHE_PORT }}
          bucket: ${{ env.CACHE_BUCKET }}
          insecure: ${{ env.INSECURE_CACHE }}
          key: cargo-deps-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-deps-
          path: |
            ~/.cargo
            target

      # This is key to decide on the clippy job to run.
      # The one from actions-rs prints nice annotations accross the pr, when browsing the changed files, right where the actual warning/error was found.
      # It requires access to the GITHUB_TOKEN tho, a secret github automatically injects into every workflow run, but only for internally owned branches, not for forks.
      # If that's the case, then we just run clippy with console output and that's it. One get's no annotations and has to check the actual job logs to see what went wrong.

      - name: Run clippy with console output (external contributors)
        if: github.secret_source != 'Actions'
        run: cargo clippy --all-targets -- --deny warnings

      - name: Output clippy to Github
        if: github.secret_source == 'Actions'
        uses: actions-rs/clippy-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          args: --all-targets -- --deny warnings

  doc:
    name: Cargo Doc
    runs-on: arc-sh-runners
    needs: compute-tag
    if: false  # Temporarily disabled for faster CI iteration
    container:
      image: zingodevops/zaino-ci:${{ needs.compute-tag.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v4

      - name: MinIO Cache (cargo + target)
        uses: tespkg/actions-cache@v1
        with:
          endpoint: ${{ env.CACHE_ENDPOINT }}
          port: ${{ env.CACHE_PORT }}
          bucket: ${{ env.CACHE_BUCKET }}
          insecure: ${{ env.INSECURE_CACHE }}
          key: cargo-deps-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-deps-
          path: |
            ~/.cargo
            target

      - name: Check documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --document-private-items

  whitespace:
    name: Whitespace check
    runs-on: arc-sh-runners
    needs: compute-tag
    if: false  # Temporarily disabled for faster CI iteration
    container:
      image: zingodevops/zaino-ci:${{ needs.compute-tag.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v4

      - name: MinIO Cache (cargo + target)
        uses: tespkg/actions-cache@v1
        with:
          endpoint: ${{ env.CACHE_ENDPOINT }}
          port: ${{ env.CACHE_PORT }}
          bucket: ${{ env.CACHE_BUCKET }}
          insecure: ${{ env.INSECURE_CACHE }}
          key: cargo-deps-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-deps-
          path: |
            ~/.cargo
            target

      - name: Check trailing whitespace
        run: ./utils/trailing-whitespace.sh reject
        working-directory: .

name: Trigger Integration Tests

on:
  pull_request:
    branches: [dev]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - .cargo/config.toml
      - .github/workflows/trigger-integration-tests.yml

  push:
    branches: [dev]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - .cargo/config.toml
      - .github/workflows/trigger-integration-tests.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  trigger-integration:
    name: Trigger integration tests
    runs-on: ubuntu-latest
    # Pull requests from a fork receive no repository secrets, so the app-token
    # step below is handed empty `app-id` / `private-key` inputs and the job dies
    # at its first step — failing every external contribution, which CONTRIBUTING.md
    # asks to be made from a personal fork. Dispatching the integration suite is a
    # zingolabs-internal action, not a gate on contributor code, so skip it on
    # forks instead. The `push` clause is required: `github.event.pull_request` is
    # null outside pull-request events, which would otherwise disable the
    # merge-to-`dev` dispatch as well. See issue #991.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DISPATCH_APP_ID }}
          private-key: ${{ secrets.DISPATCH_APP_PRIVATE_KEY }}
          owner: zcash
          repositories: integration-tests

      - name: Get requested test branch, if any
        if: github.event_name == 'pull_request'
        id: test-branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          TEST_SHA=$(gh pr -R zingolabs/zaino list --search "${HEAD_SHA}" --json body | jq '.[0].body' | sed '/[^ ]ZIT-Revision/!d' | sed -E 's/.*ZIT-Revision: ([^\\]*)\\.*/\1/')
          echo "test_sha=${TEST_SHA}" >> $GITHUB_OUTPUT

      - name: Trigger integration tests
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TEST_SHA: ${{ steps.test-branch.outputs.test_sha }}
        run: >
          gh api repos/zcash/integration-tests/dispatches
          --field event_type="zaino-interop-request"
          --field client_payload[sha]="${SHA}"
          --field client_payload[test_sha]="${TEST_SHA}"

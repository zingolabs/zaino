name: Set up relman
description: Build the `relman` release-manager CLI and put it on PATH.

runs:
  using: composite
  steps:
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: tools/relman

    - shell: bash
      run: |
        cargo build --release --manifest-path tools/relman/Cargo.toml
        echo "${GITHUB_WORKSPACE}/tools/relman/target/release" >> "${GITHUB_PATH}"

[package]
name = "zaino-proto"
description = "Holds tonic files and build logic for the lightwallet and darkside RPCs."
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
version = { workspace = true }

[features]
default = ["heavy"]
heavy = ["dep:zebra-state", "dep:zebra-chain", "dep:which"]

[dependencies]
zebra-state = { workspace = true, optional = true }
zebra-chain = { workspace = true, optional = true }

# Miscellaneous Workspace
tonic = { workspace = true }

# Miscellaneous Crate
prost = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true, features = ["prost"] }
which = { workspace = true, optional = true }

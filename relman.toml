# relman.toml — the repo-committed versioning-target manifest.
#
# The single source of truth for what relman governs: each versioning target,
# its location, and per-target options. Changeset enforcement validates a
# change's `crate` against these targets, versions/bumps apply only to them,
# and the publish plan covers exactly this set. No `cargo metadata` heuristic
# decides governance — this file does.
#
# Target set = every `packages/*` crate without `publish = false`, and nothing
# else. The unpublished ones (e.g. zaino-grpc) and the separate
# `live-tests` workspace are absent by that rule, not by exception.
#
# A target may not depend on a non-target through a path + version requirement:
# `cargo publish` resolves that requirement against crates.io, so an ungoverned
# dependency would never be released.

[options]
changesets_dir      = ".changesets"
root_manifest       = "Cargo.toml"
workspace_changelog = "CHANGELOG.md"
# The consumed-UID ledger: one file listing every already-shipped changeset id.
# CI refreshes it from `origin/stable` before deriving, so a released changeset
# is excluded by id even when its per-file `consumed_in` mark hasn't yet
# backported to `dev`. relman reads it as a pure input; it never edits it here.
consumed_ledger     = ".release/consumed-ledger.toml"

# Per target: `changelog` defaults to `<path>/CHANGELOG.md`; `publish` to true.


[[target]]
name = "zainod"
path = "packages/zainod"

[[target]]
name = "zaino-chainview"
path = "packages/zaino-chainview"


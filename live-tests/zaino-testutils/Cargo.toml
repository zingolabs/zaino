[package]
name = "zaino-testutils"
description = "Shared helpers for Zaino live tests running on the ztest Kubernetes harness."
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
version = { workspace = true }
publish = false

[dependencies]
# The k8s test harness. Owns validator/indexer/wallet lifecycle and exposes
# typed RPC handles back to test code (replaces zcash_local_net's subprocess
# launcher and Zaino's in-process service subscribers).
ztest = { workspace = true }

# `anyhow::Result` on the parity helpers; JSON-RPC response comparison in the
# `json` / `rpc` parity helpers.
anyhow = { workspace = true }
serde_json = { workspace = true }

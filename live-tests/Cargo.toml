[workspace]
members = [
    "integration",
    "zaino-testutils",
]
# e2e is its own workspace (devtool wallet-client stack, separate Cargo.lock).
exclude = ["e2e"]
resolver = "2"

[workspace.package]
authors = ["Zingo Lab Cyan"]
repository = "https://github.com/zingolabs"
homepage = "https://www.zingolabs.org/"
edition = "2021"
license = "Apache-2.0"
version = "0.2.0"

[workspace.dependencies]
# Workspace members
# default-features = false so the default-on `zcashd_support` feature can be
# dropped via `--no-default-features`; consumers re-enable it by forwarding
# `zcashd_support`. See docs/adr/0001-zcashd-support-feature-gate.md.
zaino-testutils = { path = "zaino-testutils", default-features = false }

# Non-member path deps (from parent workspace)
zaino-proto = { path = "../packages/zaino-proto" }
zaino-state = { path = "../packages/zaino-state", default-features = false }
zaino-serve = { path = "../packages/zaino-serve", default-features = false }
zaino-common = { path = "../packages/zaino-common" }
zaino-fetch = { path = "../packages/zaino-fetch", default-features = false }
zainod = { path = "../packages/zainod", default-features = false }

# Zingo-infra (validator launcher; not a wallet dep)
# TEMPORARY (zingolabs/infrastructure#269): pinned to a specific commit on the
# `add_client_support` branch (not the branch itself) so every machine
# resolves the same code — the Cargo.lock files are gitignored, and a moving
# branch ref otherwise resolves differently per cargo cache. Bump this rev as
# the coordinated work advances; restore the release tag once tagged upstream.
zcash_local_net = { git = "https://github.com/zingolabs/infrastructure.git", rev = "0cc7dab7d12dd906c23deddd4e1fc3c42cf0f083" }

# Librustzcash
zcash_protocol = { version = "0.9", features = ["local-consensus"] }
zcash_client_backend = "0.23"

# Zebra
zebra-chain = "10.0.0"
zebra-state = "9.0.0"
zebra-rpc = "10.0.0"

# Runtime
tokio = { version = "1.38", features = ["full"] }

# Network
http = "1.1"
tonic = "0.14"
tower = { version = "0.4", features = ["buffer", "util"] }

# Misc
anyhow = "1.0"
corez = "0.1"
futures = "0.3.30"
hex = "0.4"
once_cell = "1.20"
portpicker = "0.1"
serde_json = "1.0"
tempfile = "3.2"
tracing = "0.1"
wire_serialized_transaction_test_data = "1.0.0"
zip32 = "0.2.1"

[profile.test]
opt-level = 3
debug = true

# Mirror of root Cargo.toml [patch.crates-io]: pins zebra to an unreleased rev
# that makes ReadRequest::NonFinalizedBlocksListener a struct variant carrying
# `known_chain_tips`. All workspaces that build zaino-state must carry the
# identical patch (zaino-state is a path dep — it compiles against the host
# workspace's patched zebra). See docs/updating_zebra_crates.md. Tracking:
# zaino#<TODO-revert-zebra-fork>.
[patch.crates-io]
zebra-chain = { git = "https://github.com/ZcashFoundation/zebra.git", rev = "9a27f886a5bfb143f65d1712e912cef252426800" }
zebra-rpc = { git = "https://github.com/ZcashFoundation/zebra.git", rev = "9a27f886a5bfb143f65d1712e912cef252426800" }
zebra-state = { git = "https://github.com/ZcashFoundation/zebra.git", rev = "9a27f886a5bfb143f65d1712e912cef252426800" }

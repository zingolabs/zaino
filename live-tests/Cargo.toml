[workspace]
members = [
    "zaino-testutils",
    "clientless",
    "e2e",
    "non-finalized-state",
]
resolver = "2"

[workspace.package]
authors = ["Zingo Lab Cyan"]
repository = "https://github.com/zingolabs"
homepage = "https://www.zingolabs.org/"
edition = "2021"
license = "Apache-2.0"
version = "0.2.0"

[workspace.dependencies]
zaino-testutils = { path = "zaino-testutils" }
# TODO: back to a crates.io version once ztest releases the rewritten zainod backend (the same
# unreleased ztest `sync/` builds against; git rev once pushed)
ztest = { path = "../../ztest" }
tokio = { version = "1.38", features = ["full"] }
anyhow = "1.0"
serde_json = { version = "1.0", features = ["preserve_order"] }

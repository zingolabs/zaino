[package]
name = "sync-bench"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
description = "Live benchmark: sync Zcash indexes against a Zebra validator."

[[bin]]
name = "sync-headers"
path = "src/main.rs"

[dependencies]
zaino-primitives.workspace = true
zaino-indexes.workspace = true
zaino-rpc.workspace = true
zaino-source.workspace = true
zaino-source-zebra-rpc.workspace = true
zaino-source-zebra-readstate.workspace = true
zebra-chain = { workspace = true }
zaino-sync = { workspace = true, features = ["testing"] }
zaino-persistence = { workspace = true, features = ["testing"] }
zaino-backend-lmdb.workspace = true
futures = "0.3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

# Standalone workspace, not a member of the root one or of `live-tests`
#
# - Links no Zaino production code: drives zainod out-of-process (a pod) over gRPC + JSON-RPC
# - Its tree (ztest + its cluster clients) stays out of every production lock
[workspace]
members = ["."]
resolver = "2"

[package]
name = "sync"
description = "Chain-sync profiles with Zaino as the system under test: zainod builds its index to the mainnet tip, then each index is held to zebra. Each is a `#[ztest::sync_test]` launched via `ztest sync start`."
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Each profile carries its own probes and oracles (live-tests/CLAUDE.md: no shared assertions)
[dev-dependencies]
# TODO: crates.io once ztest ships phases and pod exec/kill
ztest = { path = "../../../ztest-status" }
tokio = { version = "1.38", features = ["full"] }
serde_json = "1.0"
anyhow = "1.0.104"
tonic = { version = "0.14", default-features = false }

[workspace]
members = [
    "packages/zaino-grpc-snapshot",
    "packages/zaino-index-compact-block",
    "packages/zaino-index-tree-state",
    "packages/zaino-index-transparent-address",
    "packages/zaino-internal-block-hash-to-height",
    "packages/zaino-internal-txid-location",
    "packages/zaino-index-utxo-set",
    "packages/zaino-chainview",
    "packages/zaino-nfs",
    "packages/zaino-header-chain",
    "packages/zaino-persistence",
    "packages/zaino-primitives",
    "packages/zaino-sync",
    "packages/zaino-source",
    "packages/zaino-proto",
    "packages/zaino-peers",
    "packages/zaino-traffic",
    # live-tests/ = standalone workspace (ztest harness, links no production crate)
]

# Use the edition 2021 dependency resolver in the workspace, to match the crates
resolver = "2"

[workspace.package]
# Lockstep: every crate ships at this version (the `zaino-*` entries below match it)
version = "0.11.0-alpha.4"
authors = ["Zingo Lab Cyan"]
repository = "https://github.com/zingolabs"
homepage = "https://www.zingolabs.org/"
edition = "2021"
license = "Apache-2.0"
# Never on crates.io (zainod ships as an image)
publish = false


[workspace.dependencies]

# Librustzcash
incrementalmerkletree = "0.9"
orchard = { version = "0.16", default-features = false, features = ["multicore"] }
sapling-crypto = "0.9"
zcash_address = "0.14.0-pre.1"
zcash_protocol = { version = "=0.11.0-pre.0", features = ["local-consensus"] }
zcash_primitives = "=0.31.0-pre.1"
zcash_script = { version = "0.6", default-features = false }
zcash_transparent = "0.11.0-pre.1"

# Runtime
tokio = "1.38"
tokio-util = "0.7"
# Data-parallel commitment hashing (a fold runs on every core, not one blocking thread)
rayon = "1.12"
# zainod's allocator (musl's malloc serializes threads; image = Alpine)
tikv-jemallocator = "0.7"

# CLI
clap = "4.0"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["fmt", "env-filter"] }
# Plain HTTP only (validator JSON-RPC)
reqwest = { version = "0.13", default-features = false }
# Admin listener (/metrics, /livez)
hyper = "1.10"
hyper-util = "0.1.20"
tonic = { version = "0.14" }
prost = "0.14"
# Route dispatch and raw response bodies for the gRPC router.
tower = "0.5"
http-body-util = "0.1"
serde = "1.0"
serde_json = "1.0"
futures = "0.3.30"

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
metrics-process = "2.4"

# Utility
bytes = "1.12"
memmap2 = "0.9"
# sync_file_range (write-behind, no safe wrapper in rustix/nix)
libc = "0.2"
crc32fast = "1.4"
xorf = { version = "0.13", default-features = false, features = ["binary-fuse"] }
thiserror = "2.0"
# SIMD (AVX2 / SSSE3 / NEON, runtime-detected) hex: the `hex` crate decodes byte by byte
const-hex = "1.19"
toml = "1.1"
dirs = "6"

# Test
tempfile = "3.2"
# Domain vocabulary (heights, hashes, blocks, transactions)
zaino-primitives = { path = "packages/zaino-primitives", version = "0.11.0-alpha.4" }
zaino-persistence = { path = "packages/zaino-persistence", version = "0.11.0-alpha.4" }
zaino-sync = { path = "packages/zaino-sync", version = "0.11.0-alpha.4" }
# Non-finalized state: fetch, folds above the durable root, the finalized stream
zaino-nfs = { path = "packages/zaino-nfs", version = "0.11.0-alpha.4" }
# Validated Header tree: most-work tip above a trusted anchor
zaino-header-chain = { path = "packages/zaino-header-chain", version = "0.11.0-alpha.4" }
# Validator source: `ChainDataSource` port + its JSON-RPC and indexer-gRPC clients
zaino-source = { path = "packages/zaino-source", version = "0.11.0-alpha.4" }
zaino-proto = { path = "packages/zaino-proto", version = "0.11.0-alpha.4" }
zaino-peers = { path = "packages/zaino-peers", version = "0.11.0-alpha.4" }
zaino-traffic = { path = "packages/zaino-traffic", version = "0.11.0-alpha.4" }
zaino-chainview = { path = "packages/zaino-chainview", version = "0.11.0-alpha.4" }
zaino-grpc-snapshot = { path = "packages/zaino-grpc-snapshot", version = "0.11.0-alpha.4" }
zaino-grpc = { path = "packages/zaino-grpc", version = "0.11.0-alpha.4" }
# p2p layer (zaino-peers): zebra main on the same librustzcash/orchard/sapling forks patched below
zebra-chain = { git = "https://github.com/elicbarbieri/zebra.git", rev = "a300f0ad140b6b44b88cecf2385067568b7a575b", version = "14.0.0" }
zebra-network = { git = "https://github.com/elicbarbieri/zebra.git", rev = "a300f0ad140b6b44b88cecf2385067568b7a575b", version = "14.0.0" }
zebra-test = { git = "https://github.com/elicbarbieri/zebra.git", rev = "a300f0ad140b6b44b88cecf2385067568b7a575b", version = "4.0.0" }
# Height → gRPC-framed compact block, served as contiguous mmap spans
zaino-index-compact-block = { path = "packages/zaino-index-compact-block", version = "0.11.0-alpha.4" }
# Block hash <-> height: the locator every by-hash request resolves through.
zaino-internal-block-hash-to-height = { path = "packages/zaino-internal-block-hash-to-height", version = "0.11.0-alpha.4" }
# Txid -> mined location: where GetTransaction finds a mined transaction's block
zaino-internal-txid-location = { path = "packages/zaino-internal-txid-location", version = "0.11.0-alpha.4" }
# Outpoint -> value: each transaction's fee for compact blocks
zaino-index-utxo-set = { path = "packages/zaino-index-utxo-set", version = "0.11.0-alpha.4" }
# Height → commitment-tree state, subtree roots (any historical frontier, no hashing)
zaino-index-tree-state = { path = "packages/zaino-index-tree-state", version = "0.11.0-alpha.4" }
# Transparent address → receives + their spends (two maps, composed per query)
zaino-index-transparent-address = { path = "packages/zaino-index-transparent-address", version = "0.11.0-alpha.4" }


config = { version = "0.15", default-features = false, features = ["toml"] }
# < 1.7 = librustzcash's `test-dependencies` strategies (rand 0.8)
proptest = "1.6"
arc-swap = "1.7.1"
# TLS: ring provider only (both default to aws-lc-rs, banned in deny.toml)
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rcgen = "0.14.10"
# Persistent collections: a published snapshot shares structure with the one it
# came from rather than copying.
imbl = "7.0"
hashbrown = "0.16"

[profile.test]
opt-level = 3
debug = true

# Lazy point decompression stack (`CompressedTransaction`: block decode w/o curve arithmetic)
# - orchard = zcash/orchard#562 + perf/merkle-crh-weighted, sapling-crypto = zcash/sapling-crypto#204
#   + perf/pedersen-windowed, incrementalmerkletree = perf/combine-pairs (batched tree hashing),
#   librustzcash = elicbarbieri/librustzcash pr/lazy-point-decompression-v5 (on the -pre.1 release train)
# - Forks on the releases zebra main uses (orchard 0.16, sapling-crypto 0.9, incrementalmerkletree 0.9)
# - drop each once released
[patch.crates-io]
incrementalmerkletree = { git = "https://github.com/elicbarbieri/incrementalmerkletree.git", rev = "d5e07689456e0be0154934aa39d347a9e5f18765" }
orchard = { git = "https://github.com/elicbarbieri/orchard.git", rev = "426f5c77a7e1eab302f1088db6ac7679865d7ee4" }
sapling-crypto = { git = "https://github.com/elicbarbieri/sapling-crypto.git", rev = "3c14da616116271fdf48ec032bbf31195e5f6c7f" }
zcash_primitives = { git = "https://github.com/elicbarbieri/librustzcash.git", rev = "700969fda3ef70ec9f617e62634c43bbb97f9a72" }
zcash_protocol = { git = "https://github.com/elicbarbieri/librustzcash.git", rev = "700969fda3ef70ec9f617e62634c43bbb97f9a72" }
zcash_transparent = { git = "https://github.com/elicbarbieri/librustzcash.git", rev = "700969fda3ef70ec9f617e62634c43bbb97f9a72" }
zcash_address = { git = "https://github.com/elicbarbieri/librustzcash.git", rev = "700969fda3ef70ec9f617e62634c43bbb97f9a72" }
zcash_encoding = { git = "https://github.com/elicbarbieri/librustzcash.git", rev = "700969fda3ef70ec9f617e62634c43bbb97f9a72" }
equihash = { git = "https://github.com/elicbarbieri/librustzcash.git", rev = "700969fda3ef70ec9f617e62634c43bbb97f9a72" }

# Release codegen a profiler can attribute to source lines (`release` stays lean)
# - Frame pointers = other half, no Cargo key for them: pass
#   `-C force-frame-pointers=yes` via RUSTFLAGS alongside `--profile profiling`
[profile.profiling]
inherits = "release"
debug = "line-tables-only"

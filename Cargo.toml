# Workspace Members are in dependency order, do not change this without prior consideration.
[workspace]
members = [
    "packages/zaino-status",
    "packages/zaino-async",
    "packages/zaino-logging",
    "packages/zaino-component",
    "packages/zaino-core",
    "packages/zaino-service",
    "packages/zaino-runtime",
    "packages/zaino-wallet",
    "packages/zaino-lightserve",
    "packages/zaino-noderpc",
    "packages/zaino-store-service",
    "packages/zaino-store",
    "packages/zaino-persistence-macros",
    "packages/zaino-persistence-codec",
    "packages/zaino-consensus",
    "packages/zaino-primitives",
    "packages/zaino-persistence",
    "packages/zaino-backend-lmdb",
    "packages/zaino-sync",
    "packages/zaino-indexes",
    "packages/zaino-indexer",
    "packages/zaino-address",
    "packages/zaino-source-macros",
    "packages/zaino-source",
    "packages/zaino-rpc",
    "packages/zaino-source-zebra-rpc",
    "packages/zaino-mempool",
    "packages/zaino-mempool-service",
    "packages/zaino-chain-head",
    "packages/zaino-chain-head-service",
    "packages/zaino-chainview",
    "packages/zainod",
    "packages/zaino-proto",
    # Cluster sync benchmark. A leaf consumer of the indexer/store crates; kept a
    # workspace member so it shares the production lockfile (reproducible cluster
    # builds) and is covered by workspace lints. See bench/sync-bench.
    "bench/sync-bench",
    # NOTE: live-tests/ is its own standalone workspace (see
    # live-tests/Cargo.toml). It has been migrated onto the ztest k8s harness
    # (`ztest` from crates.io), which stands the system up as deployed images and
    # drives it over its served interfaces, so the suite links no production
    # crate and shares no lockfile with one. Build and run it from live-tests/.
]

# Use the edition 2021 dependency resolver in the workspace, to match the crates
resolver = "2"

[workspace.package]
authors = ["Zingo Lab Cyan"]
repository = "https://github.com/zingolabs"
homepage = "https://www.zingolabs.org/"
edition = "2021"
license = "Apache-2.0"


[workspace.dependencies]

# Librustzcash
incrementalmerkletree = "0.8"
sapling-crypto = "0.7"
zcash_address = "0.13"
zcash_keys = "0.16"
zcash_protocol = "0.10"
zcash_primitives = "0.30"
zcash_transparent = "0.10"

# Zebra
zebra-chain = "12.0"

# Runtime
tokio = { version = "1.38", features = ["full"] }
tokio-util = "0.7"

# CLI
clap = "4.0"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = [
    "fmt",
    "env-filter",
    "time",
    "json",
] }
tracing-tree = "0.4"
time = { version = "0.3", features = ["macros", "formatting"] }
# Plain HTTP only (validator JSON-RPC)
reqwest = { version = "0.13", default-features = false }
tonic = { version = "0.14" }
prost = "0.14"
serde = "1.0"
serde_json = "1.0"
jsonrpsee = { version = "0.24", features = ["server", "macros"] }

# Hashmaps, channels, DBs
lmdb = "0.8"
futures = "0.3.30"

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }

# Utility
bytes = "1.12"
strum = { version = "0.27", features = ["derive"] }
thiserror = "2.0"
which = "8"
hex = "0.4"
toml = "1.1"
dirs = "6"

# Test
tempfile = "3.2"
# Service status and health-probe vocabulary. A leaf with one dependency
# (`tracing`), so any subsystem can report its status without inheriting a
# dependency graph to do it.
zaino-status = { path = "packages/zaino-status", version = "0.1.1" }
# Consensus-derived constants (reorg bound, coinbase maturity, block size limit)
# and the protocol-limit validation built on them. A leaf that depends on no
# node implementation, so referencing a consensus fact costs neither a
# general-purpose dependency nor a peer's reading of the specification.
zaino-consensus = { path = "packages/zaino-consensus", version = "0.1.0" }
# Zero-dependency domain vocabulary. Every crate that needs chain-level types
# (heights, hashes, blocks, transactions) depends on this rather than on
# `zebra-chain` or on another zaino crate. See docs/adr/zaino/0010.
zaino-primitives = { path = "packages/zaino-primitives", version = "0.2.0" }
zaino-persistence = { path = "packages/zaino-persistence", version = "0.1.0" }
zaino-backend-lmdb = { path = "packages/zaino-backend-lmdb", version = "0.1.0" }
zaino-sync = { path = "packages/zaino-sync", version = "0.1.0" }
zaino-indexes = { path = "packages/zaino-indexes", version = "0.1.0" }
# Driven port traits for validator access: one trait per question a consumer can
# ask, so each consumer's bound names exactly the capabilities it uses and an
# adapter that cannot answer a question simply does not implement it.
zaino-source = { path = "packages/zaino-source", version = "0.2.0" }
zaino-source-macros = { path = "packages/zaino-source-macros", version = "0.1.0" }
zaino-persistence-macros = { path = "packages/zaino-persistence-macros", version = "0.1.0" }
zaino-mempool = { path = "packages/zaino-mempool", version = "0.2.0" }
# JSON-RPC 2.0 transport shared by the RPC-backed source adapters.
zaino-rpc = { path = "packages/zaino-rpc", version = "0.2.0" }
# The validator source adapter: answers every source port over the Zcash JSON-RPC interface.
zaino-source-zebra-rpc = { path = "packages/zaino-source-zebra-rpc", version = "0.2.0" }
# ChainHead: the bounded non-finalised block graph, its canonical chain, and the
# competing branches retained alongside it. This crate is the domain half —
# types and ports only, no runtime — so a consumer can name what ChainHead
# answers without depending on the service that answers it. See docs/adr/zaino/0011.
zaino-chain-head = { path = "packages/zaino-chain-head", version = "0.1.0" }
# The ChainHead runtime: owns the writer task that keeps the graph reconciled
# with the validator, and publishes each snapshot. Separate from the domain
# crate so a consumer can name what ChainHead answers without depending on the
# machinery that answers it.
zaino-chain-head-service = { path = "packages/zaino-chain-head-service", version = "0.1.0" }
zaino-proto = { path = "packages/zaino-proto", version = "0.5.0" }


config = { version = "0.15", default-features = false, features = ["toml"] }
proptest = "~1.11"
arc-swap = "1.7.1"
rayon = "1.10"

[profile.test]
opt-level = 3
debug = true

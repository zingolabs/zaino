# Workspace Members are in dependency order, do not change this without prior consideration.
[workspace]
members = [
    "packages/zaino-grpc",
    "packages/zaino-index-compact-block",
    "packages/zaino-index-tree-state",
    "packages/zaino-index-transparent-address",
    "packages/zaino-internal-block-hash-to-height",
    "packages/zaino-internal-value-balance",
    "packages/zaino-chainview",
    "packages/zaino-persistence",
    "packages/zaino-primitives",
    "packages/zaino-sync",
    "packages/zaino-source",
    "packages/zaino-chain-head",
    "packages/zainod",
    "packages/zaino-proto",
    # live-tests/ = standalone workspace (ztest harness, links no production crate)
]

# Use the edition 2021 dependency resolver in the workspace, to match the crates
resolver = "2"

[workspace.package]
authors = ["Zingo Lab Cyan"]
repository = "https://github.com/zingolabs"
homepage = "https://www.zingolabs.org/"
edition = "2021"
license = "Apache-2.0"
# Publish metadata shared by every published crate, inherited via
# `readme.workspace = true` etc. crates.io requires `description` + `license`;
# `readme`/`keywords`/`categories` round out what `clippy::cargo_common_metadata`
# checks (see the `clippy` task in tools/makefiles/lints.toml). `readme` is
# resolved from the workspace root.
readme = "README.md"
keywords = ["zcash", "blockchain", "indexer", "lightwallet"]
categories = ["cryptography::cryptocurrencies"]


[workspace.dependencies]

# Librustzcash
incrementalmerkletree = "0.8"
orchard = { version = "0.15", default-features = false, features = ["multicore"] }
sapling-crypto = "0.7"
zcash_address = "0.13"
zcash_protocol = "0.10"
zcash_primitives = "0.30"
zcash_script = { version = "0.4", default-features = false }
zcash_transparent = "0.10"

# Runtime
tokio = { version = "1.38", features = ["full"] }
tokio-util = "0.7"
# Data-parallel commitment hashing (a fold runs on every core, not one blocking thread)
rayon = "1.12"

# CLI
clap = "4.0"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = [
    "fmt",
    "env-filter",
    "time",
    "json",
] }
time = { version = "0.3", features = ["macros", "formatting"] }
unicode-ellipsis = "0.6"
# Plain HTTP only (validator JSON-RPC)
reqwest = { version = "0.13", default-features = false }
# Admin listener (/metrics, /livez)
hyper = "1.10"
hyper-util = "0.1.20"
tonic = { version = "0.14" }
prost = "0.14"
# Route dispatch and raw response bodies for the gRPC router.
tower = "0.5"
http-body-util = "0.1"
serde = "1.0"
serde_json = "1.0"
futures = "0.3.30"

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
metrics-process = "2.4"

# Utility
bytes = "1.12"
memmap2 = "0.9"
# sync_file_range (write-behind; no safe wrapper in rustix/nix)
libc = "0.2"
crc32fast = "1.4"
xorf = { version = "0.13", default-features = false, features = ["binary-fuse"] }
thiserror = "2.0"
which = "8"
hex = "0.4"
toml = "1.1"
dirs = "6"

# Test
tempfile = "3.2"
# Domain vocabulary (heights, hashes, blocks, transactions)
zaino-primitives = { path = "packages/zaino-primitives", version = "0.2.1" }
zaino-sync = { path = "packages/zaino-sync", version = "0.1.0" }
# Driven port traits for validator access: one trait per question a consumer can
# ask, so each consumer's bound names exactly the capabilities it uses and an
# adapter that cannot answer a question simply does not implement it.
zaino-source = { path = "packages/zaino-source", version = "0.2.1" }
# ChainHead: the in-memory non-final window of the best chain (reorg replay without refetch)
zaino-chain-head = { path = "packages/zaino-chain-head", version = "0.1.1" }
zaino-proto = { path = "packages/zaino-proto", version = "0.6.0" }
# CompactBlockIndex's storage engine: gRPC-framed records in append-only files,
# served as contiguous mmap spans.
zaino-index-compact-block = { path = "packages/zaino-index-compact-block", version = "0.1.0" }
# Block hash <-> height: the locator every by-hash request resolves through.
zaino-internal-block-hash-to-height = { path = "packages/zaino-internal-block-hash-to-height", version = "0.1.0" }
# Outpoint -> value: every transaction's value balance (fees), published for compact blocks.
zaino-internal-value-balance = { path = "packages/zaino-internal-value-balance", version = "0.1.0" }
# TreeStateIndex's storage: retained commitment-tree nodes, per-height sizes,
# subtree roots. Rebuilds any historical frontier with no hashing.
zaino-index-tree-state = { path = "packages/zaino-index-tree-state", version = "0.1.0" }
# TransparentAddressIndex's storage: `receives` and `spent` as two immutable
# sorted-run projections, composed per query.
zaino-index-transparent-address = { path = "packages/zaino-index-transparent-address", version = "0.1.0" }


config = { version = "0.15", default-features = false, features = ["toml"] }
# < 1.7 = librustzcash's `test-dependencies` strategies (rand 0.8)
proptest = "1.6"
arc-swap = "1.7.1"
# Persistent collections: a published snapshot shares structure with the one it
# came from rather than copying.
imbl = "7.0"

[profile.test]
opt-level = 3
debug = true

# Lazy point decompression stack (`CompressedTransaction`: block decode w/o curve arithmetic)
# - orchard = zcash/orchard#562 + perf/merkle-crh-weighted, sapling-crypto = zcash/sapling-crypto#204
#   + perf/pedersen-windowed, incrementalmerkletree = perf/combine-pairs (batched tree hashing),
#   librustzcash = elicbarbieri/librustzcash pr/lazy-point-decompression-v2 (on
#   pr/vector-read-bytes; pinned by rev); drop each once released
[patch.crates-io]
incrementalmerkletree = { git = "https://github.com/elicbarbieri/incrementalmerkletree.git", rev = "61325f3795048031a6941db591cd6773f774e724" }
orchard = { git = "https://github.com/elicbarbieri/orchard.git", rev = "e4f1e2c89e13c8f2fe0e5263a8e2df6a40cb4a4e" }
sapling-crypto = { git = "https://github.com/elicbarbieri/sapling-crypto.git", rev = "95bb788bc302e43703baca9c07f8e5b6296a8e44" }
zcash_primitives = { git = "https://github.com/elicbarbieri/librustzcash.git", rev = "7f985adaa915668264b68ff6d5de7b8d85bff8bc" }
zcash_protocol = { git = "https://github.com/elicbarbieri/librustzcash.git", rev = "7f985adaa915668264b68ff6d5de7b8d85bff8bc" }
zcash_transparent = { git = "https://github.com/elicbarbieri/librustzcash.git", rev = "7f985adaa915668264b68ff6d5de7b8d85bff8bc" }
zcash_address = { git = "https://github.com/elicbarbieri/librustzcash.git", rev = "7f985adaa915668264b68ff6d5de7b8d85bff8bc" }
equihash = { git = "https://github.com/elicbarbieri/librustzcash.git", rev = "7f985adaa915668264b68ff6d5de7b8d85bff8bc" }

# Release codegen a profiler can attribute to source lines (`release` stays lean)
# - Frame pointers = other half, no Cargo key for them: pass
#   `-C force-frame-pointers=yes` via RUSTFLAGS alongside `--profile profiling`
[profile.profiling]
inherits = "release"
debug = "line-tables-only"

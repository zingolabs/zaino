# Workspace Members are in dependency order, do not change this without prior consideration.
[workspace]
members = [
    "packages/zaino-common",
    "packages/zainod",
    "packages/zaino-serve",
    "packages/zaino-state",
    "packages/zaino-fetch",
    "packages/zaino-proto",
    # NOTE: live-tests/ is now its own standalone workspace (see
    # live-tests/Cargo.toml). It has been migrated onto the ztest k8s harness
    # (sibling repo `../ztest` — a path dep carrying heavy deps + the zebra-fork
    # patch), so it is intentionally excluded from the root workspace to keep the
    # production build isolated from the test harness. Build it from live-tests/.
]
# `default-members` == `members` here (the live-test crates are a separate
# standalone workspace under live-tests/, not members). A bare `cargo nextest
# run` therefore tests exactly the production crates; the live suite runs from
# live-tests/ on the ztest harness (`makers test live`). See docs/adr/0002.
default-members = [
    "packages/zaino-common",
    "packages/zainod",
    "packages/zaino-serve",
    "packages/zaino-state",
    "packages/zaino-fetch",
    "packages/zaino-proto",
]

# Use the edition 2021 dependency resolver in the workspace, to match the crates
resolver = "2"

[workspace.package]
authors = ["Zingo Lab Cyan"]
repository = "https://github.com/zingolabs"
homepage = "https://www.zingolabs.org/"
edition = "2021"
license = "Apache-2.0"


[workspace.dependencies]

# Librustzcash
incrementalmerkletree = "0.8"
zcash_address = "0.13"
zcash_keys = "0.15"
zcash_protocol = "0.10"
zcash_primitives = "0.29"
zcash_transparent = "0.9"

# Zebra
zebra-chain = "11.1"
zebra-state = "10.1"
zebra-rpc = "11.1"

# Runtime
tokio = { version = "1.38", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"

# CLI
clap = "4.0"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = [
    "fmt",
    "env-filter",
    "time",
    "json",
] }
tracing-tree = "0.4"
time = { version = "0.3", features = ["macros", "formatting"] }

# Network / RPC
http = "1.1"
url = "2.5"
reqwest = { version = "0.13", default-features = false, features = [
    "cookies",
    "rustls-no-provider",
    "webpki-roots",
] }
tower = { version = "0.4", features = ["buffer", "util"] }
tonic = { version = "0.14" }
prost = "0.14"
serde = "1.0"
serde_json = "1.0"
jsonrpsee-types = "0.24"
jsonrpsee = { version = "0.24", features = ["server", "macros"] }

# Hashmaps, channels, DBs
indexmap = "2.2.6"
dashmap = "6.1"
lmdb = "0.8"
lmdb-sys = "0.8"
futures = "0.3.30"

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }

# Utility
thiserror = "2.0"
chrono = "0.4"
which = "8"
whoami = "2.1"
corez = "0.1"

# Formats
base64 = "0.22"
sha2 = "0.10"
blake2 = "0.10"
hex = "0.4"
toml = "1.1"
primitive-types = "0.14"
bitflags = "2.9"

# Test
tempfile = "3.2"
zaino-common = { path = "packages/zaino-common", version = "0.2.0" }
# default-features = false so the default-on `zcashd_support` feature can be
# dropped end-to-end via `--no-default-features`; each consumer re-enables it
# by forwarding `zcashd_support` in its own `default`. See
# docs/adr/0001-zcashd-support-feature-gate.md.
zaino-fetch = { path = "packages/zaino-fetch", version = "0.2.1", default-features = false }
zaino-proto = { path = "packages/zaino-proto", version = "0.1.4" }
zaino-state = { path = "packages/zaino-state", version = "0.3.1", default-features = false }
zaino-serve = { path = "packages/zaino-serve", version = "0.3.1", default-features = false }
wire_serialized_transaction_test_data = "1.0.0"
config = { version = "0.15", default-features = false, features = ["toml"] }
proptest = "~1.11"
arc-swap = "1.7.1"
derive_more = "2.0.1"

[profile.test]
opt-level = 3
debug = true

[profile.release]
debug = "line-tables-only"

[patch.crates-io]

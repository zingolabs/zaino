[package]
name = "relman-config"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "relman.toml config adapter: parses the manifest into typed core newtypes"

[features]
# Exposes a hand-built `ReleaseConfig` constructor for downstream unit tests,
# bypassing the `relman.toml` load path. Never enabled in release builds.
test-support = []

[dependencies]
relman-core = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }

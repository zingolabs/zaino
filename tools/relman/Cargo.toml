# Isolated dev-tooling workspace: its own `[workspace]` root (like
# `tools/workbench`), so `relman` is NOT a member of Zaino's production
# workspace and never drags into (or is dragged by) the production graph.
# Every member is `publish = false` — relman runs in-repo only.
[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/domain",
    "crates/config",
    "crates/adapters",
    "crates/cli",
    "crates/app",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = ""
publish = false

[workspace.dependencies]
relman-core = { path = "crates/core", version = "0.1.0" }
relman-domain = { path = "crates/domain", version = "0.1.0" }
relman-config = { path = "crates/config", version = "0.1.0" }
relman-adapters = { path = "crates/adapters", version = "0.1.0" }
relman-cli = { path = "crates/cli", version = "0.1.0" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
# Declared once for later slices: config (relman.toml parsing) will pull in
# serde + toml; the derivation services will use thiserror for typed errors.
# An unreferenced workspace dependency is not compiled, so these are free until
# a member opts in.
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"
# Semantic versioning: the `Version` newtype wraps `semver::Version`, and the
# `Workspace` port traffics in `semver::VersionReq` for dependency-edge
# requirements. `cargo_metadata` re-uses semver 1.x, so the types unify.
semver = "1"
# Reads resolved crate versions and inter-crate dependency requirements from the
# repo-root workspace, handling `version.workspace`/`workspace.dependencies`
# inheritance that hand-parsing Cargo.toml would miss. Adapters-only.
cargo_metadata = "0.19"
# Format-preserving TOML editing: the manifest editor mutates a single field of
# a `Cargo.toml` and writes it back with all comments and formatting intact.
# Adapters-only. (Same 0.22 line `toml` 0.8 already pulls in transitively.)
toml_edit = "0.22"
